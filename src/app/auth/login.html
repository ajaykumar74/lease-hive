<div class="px-8 min-h-screen flex flex-col justify-center items-center">
    <div class="mb-6">
        <p-messages></p-messages>
    </div>
    <!-- Login Box -->
    <div style="padding-top: 10px;"
        class="border border-surface-200 dark:border-surface-700 bg-surface-0 dark:bg-surface-900 rounded py-16 px-6 md:px-16 z-10">
        <div class="mb-6 flex flex-col justify-center items-center">
            <img src="demo/images/fleetpro-icon.png" alt="Fleet Hive" class="mx-auto w-40 h-50 object-contain" />
        </div>
        <div class="mb-6">
            <div class="text-surface-900 dark:text-surface-0 text-xl font-bold mb-2">
                Welcome back
            </div>
            <span class="text-surface-600 dark:text-surface-200 font-medium">Sign in to your FleetHive account</span>
        </div>

        <div class="flex flex-col">
            <p-iconfield class="w-full mb-6">
                <p-inputicon class="pi pi-envelope" />
                <input id="email" type="text" pInputText [(ngModel)]="loginData.Username" class="w-full md:w-[25rem]"
                    placeholder="Email" />
            </p-iconfield>

            <p-iconfield class="w-full mb-6">
                <p-inputicon class="pi pi-lock" />
                <input id="password" type="password" pInputText [(ngModel)]="loginData.Password"
                    class="w-full md:w-[25rem]" placeholder="Password" />
            </p-iconfield>

            <div class="mb-6 flex flex-wrap gap-4">
                <div class="flex items-center">
                    <p-checkbox name="checkbox" value="val" [(ngModel)]="loginData.RememberMe" styleClass="mr-2"
                        class="flex" [binary]="true"></p-checkbox>
                    <label for="checkbox" class="text-surface-900 dark:text-surface-0 font-medium mr-20">Remember
                        Me</label>
                </div>
                <a (click)="forgotClicked()"
                    class="text-surface-600 dark:text-surface-200 cursor-pointer hover:text-primary ml-auto transition-colors duration-300">Forgot
                    password</a>
            </div>

            <button pButton pRipple label="{{btnCaption}}" class="w-full" (click)="loginClicked()"
                [disabled]="submitted"></button>
        </div>
        <div class="divider">
            <span>or</span>
        </div>
        <div class="flex justify-center mt-4">
            <button type="button" class="google-btn" (click)="loginWithGoogle()">
                <span class="google-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                </span>
                <span class="google-text">Sign in with Google</span>
            </button>
        </div>
        <hr class="mt-8">
        <div class="mt-2 flex flex-col justify-center items-center">
            <a (click)="onRegister()" class="text-sm text-primary-600 hover:underline cursor-pointer">
                New to FleetHive? <u>Create an account</u>
            </a>
            <span class="text-sm text-primary-600"><i>Developed by vloot technologies</i>.</span>
        </div>
    </div>
</div>


<app-configurator [hidden]="true" [simple]="true" />
