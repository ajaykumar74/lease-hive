<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Location Code" [value]="location.LocationCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Location Name" [value]="location.LocationName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Location Type" [value]="location.LocationType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Address Line1" [value]="location.AddressLine1">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Address Line2" [value]="location.AddressLine2">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Landmark" [value]="location.Landmark">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="City" [value]="location.City">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="State Province Code" [value]="location.StateProvinceCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Postal Code" [value]="location.PostalCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Country Code" [value]="location.CountryCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Geo Location" [value]="location.GeoLocation">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Email" [value]="location.Email">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contact Phone" [value]="location.ContactPhone">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="location.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="location.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="location.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
