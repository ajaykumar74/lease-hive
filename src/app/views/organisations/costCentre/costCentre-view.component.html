<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="CostCentreCode" [value]="costCentre.CostCentreCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="CostCentreName" [value]="costCentre.CostCentreName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ParentCostCentreId" [value]="costCentre.ParentCostCentreId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="OrganisationUnitId" [value]="costCentre.OrganisationUnitId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ExternalLedgerCode" [value]="costCentre.ExternalLedgerCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="RecordStatus" [value]="costCentre.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="EffectiveFrom" [value]="costCentre.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="EffectiveTo" [value]="costCentre.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
