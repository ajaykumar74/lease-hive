<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'OrganisationUnitLocation List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">OrganisationUnitLocationId <p-sortIcon field="OrganisationUnitLocationId" /> </th> 
<th style="width:200px">LocationId <p-sortIcon field="LocationId" /> </th> 
<th style="width:200px">PurposeType <p-sortIcon field="PurposeType" /> </th> 
<th style="width:200px">IsPrimary <p-sortIcon field="IsPrimary" /> </th> 
<th style="width:200px">RecordStatus <p-sortIcon field="RecordStatus" /> </th> 
<th style="width:200px">EffectiveFrom <p-sortIcon field="EffectiveFrom" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.OrganisationUnitLocationId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.LocationId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.PurposeType}}</td>
 <td style="width:200px">{{obj.IsPrimary | yesNo }}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 <td style="width:200px">{{obj.EffectiveFrom | date:'dd-MMM-yyyy' }}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
