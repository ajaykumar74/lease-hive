<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="partyContact.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Party LocationId" [value]="partyContact.PartyLocationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contact Type" [value]="partyContact.ContactType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Title" [value]="partyContact.Title">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="First Name" [value]="partyContact.FirstName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Last Name" [value]="partyContact.LastName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Designation" [value]="partyContact.Designation">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Department Name" [value]="partyContact.DepartmentName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Email" [value]="partyContact.Email">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Mobile Country Code" [value]="partyContact.MobileCountryCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Mobile Number" [value]="partyContact.MobileNumber">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="partyContact.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
