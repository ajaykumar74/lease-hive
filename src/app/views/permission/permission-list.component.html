<div class="grid list-page generated-list-page">
<div class="col-12">
        <div class="card list-card generated-list-card">
            <app-message [AlertType]="'message'"></app-message>
            <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'Permission List'" [PageType]="'List'"></app-toolbar-buttons>
            <app-spinner></app-spinner>
            <div class="generated-list-search">
    <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search..." [(ngModel)]="objSearch.Name" (keyup.enter)="search()" aria-label="Search records" />
    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search records" title="Search"></button>
    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div>
</div>
            <p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table generated-list-table" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th pFrozenColumn pSortableColumn="PermissionCode" style="width: 240px">Permission Code <p-sortIcon field="PermissionCode" /></th>
                        <th pSortableColumn="ModuleCode" style="width: 160px">Module Code <p-sortIcon field="ModuleCode" /></th>
                        <th pSortableColumn="ResourceType" style="width: 180px">Resource Type <p-sortIcon field="ResourceType" /></th>
                        <th pSortableColumn="ResourceName" style="width: 220px">Resource Name <p-sortIcon field="ResourceName" /></th>
                        <th pSortableColumn="ActionName" style="width: 160px">Action Name <p-sortIcon field="ActionName" /></th>
                        <th style="width: 130px">Status</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-obj>
                    <tr>
                        <td style="width: 240px" pFrozenColumn><p-button [label]="obj.PermissionCode" [link]="true" (click)="onDetailsClick(obj)" /></td>
                        <td style="width: 160px">{{ obj.ModuleCode }}</td>
                        <td style="width: 180px">{{ obj.ResourceType }}</td>
                        <td style="width: 220px">{{ obj.ResourceName }}</td>
                        <td style="width: 160px">{{ obj.ActionName }}</td>
                        <td style="width: 130px">{{ obj.RecordStatus }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
