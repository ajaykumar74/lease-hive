<div class="grid">
    <div class="col-12">
        <div class="card">
            <app-message [AlertType]="'message'"></app-message>
            <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'Permission List'" [PageType]="'List'"></app-toolbar-buttons>
            <app-spinner></app-spinner>
            <div class="col-12 md:col-6">
                <p-inputGroup>
                    <input type="text" class="p-inputtext-sm" pInputText placeholder="Search permissions" [(ngModel)]="objSearch.Name" />
                    <button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button>
                </p-inputGroup>
            </div>
            <p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th pFrozenColumn pSortableColumn="PermissionCode" style="width: 240px">Permission Code <p-sortIcon field="PermissionCode" /></th>
                        <th pSortableColumn="ModuleCode" style="width: 160px">Module <p-sortIcon field="ModuleCode" /></th>
                        <th pSortableColumn="ResourceType" style="width: 180px">Resource Type <p-sortIcon field="ResourceType" /></th>
                        <th pSortableColumn="ResourceName" style="width: 220px">Resource <p-sortIcon field="ResourceName" /></th>
                        <th pSortableColumn="ActionName" style="width: 160px">Action <p-sortIcon field="ActionName" /></th>
                        <th style="width: 130px">Status</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-obj>
                    <tr>
                        <td style="width: 240px" pFrozenColumn><p-button [label]="obj.PermissionCode" [link]="true" (click)="onDetailsClick(obj)" /></td>
                        <td style="width: 160px">{{ obj.ModuleCode }}</td>
                        <td style="width: 180px">{{ obj.ResourceType }}</td>
                        <td style="width: 220px">{{ obj.ResourceName }}</td>
                        <td style="width: 160px">{{ obj.ActionName }}</td>
                        <td style="width: 130px">{{ obj.RecordStatus }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
