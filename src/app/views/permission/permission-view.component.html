<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
				<app-spinner></app-spinner>
				<form>
					<p-fluid>
						<div class="flex mt-8">
							<div class="card flex flex-col gap-4 w-full">
							 
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<app-view-field label="Resource Type" [value]="apppermission.ResourceType">
										</app-view-field>
									</div>
									<div class="flex flex-col w-full">
										<app-view-field label="Resource Name" [value]="apppermission.ResourceName">
										</app-view-field>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<app-view-field label="Action Name" [value]="apppermission.ActionName">
										</app-view-field>
									</div>
									<div class="flex flex-col w-full">
										<app-view-field label="Description" [value]="apppermission.Description">
										</app-view-field>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<app-view-field label="Is Sensitive" [value]="apppermission.IsSensitive">
										</app-view-field>
									</div>
									<div class="flex flex-col w-full">
										<app-view-field label="Record Status" [value]="apppermission.RecordStatus">
										</app-view-field>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<app-view-field label="Effective From" [value]="apppermission.EffectiveFrom">
										</app-view-field>
									</div>
									<div class="flex flex-col w-full">
										<app-view-field label="Effective To" [value]="apppermission.EffectiveTo">
										</app-view-field>
									</div>
								</div>

							</div>
						</div>
					</p-fluid>


				</form>
			</div>
		</div>
	</div>
</div>
