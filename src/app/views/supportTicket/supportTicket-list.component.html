<div class="grid">
	<div class="col-12">
		<div class="card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Support Tickets'" [IsHideCreate]="!isCustomer" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="col-12 md:col-6">
				<div class="flex flex-col items-center mb-12">
					<div class="w-1/2 md:w-6 lg:w-4 xl:w-3">
						<p-inputGroup>
							<input pSize="small" type="text" class="p-inputtext-sm" pInputText placeholder="type title"
								[(ngModel)]="objSearch.Title" />
							<p-inputgroup-addon>
								<i class="pi pi-times" style="cursor: pointer;" (click)="clearSearch()"></i>
							</p-inputgroup-addon>
							<p-button label="Search" pRipple size="small" (click)="search()" />
						</p-inputGroup>
						<label for="Records Found" style=" font-size:small;">Records Found: {{totalNoOfRecords}}</label>
					</div>

				</div>
			</div>
			<p-table [size]="gridSize" [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
				styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:60px">Id <p-sortIcon field="Id" /> </th>
						<th style="width:200px" *ngIf="!isCustomer">Customer</th>
						<th style="width:200px" pSortableColumn="Title">Title <p-sortIcon field="Title" /> </th>
						<th style="width:200px">Category </th>
						<th style="width:200px">Request Type </th>
						<th style="width:200px">Priority </th>
						<th style="width:200px">Status </th>
						<th style="width:200px" *ngIf="isCustomer">Created By</th>
						<th style="width:200px" *ngIf="isCustomer">Created On</th>
					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td pFrozenColumn pTooltip="Click here to view details">
							<i class="pi pi-file-edit" style="font-size: small" style="margin-right: -10px;"></i>
							<p-button  label="{{obj.Id}}" [link]="true" (click)="onDetailsClick(obj)" />
						</td>
						<td *ngIf="!isCustomer">{{obj.BusinessName}}</td>
						<td>{{obj.Title}}</td>
						<td>{{obj.Category}}</td>
						<td>{{obj.RequestType}}</td>
						<td> <p-tag [severity]="getTagSeverity(obj.Priority)" [value]="obj.Priority" [rounded]="true" />
						</td>
						<td> <p-tag [severity]="getTagSeverity(obj.Status)" [value]="obj.Status" [rounded]="true" />
						</td>
						<td *ngIf="isCustomer">{{obj.CreatedByCode}}</td>
						<td *ngIf="isCustomer">{{obj.CreatedDateTime | date:
							brandPartner.DateFormat + ' ' +
							brandPartner.TimeFormat}} </td>
					</tr>
				</ng-template>
			</p-table>
			<div class="flex justify-content-center">
				<p-paginator (onPageChange)="onPageChanged($event)"  [first]="pgEvent.first" [rows]="pgEvent.rows"
					[totalRecords]="totalNoOfRecords" [rowsPerPageOptions]="[10,20,30,40,50]" />
			</div>
		</div>
	</div>
</div>
