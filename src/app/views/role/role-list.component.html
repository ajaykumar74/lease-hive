<div class="grid list-page generated-list-page">
<div class="col-12">
        <div class="card list-card generated-list-card">
            <app-message [AlertType]="'message'"></app-message>
            <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'Role List'" [PageType]="'List'"></app-toolbar-buttons>
            <app-spinner></app-spinner>
            <div class="generated-list-search">
    <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search..." [(ngModel)]="objSearch.Name" (keyup.enter)="search()" aria-label="Search records" />
    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search records" title="Search"></button>
    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div>
</div>
            <p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table generated-list-table" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th pFrozenColumn pSortableColumn="RoleCode" style="width: 180px">Role Code <p-sortIcon field="RoleCode" /></th>
                        <th pSortableColumn="RoleName" style="width: 240px">Role Name <p-sortIcon field="RoleName" /></th>
                        <th pSortableColumn="RoleType" style="width: 160px">Role Type <p-sortIcon field="RoleType" /></th>
                        <th pSortableColumn="ScopeType" style="width: 160px">Scope Type <p-sortIcon field="ScopeType" /></th>
                        <th style="width: 280px">Description</th>
                        <th style="width: 130px">Status</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-obj>
                    <tr>
                        <td style="width: 180px" pFrozenColumn><p-button [label]="obj.RoleCode || obj.RoleId" [link]="true" (click)="onDetailsClick(obj)" /></td>
                        <td style="width: 240px">{{ obj.RoleName }}</td>
                        <td style="width: 160px">{{ obj.RoleType }}</td>
                        <td style="width: 160px">{{ obj.ScopeType }}</td>
                        <td style="width: 280px">{{ obj.Description }}</td>
                        <td style="width: 130px">{{ obj.RecordStatus }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
