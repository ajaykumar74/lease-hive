<div class="grid">
	<div class="col-12">
		<div class="card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Role List'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="col-12 md:col-6">
				<p-inputGroup>
					<input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword"
						[(ngModel)]="objSearch.Name" />
					<button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button>
				</p-inputGroup>
			</div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
				styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">RoleId <p-sortIcon field="Id" /> </th>
						<th style="width:200px">Role Name <p-sortIcon field="RoleName" /> </th>
						<th style="width:200px">Description <p-sortIcon field="Description" /> </th>
						<th style="width:200px">Role Type <p-sortIcon field="RoleType" /> </th>
						<th style="width:200px">Scope Type <p-sortIcon field="ScopeType" /> </th>
						<th style="width:200px">Record Status <p-sortIcon field="RecordStatus" /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{obj.RoleId}}" [link]="true"
								(click)="onDetailsClick(obj)" /> </td>
						<td style="width:200px">{{obj.RoleName}}</td>
						<td style="width:200px">{{obj.Description}}</td>
						<td style="width:200px">{{obj.RoleType}}</td>
						<td style="width:200px">{{obj.ScopeType}}</td>
						<td style="width:200px">{{obj.RecordStatus}}</td>

					</tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
