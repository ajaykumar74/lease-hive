<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="User DelegationId" [value]="userDelegation.UserDelegationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Delegator UserId" [value]="userDelegation.DelegatorUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Delegate UserId" [value]="userDelegation.DelegateUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Delegation Type" [value]="userDelegation.DelegationType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Process Code" [value]="userDelegation.ProcessCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Organisation UnitId" [value]="userDelegation.OrganisationUnitId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Start DateTime" [value]="userDelegation.StartDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="End DateTime" [value]="userDelegation.EndDateTime">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reason" [value]="userDelegation.Reason">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Approved By" [value]="userDelegation.ApprovedById">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="userDelegation.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="userDelegation.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
