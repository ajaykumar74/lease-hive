<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons>
				<app-spinner></app-spinner>

				<form [formGroup]="editForm" (ngSubmit)="Save()">
					<p-fluid>
						<div class="flex mt-8">
							<div class="card flex flex-col gap-4 w-full">
								<div class="flex flex-col md:flex-row gap-4">

									<div class="flex flex-col w-full">
										<label for="PartyId" class="mb-1">Party</label>
										<p-dropdown inputId="PartyId" [options]="partyidOptions" optionLabel="Text"
											optionValue="Value" formControlName="PartyId" placeholder="Select One"
											class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')"
											label="Party">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="OpportunityId" class="mb-1">Opportunity</label>
										<p-dropdown inputId="OpportunityId" [options]="opportunityidOptions"
											optionLabel="Text" optionValue="Value" formControlName="OpportunityId"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'" [control]="editForm.get('OpportunityId')"
											label="Opportunity">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="OriginatingOrganisationId"
											class="mb-1">Originating Organisation</label>
										<p-dropdown inputId="OriginatingOrganisationId"
											[options]="originatingorganisationidOptions" optionLabel="Text"
											optionValue="Value" formControlName="OriginatingOrganisationId"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('OriginatingOrganisationId')"
											label="Originating Organisation">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="CreditApplicationStatusId"
											class="mb-1">Credit Application Status</label>
										<p-dropdown inputId="CreditApplicationStatusId"
											[options]="creditapplicationstatusidOptions" optionLabel="Text"
											optionValue="Value" formControlName="CreditApplicationStatusId"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('CreditApplicationStatusId')"
											label="Credit Application Status">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">

										<label for="ApplicationDate">Application Date
										</label>
										<p-calendar id="ApplicationDate" size="small" dateFormat="dd-MM-yy"
											[showIcon]="true" formControlName="ApplicationDate"></p-calendar>
										<app-validation-errors [type]="'date'"
											[control]="editForm.get('ApplicationDate')" label="Application Date">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="RequestedLimitAmount">Requested Limit Amount
										</label>
										<p-inputNumber id="RequestedLimitAmount" pSize="small"
											formControlName="RequestedLimitAmount">
										</p-inputNumber>
										<app-validation-errors [type]="'number'"
											[control]="editForm.get('RequestedLimitAmount')"
											label="Requested Limit Amount">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="CurrencyCode" class="mb-1">Currency Code</label>
										<app-currency-dropdown inputId="CurrencyCode" formControlName="CurrencyCode"
											[organisationControl]="editForm.get('OriginatingOrganisationId')"></app-currency-dropdown>
										<app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="RequestedTermMonths">Requested Term Months
										</label>
										<p-inputNumber id="RequestedTermMonths" pSize="small"
											formControlName="RequestedTermMonths">
										</p-inputNumber>
										<app-validation-errors [type]="'number'"
											[control]="editForm.get('RequestedTermMonths')"
											label="Requested Term Months">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="RiskSegmentCode" class="mb-1">Risk Segment Code</label>
										<p-dropdown inputId="RiskSegmentCode" [options]="risksegmentcodeOptions"
											optionLabel="Text" optionValue="Value" formControlName="RiskSegmentCode"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('RiskSegmentCode')" label="Risk Segment Code">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="AssignedAnalystUserId" class="mb-1">Assigned Analyst</label>
										<p-dropdown inputId="AssignedAnalystUserId"
											[options]="assignedanalystuseridOptions" optionLabel="Text"
											optionValue="Value" formControlName="AssignedAnalystUserId"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('AssignedAnalystUserId')"
											label="Assigned Analyst">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">

										<label for="SubmittedOn">Submitted On
										</label>
										<p-calendar id="SubmittedOn" size="small" dateFormat="dd-MM-yy"
											[showIcon]="true" formControlName="SubmittedOn"></p-calendar>
										<app-validation-errors [type]="'date'" [control]="editForm.get('SubmittedOn')"
											label="Submitted On">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">

										<label for="DecisionOn">Decision On
										</label>
										<p-calendar id="DecisionOn" size="small" dateFormat="dd-MM-yy" [showIcon]="true"
											formControlName="DecisionOn"></p-calendar>
										<app-validation-errors [type]="'date'" [control]="editForm.get('DecisionOn')"
											label="Decision On">
										</app-validation-errors>
									</div>
								</div>




							</div>
						</div>
					</p-fluid>
				</form>

			</div>
		</div>
	</div>
</div>
