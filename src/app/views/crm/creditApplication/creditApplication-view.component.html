<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Opportunity Id" [value]="creditApplication.OpportunityId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Party Id" [value]="creditApplication.PartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Originating OrganisationId" [value]="creditApplication.OriginatingOrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Credit ApplicationStatusId" [value]="creditApplication.CreditApplicationStatusId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Application Date" [value]="creditApplication.ApplicationDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requested Limit Amount" [value]="creditApplication.RequestedLimitAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="creditApplication.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requested Term Months" [value]="creditApplication.RequestedTermMonths">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Risk Segment Code" [value]="creditApplication.RiskSegmentCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Assigned Analyst UserId" [value]="creditApplication.AssignedAnalystUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Submitted On" [value]="creditApplication.SubmittedOn">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Decision On" [value]="creditApplication.DecisionOn">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="creditApplication.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="creditApplication.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
