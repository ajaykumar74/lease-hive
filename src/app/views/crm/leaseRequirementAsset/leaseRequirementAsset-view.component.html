<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease RequirementId" [value]="leaseRequirementAsset.LeaseRequirementId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="leaseRequirementAsset.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset CategoryId" [value]="leaseRequirementAsset.AssetCategoryId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset TypeId" [value]="leaseRequirementAsset.AssetTypeId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset MakeId" [value]="leaseRequirementAsset.AssetMakeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset ModelId" [value]="leaseRequirementAsset.AssetModelId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quantity" [value]="leaseRequirementAsset.Quantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="New Used Code" [value]="leaseRequirementAsset.NewUsedCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Estimated UnitCost" [value]="leaseRequirementAsset.EstimatedUnitCost">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="CurrencyCode" [value]="leaseRequirementAsset.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Expected Annual Usage" [value]="leaseRequirementAsset.ExpectedAnnualUsage">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Usage UOMId" [value]="leaseRequirementAsset.UsageUOMId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Service PackageCode" [value]="leaseRequirementAsset.ServicePackageCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="leaseRequirementAsset.Remarks">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="leaseRequirementAsset.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="leaseRequirementAsset.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
