<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<div class="flex justify-content-end px-4 pt-2">
						<button pButton type="button" size="small" [style]="{ width: 'auto' }" icon="pi pi-file-plus" label="Create Quote"
							[disabled]="!leaseRequirementAsset?.Id" (click)="createQuote()"></button>
					</div>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Requirement" [value]="leaseRequirementAsset.LeaseRequirementDisplayName || '—'">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="leaseRequirementAsset.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Category" [value]="leaseRequirementAsset.AssetCategoryDisplayName || '—'">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Type" [value]="leaseRequirementAsset.AssetTypeDisplayName || '—'">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Make" [value]="leaseRequirementAsset.AssetMakeDisplayName || '—'">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Model" [value]="leaseRequirementAsset.AssetModelDisplayName || '—'">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quantity" [value]="leaseRequirementAsset.Quantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="New Used Code" [value]="leaseRequirementAsset.NewUsedCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Estimated Unit Cost" [value]="leaseRequirementAsset.CurrencyCode + ' ' + (leaseRequirementAsset.EstimatedUnitCost || 0)">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency" [value]="leaseRequirementAsset.CurrencyCode || '—'">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Expected Annual Usage" [value]="leaseRequirementAsset.ExpectedAnnualUsage">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Usage unit" [value]="leaseRequirementAsset.UsageUOMId ? leaseRequirementAsset.UsageUOMId : 'Not specified'">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Service package" [value]="leaseRequirementAsset.ServicePackageCode || 'Not specified'">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="leaseRequirementAsset.Remarks">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="leaseRequirementAsset.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="leaseRequirementAsset.EffectiveFrom">
								</app-view-field></div></div>

						<app-audit-details [model]="leaseRequirementAsset"></app-audit-details>
						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
