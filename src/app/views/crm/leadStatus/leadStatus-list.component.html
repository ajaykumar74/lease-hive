<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'LeadStatus List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">StatusCode <p-sortIcon field="StatusCode" /> </th> 
<th style="width:200px">StatusName <p-sortIcon field="StatusName" /> </th> 
<th style="width:200px">IsQualified <p-sortIcon field="IsQualified" /> </th> 
<th style="width:200px">IsTerminal <p-sortIcon field="IsTerminal" /> </th> 
<th style="width:200px">SortOrder <p-sortIcon field="SortOrder" /> </th> 
<th style="width:200px">Record Status <p-sortIcon field="RecordStatus" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.LeadStatusId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.StatusCode}}</td>
 <td style="width:200px">{{obj.StatusName}}</td>
 <td style="width:200px">{{obj.IsQualified | yesNo }}</td>
 <td style="width:200px">{{obj.IsTerminal | yesNo }}</td>
 <td style="width:200px">{{obj.SortOrder | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
