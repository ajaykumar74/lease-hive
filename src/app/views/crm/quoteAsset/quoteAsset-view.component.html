<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="QuoteId" [value]="quoteAsset.QuoteId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="LeaseRequirementAssetId" [value]="quoteAsset.LeaseRequirementAssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="LineNo" [value]="quoteAsset.LineNo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="AssetCategoryId" [value]="quoteAsset.AssetCategoryId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="AssetTypeId" [value]="quoteAsset.AssetTypeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="AssetMakeId" [value]="quoteAsset.AssetMakeId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="AssetModelId" [value]="quoteAsset.AssetModelId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="quoteAsset.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quantity" [value]="quoteAsset.Quantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="UnitAssetCost" [value]="quoteAsset.UnitAssetCost">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ResidualValuePct" [value]="quoteAsset.ResidualValuePct">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="ResidualValueAmount" [value]="quoteAsset.ResidualValueAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="TermMonths" [value]="quoteAsset.TermMonths">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="RateFactor" [value]="quoteAsset.RateFactor">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PeriodicRentalAmount" [value]="quoteAsset.PeriodicRentalAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="BillingFrequency" [value]="quoteAsset.BillingFrequency">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="TaxCode" [value]="quoteAsset.TaxCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="LineSubtotal" [value]="quoteAsset.LineSubtotal">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
