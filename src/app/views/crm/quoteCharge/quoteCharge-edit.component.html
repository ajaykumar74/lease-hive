<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="QuoteId" class="mb-1">QuoteId</label>
        <p-dropdown
            inputId="QuoteId" 
            [options]="quoteidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuoteId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuoteId')"
											label="QuoteId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Quote AssetId" class="mb-1">QuoteAssetId</label>
        <p-dropdown
            inputId="QuoteAssetId" 
            [options]="quoteassetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuoteAssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuoteAssetId')"
											label="Quote AssetId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ChargeType">Charge Type 
							</label> 
							<input pInputText id="ChargeType" type="text" pSize="small"	formControlName="ChargeType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ChargeType')"
											label="Charge Type">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Charge Description</label>
                    <textarea size="small" pTextarea placeholder="Type Charge Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="ChargeDescription"
										[ngClass]="{'is-invalid': (editForm.get('ChargeDescription').touched || editForm.get('ChargeDescription').dirty) && !editForm.get('ChargeDescription').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('ChargeDescription')"
											label="Charge Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Calculation TypeCode" class="mb-1">CalculationTypeCode</label>
        <p-dropdown
            inputId="CalculationTypeCode" 
            [options]="calculationtypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CalculationTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CalculationTypeCode')"
											label="Calculation TypeCode">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="RateOrAmount">Rate Or Amount 
							</label> 
							<p-inputNumber id="RateOrAmount"  pSize="small"	formControlName="RateOrAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RateOrAmount')"
											label="Rate Or Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ChargeAmount">Charge Amount 
							</label> 
							<p-inputNumber id="ChargeAmount"  pSize="small"	formControlName="ChargeAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ChargeAmount')"
											label="Charge Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsRecurring" binary="true" formControlName="IsRecurring">
											</p-checkbox>
											<label for="IsRecurring">IsRecurring</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">							<label for="TaxCode">TaxCode 
							</label> 
							<p-inputNumber id="TaxCode"  pSize="small"	formControlName="TaxCode"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxCode')"
											label="TaxCode">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
