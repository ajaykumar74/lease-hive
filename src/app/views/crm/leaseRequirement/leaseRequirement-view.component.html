<div class="container">
    <div class="grid">
        <div class="col-12 md:col-12">
            <div class="card p-fluid">
                <app-message [AlertType]="'message'"></app-message>
                <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
                <app-spinner></app-spinner>
                <form>
                    <p-fluid>
                        <div class="flex mt-8">
                            <div class="card flex flex-col gap-4 w-full">
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                            <app-view-field label="Opportunity" [value]="leaseRequirement.OpportunityName || '—'"> </app-view-field>
                                    </div>
                                    <div class="flex flex-col w-full">
                            <app-view-field label="Party" [value]="leaseRequirement.PartyName || '—'"> </app-view-field>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                            <app-view-field label="Party Location" [value]="leaseRequirement.PartyLocationName || '—'"> </app-view-field>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Requirement Date" [value]="leaseRequirement.RequirementDate"> </app-view-field>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Preferred StartDate" [value]="leaseRequirement.PreferredStartDate"> </app-view-field>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Requested Term Months" [value]="leaseRequirement.RequestedTermMonths"> </app-view-field>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Currency Code" [value]="leaseRequirement.CurrencyCode"> </app-view-field>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Requirement Status Code" [value]="leaseRequirement.RequirementStatusCode"> </app-view-field>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Customer Reference" [value]="leaseRequirement.CustomerReference"> </app-view-field>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Remarks" [value]="leaseRequirement.Remarks"> </app-view-field>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Record Status" [value]="leaseRequirement.RecordStatus"> </app-view-field>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <app-view-field label="Effective From" [value]="leaseRequirement.EffectiveFrom"> </app-view-field>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </p-fluid>
                </form>
            </div>
        </div>
    </div>
</div>
