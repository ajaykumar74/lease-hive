<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="OpportunityId" class="mb-1">OpportunityId</label>
        <p-dropdown
            inputId="OpportunityId" 
            [options]="opportunityidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OpportunityId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OpportunityId')"
											label="OpportunityId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Party Id" class="mb-1">PartyId</label>
        <p-dropdown
            inputId="PartyId" 
            [options]="partyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')"
											label="Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Party LocationId" class="mb-1">PartyLocationId</label>
        <p-dropdown
            inputId="PartyLocationId" 
            [options]="partylocationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PartyLocationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PartyLocationId')"
											label="Party LocationId">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="RequirementDate">Requirement Date 
							</label> 
							<p-calendar id="RequirementDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RequirementDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RequirementDate')"
											label="Requirement Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="PreferredStartDate">Preferred StartDate 
							</label> 
							<p-calendar id="PreferredStartDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="PreferredStartDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('PreferredStartDate')"
											label="Preferred StartDate">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="RequestedTermMonths">Requested Term Months 
							</label> 
							<p-inputNumber id="RequestedTermMonths"  pSize="small"	formControlName="RequestedTermMonths"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RequestedTermMonths')"
											label="Requested Term Months">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Requirement Status Code" class="mb-1">RequirementStatusCode</label>
        <p-dropdown
            inputId="RequirementStatusCode" 
            [options]="requirementstatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RequirementStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RequirementStatusCode')"
											label="Requirement Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Customer Reference</label>
                    <textarea size="small" pTextarea placeholder="Type Customer Reference" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="CustomerReference"
										[ngClass]="{'is-invalid': (editForm.get('CustomerReference').touched || editForm.get('CustomerReference').dirty) && !editForm.get('CustomerReference').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('CustomerReference')"
											label="Customer Reference">
										</app-validation-errors>


               </div><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
