<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quote GroupNo" [value]="quote.QuoteGroupNo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Version No" [value]="quote.VersionNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="OpportunityId" [value]="quote.OpportunityId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease RequirementId" [value]="quote.LeaseRequirementId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="quote.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Originating OrganisationId" [value]="quote.OriginatingOrganisationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quote StatusId" [value]="quote.QuoteStatusId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Quote Date" [value]="quote.QuoteDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Valid Until" [value]="quote.ValidUntil">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="CurrencyCode" [value]="quote.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requested Term Months" [value]="quote.RequestedTermMonths">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Billing Frequency" [value]="quote.BillingFrequency">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Subtotal Amount" [value]="quote.SubtotalAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Tax Amount" [value]="quote.TaxAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Total Amount" [value]="quote.TotalAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Security Deposit Amount" [value]="quote.SecurityDepositAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Pricing DateTime" [value]="quote.PricingDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Issued On" [value]="quote.IssuedOn">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Accepted On" [value]="quote.AcceptedOn">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Supersedes QuoteId" [value]="quote.SupersedesQuoteId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="quote.Remarks">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="quote.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="quote.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="quote.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
