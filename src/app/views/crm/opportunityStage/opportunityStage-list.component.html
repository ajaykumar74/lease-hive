<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'OpportunityStage List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">Stage Code <p-sortIcon field="StageCode" /> </th> 
<th style="width:200px">Stage Name <p-sortIcon field="StageName" /> </th> 
<th style="width:200px">Default ProbabilityPct <p-sortIcon field="DefaultProbabilityPct" /> </th> 
<th style="width:200px">IsWon <p-sortIcon field="IsWon" /> </th> 
<th style="width:200px">IsLost <p-sortIcon field="IsLost" /> </th> 
<th style="width:200px">Record Status <p-sortIcon field="RecordStatus" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.OpportunityStageId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.StageCode}}</td>
 <td style="width:200px">{{obj.StageName}}</td>
 <td style="width:200px">{{obj.DefaultProbabilityPct | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.IsWon | yesNo }}</td>
 <td style="width:200px">{{obj.IsLost | yesNo }}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
