<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'OriginationDocumentLink List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">ReferenceType <p-sortIcon field="ReferenceType" /> </th> 
<th style="width:200px">ReferenceId <p-sortIcon field="ReferenceId" /> </th> 
<th style="width:200px">DocumentId <p-sortIcon field="DocumentId" /> </th> 
<th style="width:200px">Document Purpose Code <p-sortIcon field="DocumentPurposeCode" /> </th> 
<th style="width:200px">IsPrimary <p-sortIcon field="IsPrimary" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.OriginationDocumentLinkId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.ReferenceType}}</td>
 <td style="width:200px">{{obj.ReferenceId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.DocumentId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.DocumentPurposeCode}}</td>
 <td style="width:200px">{{obj.IsPrimary | yesNo }}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
