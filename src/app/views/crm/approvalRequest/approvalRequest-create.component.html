 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Feature Code" class="mb-1">FeatureCode</label>
        <p-dropdown
            inputId="FeatureCode" 
            [options]="featurecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="FeatureCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('FeatureCode')"
											label="Feature Code">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="ReferenceType">Reference Type 
							</label> 
							<input pInputText id="ReferenceType" type="text" pSize="small"	formControlName="ReferenceType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceType')"
											label="Reference Type">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ReferenceId">ReferenceId 
							</label> 
							<p-inputNumber id="ReferenceId"  pSize="small"	formControlName="ReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceId')"
											label="ReferenceId">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="WorkflowDefinitionId">Workflow DefinitionId 
							</label> 
							<p-inputNumber id="WorkflowDefinitionId"  pSize="small"	formControlName="WorkflowDefinitionId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('WorkflowDefinitionId')"
											label="Workflow DefinitionId">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="RequestedBy" class="mb-1">RequestedBy</label>
        <p-dropdown
            inputId="RequestedBy" 
            [options]="requestedbyOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RequestedBy"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RequestedBy')"
											label="RequestedBy">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="RequestedOn">RequestedOn 
							</label> 
							<p-calendar id="RequestedOn"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RequestedOn"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RequestedOn')"
											label="RequestedOn">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="RequestedAmount">Requested Amount 
							</label> 
							<p-inputNumber id="RequestedAmount"  pSize="small"	formControlName="RequestedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RequestedAmount')"
											label="Requested Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="CurrencyId" class="mb-1">CurrencyId</label>
        <p-dropdown
            inputId="CurrencyId" 
            [options]="currencyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyId')"
											label="CurrencyId">
										</app-validation-errors></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Approval Status" class="mb-1">ApprovalStatus</label>
        <p-dropdown
            inputId="ApprovalStatus" 
            [options]="approvalstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ApprovalStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ApprovalStatus')"
											label="Approval Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
