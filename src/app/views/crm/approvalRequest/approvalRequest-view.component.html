<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Feature Code" [value]="approvalRequest.FeatureCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Type" [value]="approvalRequest.ReferenceType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ReferenceId" [value]="approvalRequest.ReferenceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Workflow DefinitionId" [value]="approvalRequest.WorkflowDefinitionId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="RequestedBy" [value]="approvalRequest.RequestedBy">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="RequestedOn" [value]="approvalRequest.RequestedOn">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requested Amount" [value]="approvalRequest.RequestedAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="CurrencyId" [value]="approvalRequest.CurrencyId">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
