<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons>
				<app-spinner></app-spinner>

				<form [formGroup]="editForm" (ngSubmit)="Save()">
					<p-fluid>
						<div class="flex mt-8">
							<div class="card flex flex-col gap-4 w-full">
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="Credit ApplicationId" class="mb-1">CreditApplicationId</label>
										<p-dropdown inputId="CreditApplicationId" [options]="creditapplicationidOptions"
											optionLabel="Text" optionValue="Value" formControlName="CreditApplicationId"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('CreditApplicationId')"
											label="Credit ApplicationId">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="Assessment Version" class="mb-1">AssessmentVersion</label>
										<p-dropdown inputId="AssessmentVersion" [options]="assessmentversionOptions"
											optionLabel="Text" optionValue="Value" formControlName="AssessmentVersion"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('AssessmentVersion')" label="Assessment Version">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="Assessment TypeCode" class="mb-1">AssessmentTypeCode</label>
										<p-dropdown inputId="AssessmentTypeCode" [options]="assessmenttypecodeOptions"
											optionLabel="Text" optionValue="Value" formControlName="AssessmentTypeCode"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('AssessmentTypeCode')" label="Assessment TypeCode">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="Assessed By UserId" class="mb-1">AssessedByUserId</label>
										<p-dropdown inputId="AssessedByUserId" [options]="assessedbyuseridOptions"
											optionLabel="Text" optionValue="Value" formControlName="AssessedByUserId"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('AssessedByUserId')" label="Assessed By UserId">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">

										<label for="AssessmentDateTime">Assessment DateTime
										</label>
										<p-calendar id="AssessmentDateTime" size="small" dateFormat="dd-MM-yy"
											[showIcon]="true" formControlName="AssessmentDateTime"></p-calendar>
										<app-validation-errors [type]="'date'"
											[control]="editForm.get('AssessmentDateTime')" label="Assessment DateTime">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">

										<label for="RiskRatingCode">Risk Rating Code
										</label>
										<input pInputText id="RiskRatingCode" type="text" pSize="small"
											formControlName="RiskRatingCode" />
										<app-validation-errors [type]="'text'"
											[control]="editForm.get('RiskRatingCode')" label="Risk Rating Code">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="Score">Score
										</label>
										<p-inputNumber id="Score" pSize="small" formControlName="Score">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('Score')"
											label="Score">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="ProbabilityOfDefaultPct">Probability Of DefaultPct
										</label>
										<p-inputNumber id="ProbabilityOfDefaultPct" pSize="small"
											formControlName="ProbabilityOfDefaultPct">
										</p-inputNumber>
										<app-validation-errors [type]="'number'"
											[control]="editForm.get('ProbabilityOfDefaultPct')"
											label="Probability Of DefaultPct">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="RecommendedLimitAmount">Recommended Limit Amount
										</label>
										<p-inputNumber id="RecommendedLimitAmount" pSize="small"
											formControlName="RecommendedLimitAmount">
										</p-inputNumber>
										<app-validation-errors [type]="'number'"
											[control]="editForm.get('RecommendedLimitAmount')"
											label="Recommended Limit Amount">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="CurrencyCode" class="mb-1">CurrencyCode</label>
										<p-dropdown inputId="CurrencyCode" [options]="currencycodeOptions"
											optionLabel="Text" optionValue="Value" formControlName="CurrencyCode"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="CurrencyCode">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="RecommendedLimitAmount">Recommended Limit Amount
										</label>
										<p-inputNumber id="RecommendedLimitAmount" pSize="small"
											formControlName="RecommendedLimitAmount">
										</p-inputNumber>
										<app-validation-errors [type]="'number'"
											[control]="editForm.get('RecommendedLimitAmount')"
											label="Recommended Limit Amount">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="CurrencyCode" class="mb-1">CurrencyCode</label>
										<p-dropdown inputId="CurrencyCode" [options]="currencycodeOptions"
											optionLabel="Text" optionValue="Value" formControlName="CurrencyCode"
											placeholder="Select One" class="w-full">
										</p-dropdown>
										<app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="CurrencyCode">
										</app-validation-errors>
									</div>
								</div>
							</div>
						</div>
					</p-fluid>
				</form>

			</div>
		</div>
	</div>
</div>
