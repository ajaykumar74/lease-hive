<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'CreditAssessment List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">Credit ApplicationId <p-sortIcon field="CreditApplicationId" /> </th> 
<th style="width:200px">Assessment Version <p-sortIcon field="AssessmentVersion" /> </th> 
<th style="width:200px">Score <p-sortIcon field="Score" /> </th> 
<th style="width:200px">CurrencyCode <p-sortIcon field="CurrencyCode" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.CreditAssessmentId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.CreditApplicationId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.AssessmentVersion}}</td>
 <td style="width:200px">{{obj.Score | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.CurrencyCode}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
