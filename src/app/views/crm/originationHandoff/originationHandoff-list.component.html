<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'OriginationHandoff List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">OpportunityId <p-sortIcon field="OpportunityId" /> </th> 
<th style="width:200px">QuoteId <p-sortIcon field="QuoteId" /> </th> 
<th style="width:200px">Credit DecisionId <p-sortIcon field="CreditDecisionId" /> </th> 
<th style="width:200px">PartyId <p-sortIcon field="PartyId" /> </th> 
<th style="width:200px">Handoff StatusId <p-sortIcon field="HandoffStatusId" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.OpportunityId}}</td>
 <td style="width:200px">{{obj.QuoteId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.CreditDecisionId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.PartyId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.HandoffStatusId}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
