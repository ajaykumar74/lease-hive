<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="LeadId" [value]="leadActivity.LeadId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Opportunity Id" [value]="leadActivity.OpportunityId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Activity Type" [value]="leadActivity.ActivityType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Subject" [value]="leadActivity.Subject">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Activity DateTime" [value]="leadActivity.ActivityDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Due DateTime" [value]="leadActivity.DueDateTime">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Assigned UserId" [value]="leadActivity.AssignedUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Outcome Code" [value]="leadActivity.OutcomeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Notes" [value]="leadActivity.Notes">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Completed On" [value]="leadActivity.CompletedOn">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="leadActivity.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="leadActivity.EffectiveFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="leadActivity.EffectiveTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="leadActivity.Description">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
