<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quote" [value]="quoteService.QuoteId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Quote Asset" [value]="quoteService.QuoteAssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Service" [value]="quoteService.LeaseServiceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Is Included" [value]="quoteService.IsIncluded">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Is Separately Chargeable" [value]="quoteService.IsSeparatelyChargeable">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Charge Frequency" [value]="quoteService.ChargeFrequencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Unit Amount" [value]="quoteService.UnitAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Quantity" [value]="quoteService.Quantity">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Service Terms" [value]="quoteService.ServiceTerms">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="quoteService.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
