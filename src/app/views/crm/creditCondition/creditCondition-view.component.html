<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Credit DecisionId" [value]="creditCondition.CreditDecisionId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Condition Type" [value]="creditCondition.ConditionType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Condition Text" [value]="creditCondition.ConditionText">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="IsPrecedent" [value]="creditCondition.IsPrecedent">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Due Date" [value]="creditCondition.DueDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Condition Status" [value]="creditCondition.ConditionStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="SatisfiedOn" [value]="creditCondition.SatisfiedOn">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Evidence DocumentId" [value]="creditCondition.EvidenceDocumentId">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
