<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="LeadId" class="mb-1">Lead</label>
        <p-dropdown
            inputId="LeadId" 
            [options]="leadidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LeadId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LeadId')"
											label="Lead">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="PartyId" class="mb-1">Party</label>
        <p-dropdown
            inputId="PartyId" 
            [options]="partyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')"
											label="Party">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="OriginatingOrganisationId" class="mb-1">Originating Organisation</label>
        <p-dropdown
            inputId="OriginatingOrganisationId" 
            [options]="originatingorganisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OriginatingOrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OriginatingOrganisationId')"
											label="Originating Organisation">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="OwnerOrganisationUnitId" class="mb-1">Owner Organisation Unit</label>
        <p-dropdown
            inputId="OwnerOrganisationUnitId" 
            [options]="ownerorganisationunitidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OwnerOrganisationUnitId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OwnerOrganisationUnitId')"
											label="Owner Organisation Unit">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="OwnerUserId" class="mb-1">Owner User</label>
        <p-dropdown
            inputId="OwnerUserId" 
            [options]="owneruseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OwnerUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OwnerUserId')"
											label="Owner User">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="OpportunityStageId" class="mb-1">Opportunity Stage</label>
        <p-dropdown
            inputId="OpportunityStageId" 
            [options]="opportunitystageidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OpportunityStageId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OpportunityStageId')"
											label="Opportunity Stage">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Opportunity Name</label>
                    <textarea size="small" pTextarea placeholder="Type Opportunity Name" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="OpportunityName"
										[ngClass]="{'is-invalid': (editForm.get('OpportunityName').touched || editForm.get('OpportunityName').dirty) && !editForm.get('OpportunityName').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('OpportunityName')"
											label="Opportunity Name">
										</app-validation-errors>


               </div><div class="flex flex-col w-full">							<label for="EstimatedAmount">Estimated Amount 
							</label> 
							<p-inputNumber id="EstimatedAmount"  pSize="small"	formControlName="EstimatedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('EstimatedAmount')"
											label="Estimated Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="CurrencyCode" class="mb-1">Currency</label>
        <app-currency-dropdown inputId="CurrencyCode" formControlName="CurrencyCode" [organisationControl]="editForm.get('OriginatingOrganisationId')"></app-currency-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="ProbabilityPct">Probability (%)
							</label> 
							<p-inputNumber id="ProbabilityPct"  pSize="small"	formControlName="ProbabilityPct"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ProbabilityPct')"
											label="Probability (%)">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ExpectedCloseDate">Expected Close Date 
							</label> 
							<p-calendar id="ExpectedCloseDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ExpectedCloseDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ExpectedCloseDate')"
											label="Expected Close Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Lost Reason Code</label>
                    <textarea size="small" pTextarea placeholder="Type Lost Reason Code" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="LostReasonCode"
										[ngClass]="{'is-invalid': (editForm.get('LostReasonCode').touched || editForm.get('LostReasonCode').dirty) && !editForm.get('LostReasonCode').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('LostReasonCode')"
											label="Lost Reason Code">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ClosedOn">Closed On
							</label> 
							<p-calendar id="ClosedOn"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ClosedOn"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ClosedOn')"
											label="Closed On">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="RecordStatus" class="mb-1">Record Status</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>

					<app-audit-details [model]="opportunity"></app-audit-details>
					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
