<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="LeadId" [value]="opportunity.LeadId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="opportunity.PartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Originating OrganisationId" [value]="opportunity.OriginatingOrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Owner Organisation UnitId" [value]="opportunity.OwnerOrganisationUnitId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Owner UserId" [value]="opportunity.OwnerUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Opportunity StageId" [value]="opportunity.OpportunityStageId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Opportunity Name" [value]="opportunity.OpportunityName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Estimated Amount" [value]="opportunity.EstimatedAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="opportunity.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Probability Pct" [value]="opportunity.ProbabilityPct">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Expected Close Date" [value]="opportunity.ExpectedCloseDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lost Reason Code" [value]="opportunity.LostReasonCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ClosedOn" [value]="opportunity.ClosedOn">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="opportunity.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="opportunity.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="opportunity.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
