<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="QuoteId" [value]="quoteAcceptance.QuoteId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="DecisionCode" [value]="quoteAcceptance.DecisionCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Decision DateTime" [value]="quoteAcceptance.DecisionDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Accepted By Name" [value]="quoteAcceptance.AcceptedByName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Accepted By PartyContactId" [value]="quoteAcceptance.AcceptedByPartyContactId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Acceptance MethodCode" [value]="quoteAcceptance.AcceptanceMethodCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="DocumentId" [value]="quoteAcceptance.DocumentId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="quoteAcceptance.Remarks">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
