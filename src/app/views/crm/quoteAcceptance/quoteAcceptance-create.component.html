 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="QuoteId" class="mb-1">QuoteId</label>
        <p-dropdown
            inputId="QuoteId" 
            [options]="quoteidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuoteId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuoteId')"
											label="QuoteId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="DecisionCode" class="mb-1">DecisionCode</label>
        <p-dropdown
            inputId="DecisionCode" 
            [options]="decisioncodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DecisionCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DecisionCode')"
											label="DecisionCode">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="DecisionDateTime">Decision DateTime 
							</label> 
							<p-calendar id="DecisionDateTime"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="DecisionDateTime"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('DecisionDateTime')"
											label="Decision DateTime">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="AcceptedByName">Accepted By Name 
							</label> 
							<input pInputText id="AcceptedByName" type="text" pSize="small"	formControlName="AcceptedByName"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('AcceptedByName')"
											label="Accepted By Name">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Accepted By PartyContactId" class="mb-1">AcceptedByPartyContactId</label>
        <p-dropdown
            inputId="AcceptedByPartyContactId" 
            [options]="acceptedbypartycontactidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AcceptedByPartyContactId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AcceptedByPartyContactId')"
											label="Accepted By PartyContactId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Acceptance MethodCode" class="mb-1">AcceptanceMethodCode</label>
        <p-dropdown
            inputId="AcceptanceMethodCode" 
            [options]="acceptancemethodcodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AcceptanceMethodCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AcceptanceMethodCode')"
											label="Acceptance MethodCode">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="DocumentId">DocumentId 
							</label> 
							<p-inputNumber id="DocumentId"  pSize="small"	formControlName="DocumentId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DocumentId')"
											label="DocumentId">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
