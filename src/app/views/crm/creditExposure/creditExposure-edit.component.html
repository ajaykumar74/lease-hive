<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Credit AssessmentId" class="mb-1">CreditAssessmentId</label>
        <p-dropdown
            inputId="CreditAssessmentId" 
            [options]="creditassessmentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CreditAssessmentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CreditAssessmentId')"
											label="Credit AssessmentId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="PartyId" class="mb-1">PartyId</label>
        <p-dropdown
            inputId="PartyId" 
            [options]="partyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')"
											label="PartyId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="OrganisationId" class="mb-1">OrganisationId</label>
        <p-dropdown
            inputId="OrganisationId" 
            [options]="organisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationId')"
											label="OrganisationId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Exposure Type" class="mb-1">ExposureType</label>
        <p-dropdown
            inputId="ExposureType" 
            [options]="exposuretypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ExposureType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ExposureType')"
											label="Exposure Type">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="PrincipalOutstanding">Principal Outstanding 
							</label> 
							<p-inputNumber id="PrincipalOutstanding"  pSize="small"	formControlName="PrincipalOutstanding"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('PrincipalOutstanding')"
											label="Principal Outstanding">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="UndrawnCommitment">Undrawn Commitment 
							</label> 
							<p-inputNumber id="UndrawnCommitment"  pSize="small"	formControlName="UndrawnCommitment"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('UndrawnCommitment')"
											label="Undrawn Commitment">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ProposedExposure">Proposed Exposure 
							</label> 
							<p-inputNumber id="ProposedExposure"  pSize="small"	formControlName="ProposedExposure"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ProposedExposure')"
											label="Proposed Exposure">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TotalExposure">Total Exposure 
							</label> 
							<p-inputNumber id="TotalExposure"  pSize="small"	formControlName="TotalExposure"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TotalExposure')"
											label="Total Exposure">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="AsOfDate">AsOfDate 
							</label> 
							<p-calendar id="AsOfDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="AsOfDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('AsOfDate')"
											label="AsOfDate">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
