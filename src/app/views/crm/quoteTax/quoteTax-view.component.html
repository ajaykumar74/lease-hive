<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="QuoteId" [value]="quoteTax.QuoteId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Quote AssetId" [value]="quoteTax.QuoteAssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quote ChargeId" [value]="quoteTax.QuoteChargeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="TaxType" [value]="quoteTax.TaxType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="TaxRate" [value]="quoteTax.TaxRate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Taxable Amount" [value]="quoteTax.TaxableAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Tax Amount" [value]="quoteTax.TaxAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="JurisdictionId" [value]="quoteTax.JurisdictionId">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
