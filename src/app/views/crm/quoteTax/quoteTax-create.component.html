 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="QuoteId" class="mb-1">QuoteId</label>
        <p-dropdown
            inputId="QuoteId" 
            [options]="quoteidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuoteId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuoteId')"
											label="QuoteId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Quote AssetId" class="mb-1">QuoteAssetId</label>
        <p-dropdown
            inputId="QuoteAssetId" 
            [options]="quoteassetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuoteAssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuoteAssetId')"
											label="Quote AssetId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Quote ChargeId" class="mb-1">QuoteChargeId</label>
        <p-dropdown
            inputId="QuoteChargeId" 
            [options]="quotechargeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuoteChargeId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuoteChargeId')"
											label="Quote ChargeId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="TaxType" class="mb-1">TaxType</label>
        <p-dropdown
            inputId="TaxType" 
            [options]="taxtypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="TaxType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('TaxType')"
											label="TaxType">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TaxRate">TaxRate 
							</label> 
							<p-inputNumber id="TaxRate"  pSize="small"	formControlName="TaxRate"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxRate')"
											label="TaxRate">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TaxableAmount">Taxable Amount 
							</label> 
							<p-inputNumber id="TaxableAmount"  pSize="small"	formControlName="TaxableAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxableAmount')"
											label="Taxable Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="JurisdictionId" binary="true" formControlName="JurisdictionId">
											</p-checkbox>
											<label for="JurisdictionId">JurisdictionId</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">							<label for="TaxRegistrationSnapshot">TaxRegistration Snapshot 
							</label> 
							<p-inputNumber id="TaxRegistrationSnapshot"  pSize="small"	formControlName="TaxRegistrationSnapshot"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxRegistrationSnapshot')"
											label="TaxRegistration Snapshot">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
