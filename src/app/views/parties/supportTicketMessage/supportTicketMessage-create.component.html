 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Support Ticket" class="mb-1">SupportTicketId</label>
        <p-dropdown
            inputId="SupportTicketId" 
            [options]="supportticketidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupportTicketId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupportTicketId')"
											label="Support Ticket">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Sender" class="mb-1">SenderApplicationUserId</label>
        <p-dropdown
            inputId="SenderApplicationUserId" 
            [options]="senderapplicationuseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SenderApplicationUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SenderApplicationUserId')"
											label="Sender">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Sender Type" class="mb-1">SenderTypeCode</label>
        <p-dropdown
            inputId="SenderTypeCode" 
            [options]="sendertypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SenderTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SenderTypeCode')"
											label="Sender Type">
										</app-validation-errors></div><div class="flex flex-col w-full">                 <label for="address">Message</label>
                    <textarea size="small" pTextarea placeholder="Type Message" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Message"
										[ngClass]="{'is-invalid': (editForm.get('Message').touched || editForm.get('Message').dirty) && !editForm.get('Message').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Message')"
											label="Message">
										</app-validation-errors>


               </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsInternalNote" binary="true" formControlName="IsInternalNote">
											</p-checkbox>
											<label for="IsInternalNote">Is Internal Note</label>
										</div>
										<div class="validation-space"></div></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
