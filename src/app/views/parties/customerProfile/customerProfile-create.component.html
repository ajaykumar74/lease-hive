 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="PartyId" class="mb-1">PartyId</label>
        <p-dropdown
            inputId="PartyId" 
            [options]="partyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')"
											label="PartyId">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="CustomerCode">Customer Code 
							</label> 
							<input pInputText id="CustomerCode" type="text" pSize="small"	formControlName="CustomerCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('CustomerCode')"
											label="Customer Code">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Customer Segment" class="mb-1">CustomerSegment</label>
        <p-dropdown
            inputId="CustomerSegment" 
            [options]="customersegmentOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerSegment"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerSegment')"
											label="Customer Segment">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Customer Category" class="mb-1">CustomerCategory</label>
        <p-dropdown
            inputId="CustomerCategory" 
            [options]="customercategoryOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerCategory"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerCategory')"
											label="Customer Category">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Relationship Manager UserId" class="mb-1">RelationshipManagerUserId</label>
        <p-dropdown
            inputId="RelationshipManagerUserId" 
            [options]="relationshipmanageruseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RelationshipManagerUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RelationshipManagerUserId')"
											label="Relationship Manager UserId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Owning Organisation UnitId" class="mb-1">OwningOrganisationUnitId</label>
        <p-dropdown
            inputId="OwningOrganisationUnitId" 
            [options]="owningorganisationunitidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OwningOrganisationUnitId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OwningOrganisationUnitId')"
											label="Owning Organisation UnitId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Default GST RegistrationId" class="mb-1">DefaultGSTRegistrationId</label>
        <p-dropdown
            inputId="DefaultGSTRegistrationId" 
            [options]="defaultgstregistrationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DefaultGSTRegistrationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DefaultGSTRegistrationId')"
											label="Default GST RegistrationId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Default Billing LocationId" class="mb-1">DefaultBillingLocationId</label>
        <p-dropdown
            inputId="DefaultBillingLocationId" 
            [options]="defaultbillinglocationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DefaultBillingLocationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DefaultBillingLocationId')"
											label="Default Billing LocationId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Default Delivery LocationId" class="mb-1">DefaultDeliveryLocationId</label>
        <p-dropdown
            inputId="DefaultDeliveryLocationId" 
            [options]="defaultdeliverylocationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DefaultDeliveryLocationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DefaultDeliveryLocationId')"
											label="Default Delivery LocationId">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="DefaultPaymentTermsDays">Default Payment Terms Days 
							</label> 
							<p-inputNumber id="DefaultPaymentTermsDays"  pSize="small"	formControlName="DefaultPaymentTermsDays"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DefaultPaymentTermsDays')"
											label="Default Payment Terms Days">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Preferred Billing Frequency" class="mb-1">PreferredBillingFrequency</label>
        <p-dropdown
            inputId="PreferredBillingFrequency" 
            [options]="preferredbillingfrequencyOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PreferredBillingFrequency"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PreferredBillingFrequency')"
											label="Preferred Billing Frequency">
										</app-validation-errors></div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="PurchaseOrderRequired" binary="true" formControlName="PurchaseOrderRequired">
											</p-checkbox>
											<label for="PurchaseOrderRequired">Purchase Order Required</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="CustomerSinceDate">Customer Since Date 
							</label> 
							<p-calendar id="CustomerSinceDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="CustomerSinceDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('CustomerSinceDate')"
											label="Customer Since Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
