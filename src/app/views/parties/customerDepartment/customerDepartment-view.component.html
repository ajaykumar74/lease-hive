<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="customerDepartment.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Customer ProfileId" [value]="customerDepartment.CustomerProfileId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Party LocationId" [value]="customerDepartment.PartyLocationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Parent Customer DepartmentId" [value]="customerDepartment.ParentCustomerDepartmentId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Department Code" [value]="customerDepartment.DepartmentCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Department Name" [value]="customerDepartment.DepartmentName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="CostCentre Code" [value]="customerDepartment.CostCentreCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Department Head ContactId" [value]="customerDepartment.DepartmentHeadContactId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Billing Reference" [value]="customerDepartment.BillingReference">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="customerDepartment.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="customerDepartment.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="customerDepartment.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
