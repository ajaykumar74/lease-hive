<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="partyGSTRegistration.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="GSTIN" [value]="partyGSTRegistration.GSTIN">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Legal Name As Per GST" [value]="partyGSTRegistration.LegalNameAsPerGST">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Trade Name As Per GST" [value]="partyGSTRegistration.TradeNameAsPerGST">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="State Code" [value]="partyGSTRegistration.StateCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Registration Type" [value]="partyGSTRegistration.RegistrationType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Registration Date" [value]="partyGSTRegistration.RegistrationDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Principal Location Id" [value]="partyGSTRegistration.PrincipalLocationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Verification Status" [value]="partyGSTRegistration.VerificationStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Verified At" [value]="partyGSTRegistration.VerifiedAt">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Cancellation Date" [value]="partyGSTRegistration.CancellationDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="partyGSTRegistration.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="partyGSTRegistration.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="partyGSTRegistration.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
