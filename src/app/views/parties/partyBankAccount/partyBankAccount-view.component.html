<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="partyBankAccount.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Bank Name" [value]="partyBankAccount.BankName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Branch Name" [value]="partyBankAccount.BranchName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Account Holder Name" [value]="partyBankAccount.AccountHolderName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Account Number" [value]="partyBankAccount.AccountNumber">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="AccountNumber Masked" [value]="partyBankAccount.AccountNumberMasked">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="AccountNumber Encrypted" [value]="partyBankAccount.AccountNumberEncrypted">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Account Type" [value]="partyBankAccount.AccountType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="IFS CCode" [value]="partyBankAccount.IFSCCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="SWIFT Code" [value]="partyBankAccount.SWIFTCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="partyBankAccount.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="IsDefault For Payments" [value]="partyBankAccount.IsDefaultForPayments">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="IsDefault For Refunds" [value]="partyBankAccount.IsDefaultForRefunds">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Verification Status" [value]="partyBankAccount.VerificationStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Verified At" [value]="partyBankAccount.VerifiedAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="partyBankAccount.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="partyBankAccount.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="partyBankAccount.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
