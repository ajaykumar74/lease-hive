<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'PartyContact List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">PartyId <p-sortIcon field="PartyId" /> </th> 
<th style="width:200px">Party LocationId <p-sortIcon field="PartyLocationId" /> </th> 
<th style="width:200px">Contact Type <p-sortIcon field="ContactType" /> </th> 
<th style="width:200px">Title <p-sortIcon field="Title" /> </th> 
<th style="width:200px">First Name <p-sortIcon field="FirstName" /> </th> 
<th style="width:200px">Last Name <p-sortIcon field="LastName" /> </th> 
<th style="width:200px">Record Status <p-sortIcon field="RecordStatus" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.PartyContactId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.PartyId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.PartyLocationId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.ContactType}}</td>
 <td style="width:200px">{{obj.Title}}</td>
 <td style="width:200px">{{obj.FirstName}}</td>
 <td style="width:200px">{{obj.LastName}}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
