<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'SupportTicketStatusHistory List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">Support Ticket <p-sortIcon field="SupportTicketId" /> </th> 
<th style="width:200px">Previous Status <p-sortIcon field="PreviousStatusCode" /> </th> 
<th style="width:200px">New Status <p-sortIcon field="NewStatusCode" /> </th> 
<th style="width:200px">Changed By <p-sortIcon field="ChangedByApplicationUserId" /> </th> 
<th style="width:200px">Change Note <p-sortIcon field="ChangeNote" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.SupportTicketId | number:'1.0':'en-US' }}</td>
 <td style="width:200px"><app-status-pill [value]="obj.PreviousStatusCode"></app-status-pill></td>
 <td style="width:200px"><app-status-pill [value]="obj.NewStatusCode"></app-status-pill></td>
 <td style="width:200px">{{obj.ChangedByApplicationUserId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.ChangeNote}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
