	<div class="grid">

        <p-dropdown

	    formControlName="SupportTicketId"

            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupportTicketId')"

										</app-validation-errors></div></div>

					</div>
				</div>

                     </form>			 

			</div>
		</div>
	</div>
</div>
