<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="RoleType" [value]="partyRole.RoleType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="RoleCode" [value]="partyRole.RoleCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="OrganisationId" [value]="partyRole.OrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="RoleStatus" [value]="partyRole.RoleStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="OnboardingReference" [value]="partyRole.OnboardingReference">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="ApprovedBy" [value]="partyRole.ApprovedBy">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ApprovedById" [value]="partyRole.ApprovedById">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="ApprovedAt" [value]="partyRole.ApprovedAt">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="RecordStatus" [value]="partyRole.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="EffectiveFrom" [value]="partyRole.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
