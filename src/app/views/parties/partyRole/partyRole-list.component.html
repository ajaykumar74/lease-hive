<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'PartyRole List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">RoleType <p-sortIcon field="RoleType" /> </th> 
<th style="width:200px">RoleCode <p-sortIcon field="RoleCode" /> </th> 
<th style="width:200px">RoleStatus <p-sortIcon field="RoleStatus" /> </th> 
<th style="width:200px">ApprovedBy <p-sortIcon field="ApprovedBy" /> </th> 
<th style="width:200px">ApprovedAt <p-sortIcon field="ApprovedAt" /> </th> 
<th style="width:200px">RecordStatus <p-sortIcon field="RecordStatus" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.RoleType}}</td>
 <td style="width:200px">{{obj.RoleCode}}</td>
 <td style="width:200px">{{obj.RoleStatus}}</td>
 <td style="width:200px">{{obj.ApprovedBy}}</td>
 <td style="width:200px">{{obj.ApprovedAt | date:'dd-MMM-yyyy' }}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
