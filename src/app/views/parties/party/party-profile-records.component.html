<section *ngIf="section" class="party-profile-records"><header class="party-profile-records__heading"><div><div class="party-profile-records__title"><i [class]="section.icon"></i><h2>{{ section.title }}</h2><span *ngIf="!loading && !section.unavailable">{{ total }}</span></div><p>{{ section.description }}</p></div><button *ngIf="section.route" pButton type="button" label="Open in Module" icon="pi pi-external-link" class="p-button-outlined p-button-sm" (click)="openModule()"></button></header><div class="party-profile-records__card" *ngIf="!section.unavailable; else integrationGap"><p-table [value]="records" [loading]="loading" [scrollable]="true" responsiveLayout="scroll" [tableStyle]="{ 'min-width': '760px' }"><ng-template pTemplate="header"><tr><th *ngFor="let column of section.columns">{{ column.label }}</th><th class="party-profile-records__actions">Actions</th></tr></ng-template><ng-template pTemplate="body" let-record><tr><td *ngFor="let column of section.columns">{{ format(record[column.field], column.field) }}</td><td class="party-profile-records__actions"><button *ngIf="section.route" pButton type="button" icon="pi pi-eye" class="p-button-rounded p-button-text p-button-sm" aria-label="View record" title="View record" (click)="open(record)"></button><button *ngIf="canEdit(record) && section.route" pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-sm" aria-label="Edit record" title="Edit record" (click)="open(record, true)"></button></td></tr></ng-template><ng-template pTemplate="emptymessage"><tr><td [attr.colspan]="section.columns.length + 1"><div class="party-profile-records__empty"><i [class]="section.icon"></i><strong>{{ section.empty }}</strong></div></td></tr></ng-template></p-table></div><ng-template #integrationGap><div class="party-profile-records__gap"><i class="pi pi-info-circle"></i><div><strong>Integration not available</strong><span>{{ section.empty }}</span></div></div></ng-template></section>
