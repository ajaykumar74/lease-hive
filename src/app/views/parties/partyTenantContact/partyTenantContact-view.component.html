<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Party" [value]="partyTenantContact.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Application User" [value]="partyTenantContact.ApplicationUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contact Role" [value]="partyTenantContact.ContactRoleCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Is Primary" [value]="partyTenantContact.IsPrimary">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Receives Support Tickets" [value]="partyTenantContact.ReceivesSupportTickets">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Receives Escalations" [value]="partyTenantContact.ReceivesEscalations">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Display Order" [value]="partyTenantContact.DisplayOrder">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="partyTenantContact.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="partyTenantContact.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="partyTenantContact.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
