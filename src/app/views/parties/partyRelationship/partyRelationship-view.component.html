<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="From PartyId" [value]="partyRelationship.FromPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="To PartyId" [value]="partyRelationship.ToPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="RelationshipType" [value]="partyRelationship.RelationshipType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Ownership Percentage" [value]="partyRelationship.OwnershipPercentage">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Control Type" [value]="partyRelationship.ControlType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Relationship Reference" [value]="partyRelationship.RelationshipReference">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="partyRelationship.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="partyRelationship.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
