<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Party" [value]="supportTicket.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Party Location" [value]="supportTicket.PartyLocationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Customer Profile" [value]="supportTicket.CustomerProfileId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease Contract" [value]="supportTicket.LeaseContractId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset" [value]="supportTicket.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset User" [value]="supportTicket.AssetUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requester" [value]="supportTicket.RequesterApplicationUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requester Party Contact" [value]="supportTicket.RequesterPartyContactId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Assigned To" [value]="supportTicket.AssignedToApplicationUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Source" [value]="supportTicket.SourceCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Ticket Type" [value]="supportTicket.TicketTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Category" [value]="supportTicket.CategoryCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Priority" [value]="supportTicket.PriorityCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status" [value]="supportTicket.StatusCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Subject" [value]="supportTicket.Subject">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="supportTicket.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Resolution Summary" [value]="supportTicket.ResolutionSummary">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="supportTicket.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
