<div class="container" *ngIf="!loading; else loadingState">
  <div class="grid">
    <div class="col-12 md:col-12">
      <div class="card p-fluid">
        <app-message [AlertType]="'message'"></app-message>
        <app-toolbar-buttons
          (onItemClicked)="onOptionItemClicked($event)"
          [permission]="permission"
          [Caption]="Caption"
          [PageType]="'Details'"
          [IsHandleBack]="true"
          [form]="form">
        </app-toolbar-buttons>
        <app-spinner></app-spinner>

        <p class="text-color-secondary mt-3 mb-0">
          {{ ticket?.TicketId }} · {{ ticket?.PartyName }} · Raised by {{ ticket?.RequesterName }}
        </p>
        <small *ngIf="error" class="block text-red-500 mt-2">{{ error }}</small>

        <form [formGroup]="form" (ngSubmit)="save()">
          <p-fluid>
            <div class="flex mt-5">
              <div class="card flex flex-col gap-4 w-full">
                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="PartyId" class="mb-1">Party *</label>
                    <p-dropdown inputId="PartyId" class="w-full" [options]="partyOptions" optionLabel="Text" optionValue="Id" formControlName="PartyId" placeholder="Select One"></p-dropdown>
                    <app-validation-errors [type]="'text'" [control]="form.get('PartyId')" label="Party"></app-validation-errors>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="PartyLocationId" class="mb-1">Party Location</label>
                    <p-dropdown inputId="PartyLocationId" class="w-full" [options]="locationOptions" optionLabel="Text" optionValue="Id" formControlName="PartyLocationId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="CustomerProfileId" class="mb-1">Customer Profile</label>
                    <p-dropdown inputId="CustomerProfileId" class="w-full" [options]="profileOptions" optionLabel="Text" optionValue="Id" formControlName="CustomerProfileId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="LeaseContractId" class="mb-1">Lease Contract</label>
                    <p-dropdown inputId="LeaseContractId" class="w-full" [options]="contractOptions" optionLabel="Text" optionValue="Id" formControlName="LeaseContractId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="AssetId" class="mb-1">Asset</label>
                    <p-dropdown inputId="AssetId" class="w-full" [options]="assetOptions" optionLabel="Text" optionValue="Id" formControlName="AssetId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="AssetUserId" class="mb-1">Asset User</label>
                    <p-dropdown inputId="AssetUserId" class="w-full" [options]="assetUserOptions" optionLabel="Text" optionValue="Id" formControlName="AssetUserId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="RequesterPartyContactId" class="mb-1">Party Contact</label>
                    <p-dropdown inputId="RequesterPartyContactId" class="w-full" [options]="contactOptions" optionLabel="Text" optionValue="Id" formControlName="RequesterPartyContactId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="AssignedToApplicationUserId" class="mb-1">Assign To</label>
                    <p-dropdown inputId="AssignedToApplicationUserId" class="w-full" [options]="assigneeOptions" optionLabel="Text" optionValue="Id" formControlName="AssignedToApplicationUserId" placeholder="Select One" [showClear]="true"></p-dropdown>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="TicketTypeCode" class="mb-1">Ticket Type *</label>
                    <p-dropdown inputId="TicketTypeCode" class="w-full" [options]="typeOptions" optionLabel="Text" optionValue="Value" formControlName="TicketTypeCode" placeholder="Select One"></p-dropdown>
                    <app-validation-errors [type]="'text'" [control]="form.get('TicketTypeCode')" label="Ticket Type"></app-validation-errors>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="CategoryCode" class="mb-1">Category *</label>
                    <p-dropdown inputId="CategoryCode" class="w-full" [options]="categoryOptions" optionLabel="Text" optionValue="Value" formControlName="CategoryCode" placeholder="Select One"></p-dropdown>
                    <app-validation-errors [type]="'text'" [control]="form.get('CategoryCode')" label="Category"></app-validation-errors>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="PriorityCode" class="mb-1">Priority *</label>
                    <p-dropdown inputId="PriorityCode" class="w-full" [options]="priorityOptions" optionLabel="Text" optionValue="Value" formControlName="PriorityCode" placeholder="Select One"></p-dropdown>
                    <app-validation-errors [type]="'text'" [control]="form.get('PriorityCode')" label="Priority"></app-validation-errors>
                  </div>
                  <div class="flex flex-col w-full">
                    <label for="StatusCode" class="mb-1">Status *</label>
                    <p-dropdown inputId="StatusCode" class="w-full" [options]="statusOptions" optionLabel="Text" optionValue="Value" formControlName="StatusCode" placeholder="Select One"></p-dropdown>
                    <app-validation-errors [type]="'text'" [control]="form.get('StatusCode')" label="Status"></app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col w-full">
                  <label for="Subject" class="mb-1">Subject *</label>
                  <input pInputText id="Subject" type="text" pSize="small" formControlName="Subject" />
                  <app-validation-errors [type]="'text'" [control]="form.get('Subject')" label="Subject"></app-validation-errors>
                </div>

                <div class="flex flex-col w-full">
                  <label for="Description" class="mb-1">Description *</label>
                  <textarea id="Description" pTextarea placeholder="Type Description" [autoResize]="true" rows="4" class="w-full" formControlName="Description"></textarea>
                  <app-validation-errors [type]="'text'" [control]="form.get('Description')" label="Description"></app-validation-errors>
                </div>

                <div class="flex flex-col w-full">
                  <label for="ResolutionSummary" class="mb-1">Resolution Summary</label>
                  <textarea id="ResolutionSummary" pTextarea placeholder="Type resolution summary" [autoResize]="true" rows="3" class="w-full" formControlName="ResolutionSummary"></textarea>
                </div>
              </div>
            </div>
          </p-fluid>
        </form>

        <app-support-ticket-conversation *ngIf="ticket" [ticket]="ticket" (ticketChanged)="onTicketChanged($event)"></app-support-ticket-conversation>

        <div class="mt-5" *ngIf="ticket">
          <app-document-attachment-requirements
            ownerType="SupportTicket"
            [ownerId]="ticket.Id"
            [allowUpload]="false"
            [allowRemove]="false">
          </app-document-attachment-requirements>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingState>
  <div class="container">
    <div class="grid">
      <div class="col-12">
        <div class="card">Loading support ticket…</div>
      </div>
    </div>
  </div>
</ng-template>
