<div class="grid list-page generated-list-page">
<div class="col-12">
		<div class="card list-card generated-list-card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Customer List'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="generated-list-search">
    <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search..." [(ngModel)]="objSearch.Name" (keyup.enter)="search()" aria-label="Search records" />
    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search records" title="Search"></button>
    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div>
</div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table generated-list-table"
				responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">ID <p-sortIcon field="Id" /> </th>

						<th style="width:200px">Customer Code <p-sortIcon field="CustomerCode " /> </th>
						<th style="width:200px">Name <p-sortIcon field="Name" /> </th>
						<th style="width:200px">Mobile Number <p-sortIcon field="MobileNumber " /> </th>
						<th style="width:200px">Email <p-sortIcon field="Email " /> </th>
						<th style="width:200px">Company Name <p-sortIcon field="CompanyName " /> </th>
						<th style="width:200px">Short Name <p-sortIcon field="ShortName " /> </th>
						<th style="width:200px">Customer Category <p-sortIcon field="CustomerCategory " /> </th>
						<th style="width:200px">Classification <p-sortIcon field="Classification " /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{obj.Id}}" [link]="true"
								(click)="onDetailsClick(obj)" /> </td>
						<td style="width:200px">{{obj.CustomerCode}}</td>
						<td style="width:200px">{{obj.FirstName}}</td>
						<td style="width:200px">{{obj.MobileNumber}}</td>
						<td style="width:200px">{{obj.Email}}</td>
						<td style="width:200px">{{obj.CompanyName}}</td>
						<td style="width:200px">{{obj.ShortName}}</td>
						<td style="width:200px">{{obj.CustomerCategory}}</td>
						<td style="width:200px">{{obj.Classification}}</td>

					</tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
