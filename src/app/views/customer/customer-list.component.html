<div class="grid">
	<div class="col-12">
		<div class="card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Customer List'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="col-12 md:col-6">
				<p-inputGroup>
					<input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword"
						[(ngModel)]="objSearch.Name" />
					<button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button>
				</p-inputGroup>
			</div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3"
				responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th>
					 
						<th style="width:200px">CustomerCode <p-sortIcon field="CustomerCode " /> </th>
						<th style="width:200px">Name<p-sortIcon field="Name" /> </th> 
						<th style="width:200px">MobileNumber <p-sortIcon field="MobileNumber " /> </th>
						<th style="width:200px">Email <p-sortIcon field="Email " /> </th>
						<th style="width:200px">CompanyName <p-sortIcon field="CompanyName " /> </th>
						<th style="width:200px">ShortName <p-sortIcon field="ShortName " /> </th>
						<th style="width:200px">CustomerType <p-sortIcon field="CustomerCategory " /> </th>
						<th style="width:200px">Classification <p-sortIcon field="Classification " /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{obj.Id}}" [link]="true"
								(click)="onDetailsClick(obj)" /> </td> 
						<td style="width:200px">{{obj.CustomerCode}}</td>
						<td style="width:200px">{{obj.FirstName}}</td> 
						<td style="width:200px">{{obj.MobileNumber}}</td>
						<td style="width:200px">{{obj.Email}}</td>
						<td style="width:200px">{{obj.CompanyName}}</td>
						<td style="width:200px">{{obj.ShortName}}</td>
						<td style="width:200px">{{obj.CustomerCategory}}</td>
						<td style="width:200px">{{obj.Classification}}</td>

					</tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
