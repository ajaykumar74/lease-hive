<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form>
					<div class="md:w-1/2">
						<div class="card flex flex-col gap-4"> 
							<div class="grid grid-cols-12 gap-2">
								<label class="col-span-12 md:col-span-2 font-semibold">Name</label>
								<div class="col-span-12 md:col-span-10 font-medium">:{{customer?.Id}}</div>
						       </div>
					        </div> 
					</div> 

					</form>
			</div>
		</div>
	</div>
</div>
