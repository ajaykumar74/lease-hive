<div class="grid">
	<div class="col-12">
		<div class="card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Notifications'" [PageType]="'List'">
			</app-toolbar-buttons>

			<app-spinner></app-spinner>

			<div class="col-12 md:col-6">
				<div class="flex flex-col items-center mb-12">
					<div class="w-1/2 md:w-6 lg:w-4 xl:w-3">
						<p-inputGroup>
							<input pSize="small" type="text" class="p-inputtext-sm" pInputText placeholder="type subject"
								[(ngModel)]="objSearch.Title" />

							<p-inputgroup-addon>
								<i class="pi pi-times" style="cursor: pointer;" (click)="clearSearch()">
								</i>
							</p-inputgroup-addon>

							<p-button label="Search" pRipple size="small" (click)="search()" />
						</p-inputGroup>

						<label style="font-size:small;">Records Found: {{ totalNoOfRecords }}</label>
					</div>
				</div>
			</div>

			<p-table [size]="gridSize" [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
				styleClass="mt-3" responsiveLayout="scroll">

				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:60px">
							Id <p-sortIcon field="Id" />
						</th>
						<th>Name</th>
						<th>To</th>
						<th>Subject</th>
						<th>SubmittedAt</th>
						<th>Status</th>
						<th>RecordByType</th>
						<th>CustomerId</th>
					</tr>
				</ng-template>

				<ng-template pTemplate="body" let-obj>
					<tr [ngStyle]="rowStyle(obj)">
						<td style="width: 60px;" pFrozenColumn pTooltip="Click here to view details">

							<p-button label="{{ obj.Id }}" [link]="true" (click)="onDetailsClick(obj)">
							</p-button>
						</td>
						<td>{{ obj.Name || '-' }}</td>
						<td>{{ obj.To || '-' }}</td>
						<td>{{ obj.Subject || '-' }}</td>
						<td>{{ obj.SubmittedAt || '-' }}</td>
						<td>{{ obj.Status || '-' }}</td>
						<td>{{ obj.RecordByType || '-' }}</td>
						<td>{{ obj.CustomerId || '-' }}</td>
					</tr>
				</ng-template>

			</p-table>

			<div class="flex justify-content-center">
				<p-paginator (onPageChange)="onPageChanged($event)" [first]="pgEvent.first" [rows]="pgEvent.rows"
					[totalRecords]="totalNoOfRecords" [rowsPerPageOptions]="[10,20,30,40,50]">
				</p-paginator>
			</div>

		</div>
	</div>
</div>
