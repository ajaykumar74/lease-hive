<div class="grid list-page generated-list-page">
	<div class="col-12">
		<div class="card list-card generated-list-card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Notifications'" [PageType]="'List'">
			</app-toolbar-buttons>

			<app-spinner></app-spinner><div class="generated-list-search">
    <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search..." [(ngModel)]="objSearch.Title" (keyup.enter)="search()" aria-label="Search records" />
    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search records" title="Search"></button>
    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div></div>

			<p-table [size]="gridSize" [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
				styleClass="list-table generated-list-table" responsiveLayout="scroll">

				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:60px">ID <p-sortIcon field="Id" />
						</th>
						<th>Name</th>
						<th>To</th>
						<th>Subject</th>
						<th>Submitted At</th>
						<th>Status</th>
						<th>Record By Type</th>
						<th>Customer ID</th>
					</tr>
				</ng-template>

				<ng-template pTemplate="body" let-obj>
					<tr [ngStyle]="rowStyle(obj)">
						<td style="width: 60px;" pFrozenColumn pTooltip="Click here to view details">

							<p-button label="{{ obj.Id }}" [link]="true" (click)="onDetailsClick(obj)">
							</p-button>
						</td>
						<td>{{ obj.Name || '-' }}</td>
						<td>{{ obj.To || '-' }}</td>
						<td>{{ obj.Subject || '-' }}</td>
						<td>{{ obj.SubmittedAt || '-' }}</td>
						<td>{{ obj.Status || '-' }}</td>
						<td>{{ obj.RecordByType || '-' }}</td>
						<td>{{ obj.CustomerId || '-' }}</td>
					</tr>
				</ng-template>

			</p-table>

			<div class="flex justify-content-center">
				<p-paginator (onPageChange)="onPageChanged($event)" [first]="pgEvent.first" [rows]="pgEvent.rows"
					[totalRecords]="totalNoOfRecords" [rowsPerPageOptions]="[10,20,30,40,50]">
				</p-paginator>
			</div>

		</div>
	</div>
</div>
