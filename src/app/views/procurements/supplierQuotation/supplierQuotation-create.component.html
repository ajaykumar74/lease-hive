 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="RFQ Id" class="mb-1">RFQId</label>
        <p-dropdown
            inputId="RFQId" 
            [options]="rfqidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RFQId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RFQId')"
											label="RFQ Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Supplier Party Id" class="mb-1">SupplierPartyId</label>
        <p-dropdown
            inputId="SupplierPartyId" 
            [options]="supplierpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupplierPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupplierPartyId')"
											label="Supplier Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="SupplierQuoteNo">Supplier Quote No 
							</label> 
							<input pInputText id="SupplierQuoteNo" type="text" pSize="small"	formControlName="SupplierQuoteNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('SupplierQuoteNo')"
											label="Supplier Quote No">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="VersionNo">Version No 
							</label> 
							<p-inputNumber id="VersionNo"  pSize="small"	formControlName="VersionNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('VersionNo')"
											label="Version No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="QuoteDate">Quote Date 
							</label> 
							<p-calendar id="QuoteDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="QuoteDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('QuoteDate')"
											label="Quote Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="ValidUntil">Valid Until 
							</label> 
							<p-calendar id="ValidUntil"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ValidUntil"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ValidUntil')"
											label="Valid Until">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="Subtotal">Subtotal 
							</label> 
							<p-inputNumber id="Subtotal"  pSize="small"	formControlName="Subtotal"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Subtotal')"
											label="Subtotal">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TotalAmount">Total Amount 
							</label> 
							<p-inputNumber id="TotalAmount"  pSize="small"	formControlName="TotalAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TotalAmount')"
											label="Total Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="PaymentTermCode">Payment Term Code 
							</label> 
							<input pInputText id="PaymentTermCode" type="text" pSize="small"	formControlName="PaymentTermCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('PaymentTermCode')"
											label="Payment Term Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DeliveryDays">Delivery Days 
							</label> 
							<p-inputNumber id="DeliveryDays"  pSize="small"	formControlName="DeliveryDays"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DeliveryDays')"
											label="Delivery Days">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Quotation Status Code" class="mb-1">QuotationStatusCode</label>
        <p-dropdown
            inputId="QuotationStatusCode" 
            [options]="quotationstatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="QuotationStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('QuotationStatusCode')"
											label="Quotation Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
