 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="PRNo">PR No 
							</label> 
							<input pInputText id="PRNo" type="text" pSize="small"	formControlName="PRNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('PRNo')"
											label="PR No">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Buying Organisation Id" class="mb-1">BuyingOrganisationId</label>
        <p-dropdown
            inputId="BuyingOrganisationId" 
            [options]="buyingorganisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="BuyingOrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('BuyingOrganisationId')"
											label="Buying Organisation Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Requesting Organisation Unit Id" class="mb-1">RequestingOrganisationUnitId</label>
        <p-dropdown
            inputId="RequestingOrganisationUnitId" 
            [options]="requestingorganisationunitidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RequestingOrganisationUnitId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RequestingOrganisationUnitId')"
											label="Requesting Organisation Unit Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Requested By User Id" class="mb-1">RequestedByUserId</label>
        <p-dropdown
            inputId="RequestedByUserId" 
            [options]="requestedbyuseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RequestedByUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RequestedByUserId')"
											label="Requested By User Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Purchase Requisition Status Id" class="mb-1">PurchaseRequisitionStatusId</label>
        <p-dropdown
            inputId="PurchaseRequisitionStatusId" 
            [options]="purchaserequisitionstatusidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PurchaseRequisitionStatusId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseRequisitionStatusId')"
											label="Purchase Requisition Status Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="RequisitionDate">Requisition Date 
							</label> 
							<p-calendar id="RequisitionDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RequisitionDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RequisitionDate')"
											label="Requisition Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="RequiredByDate">Required By Date 
							</label> 
							<p-calendar id="RequiredByDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RequiredByDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RequiredByDate')"
											label="Required By Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Source Reference Type" class="mb-1">SourceReferenceType</label>
        <p-dropdown
            inputId="SourceReferenceType" 
            [options]="sourcereferencetypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SourceReferenceType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SourceReferenceType')"
											label="Source Reference Type">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="SourceReferenceId">Source Reference Id 
							</label> 
							<p-inputNumber id="SourceReferenceId"  pSize="small"	formControlName="SourceReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('SourceReferenceId')"
											label="Source Reference Id">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="EstimatedTotal">Estimated Total 
							</label> 
							<p-inputNumber id="EstimatedTotal"  pSize="small"	formControlName="EstimatedTotal"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('EstimatedTotal')"
											label="Estimated Total">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Justification</label>
                    <textarea size="small" pTextarea placeholder="Type Justification" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Justification"
										[ngClass]="{'is-invalid': (editForm.get('Justification').touched || editForm.get('Justification').dirty) && !editForm.get('Justification').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Justification')"
											label="Justification">
										</app-validation-errors>


               </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
