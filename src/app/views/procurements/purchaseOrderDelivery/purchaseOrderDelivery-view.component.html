<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="Purchase Order Line Id" [value]="purchaseOrderDelivery.PurchaseOrderLineId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Schedule No" [value]="purchaseOrderDelivery.ScheduleNo">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Delivery Location Id" [value]="purchaseOrderDelivery.DeliveryLocationId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Scheduled Quantity" [value]="purchaseOrderDelivery.ScheduledQuantity">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Promised Date" [value]="purchaseOrderDelivery.PromisedDate">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Receiving Organisation Unit Id" [value]="purchaseOrderDelivery.ReceivingOrganisationUnitId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Instructions" [value]="purchaseOrderDelivery.Instructions">
								</app-view-field></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
