 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Goods Receipt Id" class="mb-1">GoodsReceiptId</label>
        <p-dropdown
            inputId="GoodsReceiptId" 
            [options]="goodsreceiptidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="GoodsReceiptId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('GoodsReceiptId')"
											label="Goods Receipt Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Purchase Order Line Id" class="mb-1">PurchaseOrderLineId</label>
        <p-dropdown
            inputId="PurchaseOrderLineId" 
            [options]="purchaseorderlineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PurchaseOrderLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseOrderLineId')"
											label="Purchase Order Line Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ReceivedQuantity">Received Quantity 
							</label> 
							<p-inputNumber id="ReceivedQuantity"  pSize="small"	formControlName="ReceivedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReceivedQuantity')"
											label="Received Quantity">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="AcceptedQuantity">Accepted Quantity 
							</label> 
							<p-inputNumber id="AcceptedQuantity"  pSize="small"	formControlName="AcceptedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('AcceptedQuantity')"
											label="Accepted Quantity">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="RejectedQuantity">Rejected Quantity 
							</label> 
							<p-inputNumber id="RejectedQuantity"  pSize="small"	formControlName="RejectedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RejectedQuantity')"
											label="Rejected Quantity">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="UOM Id" class="mb-1">UOMId</label>
        <p-dropdown
            inputId="UOMId" 
            [options]="uomidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="UOMId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('UOMId')"
											label="UOM Id">
										</app-validation-errors></div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="InspectionRequired" binary="true" formControlName="InspectionRequired">
											</p-checkbox>
											<label for="InspectionRequired">Inspection Required</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Inspection Status Code" class="mb-1">InspectionStatusCode</label>
        <p-dropdown
            inputId="InspectionStatusCode" 
            [options]="inspectionstatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InspectionStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InspectionStatusCode')"
											label="Inspection Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full">                 <label for="address">Rejection Reason</label>
                    <textarea size="small" pTextarea placeholder="Type Rejection Reason" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="RejectionReason"
										[ngClass]="{'is-invalid': (editForm.get('RejectionReason').touched || editForm.get('RejectionReason').dirty) && !editForm.get('RejectionReason').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('RejectionReason')"
											label="Rejection Reason">
										</app-validation-errors>


               </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
