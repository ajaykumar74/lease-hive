<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-wrap" >  <label for="Reference Type" class="mb-1">ReferenceType</label>
        <p-dropdown
            inputId="ReferenceType" 
            [options]="referencetypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReferenceType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceType')"
											label="Reference Type">
										</app-validation-errors></div>
<div class="flex flex-wrap" > 							<label for="ReferenceId">Reference Id 
							</label> 
							<p-inputNumber id="ReferenceId"  pSize="small"	formControlName="ReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceId')"
											label="Reference Id">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" >  <label for="Exception Type Code" class="mb-1">ExceptionTypeCode</label>
        <p-dropdown
            inputId="ExceptionTypeCode" 
            [options]="exceptiontypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ExceptionTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ExceptionTypeCode')"
											label="Exception Type Code">
										</app-validation-errors></div>
<div class="flex flex-wrap" >  <label for="Severity Code" class="mb-1">SeverityCode</label>
        <p-dropdown
            inputId="SeverityCode" 
            [options]="severitycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SeverityCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SeverityCode')"
											label="Severity Code">
										</app-validation-errors></div>
<div class="flex flex-wrap" >                  <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div>
<div class="flex flex-wrap" >  <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div>
<div class="flex flex-wrap" >  <label for="Assigned To User Id" class="mb-1">AssignedToUserId</label>
        <p-dropdown
            inputId="AssignedToUserId" 
            [options]="assignedtouseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssignedToUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssignedToUserId')"
											label="Assigned To User Id">
										</app-validation-errors></div>
<div class="flex flex-wrap" >                  <label for="address">Resolution</label>
                    <textarea size="small" pTextarea placeholder="Type Resolution" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Resolution"
										[ngClass]="{'is-invalid': (editForm.get('Resolution').touched || editForm.get('Resolution').dirty) && !editForm.get('Resolution').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Resolution')"
											label="Resolution">
										</app-validation-errors>


               </div>
<div class="flex flex-wrap" > 			
							<label for="ResolvedOn">Resolved On 
							</label> 
							<p-calendar id="ResolvedOn"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ResolvedOn"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ResolvedOn')"
											label="Resolved On">
										</app-validation-errors>
						 </div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
