<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="Reference Type" [value]="approvalRequest.ReferenceType">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Reference Id" [value]="approvalRequest.ReferenceId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Workflow Definition Id" [value]="approvalRequest.WorkflowDefinitionId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Approval Status Code" [value]="approvalRequest.ApprovalStatusCode">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Requested By" [value]="approvalRequest.RequestedBy">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Requested On" [value]="approvalRequest.RequestedOn">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Completed On" [value]="approvalRequest.CompletedOn">
								</app-view-field></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
