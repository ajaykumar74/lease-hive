<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Supplier Invoice Id" class="mb-1">SupplierInvoiceId</label>
        <p-dropdown
            inputId="SupplierInvoiceId" 
            [options]="supplierinvoiceidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupplierInvoiceId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupplierInvoiceId')"
											label="Supplier Invoice Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Purchase Order Line Id" class="mb-1">PurchaseOrderLineId</label>
        <p-dropdown
            inputId="PurchaseOrderLineId" 
            [options]="purchaseorderlineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PurchaseOrderLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseOrderLineId')"
											label="Purchase Order Line Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Goods Receipt Line Id" class="mb-1">GoodsReceiptLineId</label>
        <p-dropdown
            inputId="GoodsReceiptLineId" 
            [options]="goodsreceiptlineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="GoodsReceiptLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('GoodsReceiptLineId')"
											label="Goods Receipt Line Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div><div class="flex flex-col w-full">							<label for="InvoicedQuantity">Invoiced Quantity 
							</label> 
							<p-inputNumber id="InvoicedQuantity"  pSize="small"	formControlName="InvoicedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('InvoicedQuantity')"
											label="Invoiced Quantity">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="UOM Id" class="mb-1">UOMId</label>
        <p-dropdown
            inputId="UOMId" 
            [options]="uomidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="UOMId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('UOMId')"
											label="UOM Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="UnitPrice">Unit Price 
							</label> 
							<p-inputNumber id="UnitPrice"  pSize="small"	formControlName="UnitPrice"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('UnitPrice')"
											label="Unit Price">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="LineTotal">Line Total 
							</label> 
							<p-inputNumber id="LineTotal"  pSize="small"	formControlName="LineTotal"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineTotal')"
											label="Line Total">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
