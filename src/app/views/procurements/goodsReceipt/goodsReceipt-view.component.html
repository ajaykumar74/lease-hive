<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="GRN No" [value]="goodsReceipt.GRNNo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Purchase Order Id" [value]="goodsReceipt.PurchaseOrderId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Supplier Party Id" [value]="goodsReceipt.SupplierPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Receiving Organisation Unit Id" [value]="goodsReceipt.ReceivingOrganisationUnitId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Receipt Location Id" [value]="goodsReceipt.ReceiptLocationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Goods Receipt Status Id" [value]="goodsReceipt.GoodsReceiptStatusId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Receipt Date Time" [value]="goodsReceipt.ReceiptDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Supplier Delivery Note No" [value]="goodsReceipt.SupplierDeliveryNoteNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Received By User Id" [value]="goodsReceipt.ReceivedByUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="goodsReceipt.Remarks">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
