<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="Status Code" [value]="purchaseOrderStatus.StatusCode">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Status Name" [value]="purchaseOrderStatus.StatusName">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Is Editable" [value]="purchaseOrderStatus.IsEditable">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Is Terminal" [value]="purchaseOrderStatus.IsTerminal">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Sort Order" [value]="purchaseOrderStatus.SortOrder">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Effective From" [value]="purchaseOrderStatus.EffectiveFrom">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Effective To" [value]="purchaseOrderStatus.EffectiveTo">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Record Status" [value]="purchaseOrderStatus.RecordStatus">
								</app-view-field></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
