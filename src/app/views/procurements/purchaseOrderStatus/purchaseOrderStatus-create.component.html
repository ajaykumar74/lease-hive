 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-wrap" > 					
							<label for="StatusCode">Status Code 
							</label> 
							<input pInputText id="StatusCode" type="text" pSize="small"	formControlName="StatusCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" > 					
							<label for="StatusName">Status Name 
							</label> 
							<input pInputText id="StatusName" type="text" pSize="small"	formControlName="StatusName"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('StatusName')"
											label="Status Name">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" > <label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsEditable" binary="true" formControlName="IsEditable">
											</p-checkbox>
											<label for="IsEditable">Is Editable</label>
										</div>
										<div class="validation-space"></div></div>
<div class="flex flex-wrap" > <label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsTerminal" binary="true" formControlName="IsTerminal">
											</p-checkbox>
											<label for="IsTerminal">Is Terminal</label>
										</div>
										<div class="validation-space"></div></div>
<div class="flex flex-wrap" > 							<label for="SortOrder">Sort Order 
							</label> 
							<p-inputNumber id="SortOrder"  pSize="small"	formControlName="SortOrder"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('SortOrder')"
											label="Sort Order">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" > 			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" > 			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
