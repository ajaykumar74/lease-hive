<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="Reference Type" [value]="procurementHandoff.ReferenceType">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Reference Id" [value]="procurementHandoff.ReferenceId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Target Module Code" [value]="procurementHandoff.TargetModuleCode">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Handoff Status Code" [value]="procurementHandoff.HandoffStatusCode">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Handoff Date Time" [value]="procurementHandoff.HandoffDateTime">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Target Reference Id" [value]="procurementHandoff.TargetReferenceId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Validation Json" [value]="procurementHandoff.ValidationJson">
								</app-view-field></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
