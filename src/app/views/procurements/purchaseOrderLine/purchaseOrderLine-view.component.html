<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Purchase Order Id" [value]="purchaseOrderLine.PurchaseOrderId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="purchaseOrderLine.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Purchase Requisition Line Id" [value]="purchaseOrderLine.PurchaseRequisitionLineId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Supplier Quotation Line Id" [value]="purchaseOrderLine.SupplierQuotationLineId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Line Type Code" [value]="purchaseOrderLine.LineTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Category Id" [value]="purchaseOrderLine.AssetCategoryId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Type Id" [value]="purchaseOrderLine.AssetTypeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="purchaseOrderLine.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Ordered Quantity" [value]="purchaseOrderLine.OrderedQuantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="UOM Id" [value]="purchaseOrderLine.UOMId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Unit Price" [value]="purchaseOrderLine.UnitPrice">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Discount Amount" [value]="purchaseOrderLine.DiscountAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Tax Amount" [value]="purchaseOrderLine.TaxAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line Total" [value]="purchaseOrderLine.LineTotal">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Required By Date" [value]="purchaseOrderLine.RequiredByDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Specifications Json" [value]="purchaseOrderLine.SpecificationsJson">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
