 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Purchase Order Id" class="mb-1">PurchaseOrderId</label>
        <p-dropdown
            inputId="PurchaseOrderId" 
            [options]="purchaseorderidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PurchaseOrderId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseOrderId')"
											label="Purchase Order Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Purchase Requisition Line Id" class="mb-1">PurchaseRequisitionLineId</label>
        <p-dropdown
            inputId="PurchaseRequisitionLineId" 
            [options]="purchaserequisitionlineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PurchaseRequisitionLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseRequisitionLineId')"
											label="Purchase Requisition Line Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Supplier Quotation Line Id" class="mb-1">SupplierQuotationLineId</label>
        <p-dropdown
            inputId="SupplierQuotationLineId" 
            [options]="supplierquotationlineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupplierQuotationLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupplierQuotationLineId')"
											label="Supplier Quotation Line Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Line Type Code" class="mb-1">LineTypeCode</label>
        <p-dropdown
            inputId="LineTypeCode" 
            [options]="linetypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LineTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LineTypeCode')"
											label="Line Type Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Asset Category Id" class="mb-1">AssetCategoryId</label>
        <p-dropdown
            inputId="AssetCategoryId" 
            [options]="assetcategoryidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetCategoryId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetCategoryId')"
											label="Asset Category Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Type Id" class="mb-1">AssetTypeId</label>
        <p-dropdown
            inputId="AssetTypeId" 
            [options]="assettypeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetTypeId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetTypeId')"
											label="Asset Type Id">
										</app-validation-errors></div><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="OrderedQuantity">Ordered Quantity 
							</label> 
							<p-inputNumber id="OrderedQuantity"  pSize="small"	formControlName="OrderedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('OrderedQuantity')"
											label="Ordered Quantity">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="UOM Id" class="mb-1">UOMId</label>
        <p-dropdown
            inputId="UOMId" 
            [options]="uomidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="UOMId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('UOMId')"
											label="UOM Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="UnitPrice">Unit Price 
							</label> 
							<p-inputNumber id="UnitPrice"  pSize="small"	formControlName="UnitPrice"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('UnitPrice')"
											label="Unit Price">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DiscountAmount">Discount Amount 
							</label> 
							<p-inputNumber id="DiscountAmount"  pSize="small"	formControlName="DiscountAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DiscountAmount')"
											label="Discount Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="LineTotal">Line Total 
							</label> 
							<p-inputNumber id="LineTotal"  pSize="small"	formControlName="LineTotal"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineTotal')"
											label="Line Total">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="RequiredByDate">Required By Date 
							</label> 
							<p-calendar id="RequiredByDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RequiredByDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RequiredByDate')"
											label="Required By Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Specifications Json</label>
                    <textarea size="small" pTextarea placeholder="Type Specifications Json" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="SpecificationsJson"
										[ngClass]="{'is-invalid': (editForm.get('SpecificationsJson').touched || editForm.get('SpecificationsJson').dirty) && !editForm.get('SpecificationsJson').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('SpecificationsJson')"
											label="Specifications Json">
										</app-validation-errors>


               </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
