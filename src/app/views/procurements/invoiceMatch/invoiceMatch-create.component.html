 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-wrap" >  <label for="Supplier Invoice Id" class="mb-1">SupplierInvoiceId</label>
        <p-dropdown
            inputId="SupplierInvoiceId" 
            [options]="supplierinvoiceidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupplierInvoiceId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupplierInvoiceId')"
											label="Supplier Invoice Id">
										</app-validation-errors></div>
<div class="flex flex-wrap" >  <label for="Purchase Order Id" class="mb-1">PurchaseOrderId</label>
        <p-dropdown
            inputId="PurchaseOrderId" 
            [options]="purchaseorderidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PurchaseOrderId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseOrderId')"
											label="Purchase Order Id">
										</app-validation-errors></div>
<div class="flex flex-wrap" >  <label for="Goods Receipt Id" class="mb-1">GoodsReceiptId</label>
        <p-dropdown
            inputId="GoodsReceiptId" 
            [options]="goodsreceiptidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="GoodsReceiptId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('GoodsReceiptId')"
											label="Goods Receipt Id">
										</app-validation-errors></div>
<div class="flex flex-wrap" >  <label for="Match Type Code" class="mb-1">MatchTypeCode</label>
        <p-dropdown
            inputId="MatchTypeCode" 
            [options]="matchtypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MatchTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MatchTypeCode')"
											label="Match Type Code">
										</app-validation-errors></div>
<div class="flex flex-wrap" > 			
							<label for="MatchedOn">Matched On 
							</label> 
							<p-calendar id="MatchedOn"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="MatchedOn"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('MatchedOn')"
											label="Matched On">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" >  <label for="Matched By" class="mb-1">MatchedBy</label>
        <p-dropdown
            inputId="MatchedBy" 
            [options]="matchedbyOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MatchedBy"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MatchedBy')"
											label="Matched By">
										</app-validation-errors></div>
<div class="flex flex-wrap" > 							<label for="QuantityVariance">Quantity Variance 
							</label> 
							<p-inputNumber id="QuantityVariance"  pSize="small"	formControlName="QuantityVariance"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('QuantityVariance')"
											label="Quantity Variance">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" > 							<label for="AmountVariance">Amount Variance 
							</label> 
							<p-inputNumber id="AmountVariance"  pSize="small"	formControlName="AmountVariance"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('AmountVariance')"
											label="Amount Variance">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" > <label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="TolerancePassed" binary="true" formControlName="TolerancePassed">
											</p-checkbox>
											<label for="TolerancePassed">Tolerance Passed</label>
										</div>
										<div class="validation-space"></div></div>
<div class="flex flex-wrap" >  <label for="Match Result Code" class="mb-1">MatchResultCode</label>
        <p-dropdown
            inputId="MatchResultCode" 
            [options]="matchresultcodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MatchResultCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MatchResultCode')"
											label="Match Result Code">
										</app-validation-errors></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
