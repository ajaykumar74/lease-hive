<div class="container">
    <div class="grid">
        <div class="col-12 md:col-12">
            <div class="card p-fluid">
                <app-message [AlertType]="'message'"></app-message>
                <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'Details'" [form]="editForm"> </app-toolbar-buttons>
                <app-spinner></app-spinner>

                <form [formGroup]="editForm" (ngSubmit)="Save()">
                    <p-fluid>
                        <div class="flex mt-8">
                            <div class="card flex flex-col gap-4 w-full">
                                <div class="flex flex-wrap">
                                        <label for="AssetId" class="mb-1">Asset</label>
                                        @if (assetId) {
                                            <div class="p-3 border-1 surface-border border-round">
                                                <div class="font-semibold"><span>{{ asset?.AssetNo || 'Asset #' + assetId }}</span> | <span>Serial: {{ asset?.PrimarySerialNo }}</span></div>
                                            </div>
                                        } @else {
                                            <p-dropdown inputId="AssetId" [options]="assetidOptions" optionLabel="Text" optionValue="Value" formControlName="AssetId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        }
                                    <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')" label="AssetId"> </app-validation-errors>
                                </div>

                                <div class="flex flex-wrap">
                                    <label for="OrganisationId">OrganisationId </label>
                                    <input pInputText id="OrganisationId" type="text" pSize="small" formControlName="OrganisationId" />
                                    <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationId')" label="OrganisationId"> </app-validation-errors>
                                </div>

                                <div class="flex flex-wrap">
                                    <label for="OwnershipType" class="mb-1">OwnershipType</label>
                                    <p-dropdown inputId="OwnershipType" [options]="ownershiptypeOptions" optionLabel="Text" optionValue="Value" formControlName="OwnershipType" placeholder="Select One" class="w-full"> </p-dropdown>
                                    <app-validation-errors [type]="'text'" [control]="editForm.get('OwnershipType')" label="OwnershipType"> </app-validation-errors>
                                </div>

                                <div class="flex flex-wrap">
                                    <label class="pt-8"></label>
                                    <div class="flex items-center gap-2">
                                        <p-checkbox inputId="AcquisitionReference" binary="true" formControlName="AcquisitionReference"> </p-checkbox>
                                        <label for="AcquisitionReference">AcquisitionReference</label>
                                    </div>
                                    <div class="validation-space"></div>
                                </div>

                                <div class="flex flex-wrap">
                                    <label for="address">Remarks</label>
                                    <textarea
                                        size="small"
                                        pTextarea
                                        placeholder="Type Remarks"
                                        [autoResize]="true"
                                        rows="3"
                                        class="w-full"
                                        cols="30"
                                        formControlName="Remarks"
                                        [ngClass]="{ 'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"
                                    ></textarea>
                                    <app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')" label="Remarks"> </app-validation-errors>
                                </div>

                                <div class="flex flex-wrap">
                                    <label for="EffectiveFrom">Effective From </label>
                                    <p-calendar id="EffectiveFrom" size="small" dateFormat="dd-MM-yy" [showIcon]="true" formControlName="EffectiveFrom"></p-calendar>
                                    <app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')" label="Effective From"> </app-validation-errors>
                                </div>

                                <div class="flex flex-wrap">
                                    <label for="EffectiveTo">Effective To </label>
                                    <p-calendar id="EffectiveTo" size="small" dateFormat="dd-MM-yy" [showIcon]="true" formControlName="EffectiveTo"></p-calendar>
                                    <app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')" label="Effective To"> </app-validation-errors>
                                </div>


                            </div>
                        </div>
                    </p-fluid>
                </form>
            </div>
        </div>
    </div>
</div>
