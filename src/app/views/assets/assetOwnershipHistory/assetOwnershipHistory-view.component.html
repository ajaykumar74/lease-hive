<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="AssetId" [value]="assetOwnershipHistory.AssetId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="OrganisationId" [value]="assetOwnershipHistory.OrganisationId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="OwnershipType" [value]="assetOwnershipHistory.OwnershipType">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="AcquisitionReference" [value]="assetOwnershipHistory.AcquisitionReference">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Remarks" [value]="assetOwnershipHistory.Remarks">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Effective From" [value]="assetOwnershipHistory.EffectiveFrom">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Effective To" [value]="assetOwnershipHistory.EffectiveTo">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Record Status" [value]="assetOwnershipHistory.RecordStatus">
								</app-view-field></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
