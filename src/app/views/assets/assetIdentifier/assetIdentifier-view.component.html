<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="AssetId" [value]="assetIdentifier.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="IdentifierTypeCode" [value]="assetIdentifier.IdentifierTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Identifier Value" [value]="assetIdentifier.IdentifierValue">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Issuing CountryCode" [value]="assetIdentifier.IssuingCountryCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="IssuingState Code" [value]="assetIdentifier.IssuingStateCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="IsPrimary" [value]="assetIdentifier.IsPrimary">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="IsVerified" [value]="assetIdentifier.IsVerified">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="assetIdentifier.EffectiveFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="assetIdentifier.EffectiveTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="assetIdentifier.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
