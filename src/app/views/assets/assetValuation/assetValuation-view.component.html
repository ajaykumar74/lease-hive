<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="assetValuation.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Valuation Type Id" [value]="assetValuation.ValuationTypeId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Valuation Date" [value]="assetValuation.ValuationDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="assetValuation.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Valuation Amount" [value]="assetValuation.ValuationAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Valuer Party Id" [value]="assetValuation.ValuerPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Method Code" [value]="assetValuation.MethodCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Document Id" [value]="assetValuation.ReferenceDocumentId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Valid To" [value]="assetValuation.ValidTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="assetValuation.Remarks">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
