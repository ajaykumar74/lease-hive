 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Valuation Type Id" class="mb-1">ValuationTypeId</label>
        <p-dropdown
            inputId="ValuationTypeId" 
            [options]="valuationtypeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ValuationTypeId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ValuationTypeId')"
											label="Valuation Type Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ValuationDate">Valuation Date 
							</label> 
							<p-calendar id="ValuationDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ValuationDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ValuationDate')"
											label="Valuation Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <app-currency-dropdown inputId="CurrencyCode" formControlName="CurrencyCode"></app-currency-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ValuationAmount">Valuation Amount 
							</label> 
							<p-inputNumber id="ValuationAmount"  pSize="small"	formControlName="ValuationAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ValuationAmount')"
											label="Valuation Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Valuer Party Id" class="mb-1">ValuerPartyId</label>
        <p-dropdown
            inputId="ValuerPartyId" 
            [options]="valuerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ValuerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ValuerPartyId')"
											label="Valuer Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="MethodCode">Method Code 
							</label> 
							<input pInputText id="MethodCode" type="text" pSize="small"	formControlName="MethodCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('MethodCode')"
											label="Method Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Reference Document Id" class="mb-1">ReferenceDocumentId</label>
        <p-dropdown
            inputId="ReferenceDocumentId" 
            [options]="referencedocumentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReferenceDocumentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceDocumentId')"
											label="Reference Document Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ValidTo">Valid To 
							</label> 
							<p-calendar id="ValidTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ValidTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ValidTo')"
											label="Valid To">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
