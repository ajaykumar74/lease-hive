 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="AssetCategoryId" class="mb-1">AssetCategoryId</label>
        <p-dropdown
            inputId="AssetCategoryId" 
            [options]="assetcategoryidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetCategoryId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetCategoryId')"
											label="AssetCategoryId">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="AssetTypeCode">Asset Type Code 
							</label> 
							<input pInputText id="AssetTypeCode" type="text" pSize="small"	formControlName="AssetTypeCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('AssetTypeCode')"
											label="Asset Type Code">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="AssetTypeName">Asset Type Name 
							</label> 
							<input pInputText id="AssetTypeName" type="text" pSize="small"	formControlName="AssetTypeName"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('AssetTypeName')"
											label="Asset Type Name">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DefaultUsefulLifeMonths">Default UsefulLife Months 
							</label> 
							<p-inputNumber id="DefaultUsefulLifeMonths"  pSize="small"	formControlName="DefaultUsefulLifeMonths"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DefaultUsefulLifeMonths')"
											label="Default UsefulLife Months">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="DefaultResidualPercent">Default Residual Percent 
							</label> 
							<p-inputNumber id="DefaultResidualPercent"  pSize="small"	formControlName="DefaultResidualPercent"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DefaultResidualPercent')"
											label="Default Residual Percent">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="RequiresSerialNo" binary="true" formControlName="RequiresSerialNo">
											</p-checkbox>
											<label for="RequiresSerialNo">Requires SerialNo</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="RequiresRegistrationNo" binary="true" formControlName="RequiresRegistrationNo">
											</p-checkbox>
											<label for="RequiresRegistrationNo">Requires Registration No</label>
										</div>
										<div class="validation-space"></div></div><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
