<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'AssetDocumentLink List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">Asset Document Link Id <p-sortIcon field="AssetDocumentLinkId" /> </th> 
<th style="width:200px">Asset <p-sortIcon field="AssetId" /> </th> 
<th style="width:200px">Document <p-sortIcon field="DocumentId" /> </th> 
<th style="width:200px">Document Purpose <p-sortIcon field="DocumentPurposeId" /> </th> 
<th style="width:200px">Is Primary <p-sortIcon field="IsPrimary" /> </th> 
<th style="width:200px">Is Verified <p-sortIcon field="IsVerified" /> </th> 
<th style="width:200px">Verified By <p-sortIcon field="VerifiedBy" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.AssetDocumentLinkId}}</td>
 <td style="width:200px">{{obj.AssetDisplayName}}</td>
 <td style="width:200px">{{obj.DocumentDisplayName}}</td>
 <td style="width:200px">{{obj.DocumentPurposeDisplayName}}</td>
 <td style="width:200px">{{obj.IsPrimary | yesNo }}</td>
 <td style="width:200px">{{obj.IsVerified | yesNo }}</td>
 <td style="width:200px">{{obj.VerifiedByDisplayName}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
