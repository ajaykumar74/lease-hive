<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="assetDocumentLink.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Document Id" [value]="assetDocumentLink.DocumentId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Document Purpose Id" [value]="assetDocumentLink.DocumentPurposeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Is Primary" [value]="assetDocumentLink.IsPrimary">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="assetDocumentLink.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="assetDocumentLink.EffectiveTo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Is Verified" [value]="assetDocumentLink.IsVerified">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Verified By" [value]="assetDocumentLink.VerifiedBy">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
