<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Customer ProfileId" class="mb-1">CustomerProfileId</label>
        <p-dropdown
            inputId="CustomerProfileId" 
            [options]="customerprofileidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerProfileId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerProfileId')"
											label="Customer ProfileId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Party LocationId" class="mb-1">PartyLocationId</label>
        <p-dropdown
            inputId="PartyLocationId" 
            [options]="partylocationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PartyLocationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PartyLocationId')"
											label="Party LocationId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full"> <label for="CustomerDepartmentId" class="mb-1">Customer Department <span class="text-color-secondary">(optional)</span></label>
        <p-dropdown
            inputId="CustomerDepartmentId" 
            [options]="customerdepartmentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerDepartmentId"
            placeholder="Select department (optional)"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerDepartmentId')"
											label="Customer DepartmentId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="UserType" class="mb-1">Asset User Type</label>
        <p-dropdown
            inputId="UserType" 
            [options]="usertypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="UserType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('UserType')"
											label="User Type">
										</app-validation-errors>
      <small class="text-color-secondary">The person’s relationship to the asset, such as Employee, Driver, Contractor, or Custodian.</small>
      </div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
					
							<label for="EmployeeCode">Employee Code 
							</label> 
							<input pInputText id="EmployeeCode" type="text" pSize="small"	formControlName="EmployeeCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('EmployeeCode')"
											label="Employee Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="FullName" class="mb-1">Full Name</label>
							<input pInputText id="FullName" type="text" pSize="small" formControlName="FullName" />
      <app-validation-errors [type]="'text'" [control]="editForm.get('FullName')"
											label="Full Name">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Designation" class="mb-1">Designation</label>
        <p-dropdown
            inputId="Designation" 
            [options]="designationOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="Designation"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('Designation')"
											label="Designation">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Email" class="mb-1">Email</label>
							<input pInputText id="Email" type="email" pSize="small" formControlName="Email" />
      <app-validation-errors [type]="'text'" [control]="editForm.get('Email')"
											label="Email">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="MobileCountryCode">Mobile CountryCode 
							</label> 
							<p-dropdown inputId="MobileCountryCode" [options]="mobilecountrycodeOptions"
								optionLabel="Text" optionValue="Value" formControlName="MobileCountryCode"
								placeholder="Select One" class="w-full">
							</p-dropdown>
							<app-validation-errors [type]="'text'" [control]="editForm.get('MobileCountryCode')"
											label="Mobile CountryCode">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="MobileNumber">Mobile Number 
							</label> 
							<input pInputText id="MobileNumber" type="text" pSize="small"	formControlName="MobileNumber"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('MobileNumber')"
											label="Mobile Number">
										</app-validation-errors>
							 </div></div>
<div *ngIf="canViewKyc" class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">					
							<label for="DrivingLicenceNumber">Driving Licence Number 
							</label> 
							<input pInputText id="DrivingLicenceNumber" type="text" pSize="small"	formControlName="DrivingLicenceNumber" [readonly]="!canEditKyc" />
							<app-validation-errors [type]="'text'" [control]="editForm.get('DrivingLicenceNumber')"
											label="Driving Licence Number">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="DrivingLicenceExpiryDate">Driving Licence ExpiryDate 
							</label> 
							<p-calendar id="DrivingLicenceExpiryDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="DrivingLicenceExpiryDate" [disabled]="!canEditKyc" ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('DrivingLicenceExpiryDate')"
											label="Driving Licence ExpiryDate">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div *ngIf="canViewKyc" class="flex flex-col w-full">
					
							<label for="NationalIdMasked">NationalId Masked 
							</label> 
							<input pInputText id="NationalIdMasked" type="text" pSize="small"	formControlName="NationalIdMasked" [readonly]="!canEditKyc" />
							<app-validation-errors [type]="'text'" [control]="editForm.get('NationalIdMasked')"
											label="NationalId Masked">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="EmergencyContactName">Emergency Contact Name 
							</label> 
							<input pInputText id="EmergencyContactName" type="text" pSize="small"	formControlName="EmergencyContactName"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('EmergencyContactName')"
											label="Emergency Contact Name">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="EmergencyContactMobile">Emergency Contact Mobile 
							</label> 
							<input pInputText id="EmergencyContactMobile" type="text" pSize="small"	formControlName="EmergencyContactMobile"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('EmergencyContactMobile')"
											label="Emergency Contact Mobile">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>
<section *ngIf="canViewKyc" class="border-top-1 surface-border pt-4 mt-3" aria-label="KYC and driving eligibility">
  <div class="flex align-items-center justify-content-between mb-3"><div><h3 class="m-0">KYC &amp; Driving Eligibility</h3><small class="text-color-secondary">Sensitive verification data is limited to authorised users.</small></div><p-tag [value]="editForm.get('IdentityVerificationStatus')?.value || 'Pending'" [severity]="editForm.get('IdentityVerificationStatus')?.value === 'Verified' ? 'success' : editForm.get('IdentityVerificationStatus')?.value === 'Rejected' || editForm.get('IdentityVerificationStatus')?.value === 'Expired' ? 'danger' : 'warn'"></p-tag></div>
  <div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><label for="IdentityVerificationStatus">Identity verification status</label><p-dropdown inputId="IdentityVerificationStatus" [options]="kycStatusOptions" optionLabel="Text" optionValue="Value" formControlName="IdentityVerificationStatus" [disabled]="!canEditKyc" placeholder="Select status"></p-dropdown></div><div class="flex flex-col w-full"><label for="DrivingLicenceClass">Licence class</label><input pInputText id="DrivingLicenceClass" formControlName="DrivingLicenceClass" [readonly]="!canEditKyc" placeholder="e.g. LMV" /></div></div>
  <div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><label for="DrivingLicenceVerificationDate">Licence verification date</label><p-calendar inputId="DrivingLicenceVerificationDate" dateFormat="dd-mm-yy" [showIcon]="true" formControlName="DrivingLicenceVerificationDate" [disabled]="!canEditKyc"></p-calendar></div><div class="flex flex-col w-full"><label for="KycVerificationDate">Identity verification date</label><p-calendar inputId="KycVerificationDate" dateFormat="dd-mm-yy" [showIcon]="true" formControlName="KycVerificationDate" [disabled]="!canEditKyc"></p-calendar></div></div>
  <div class="flex flex-col w-full"><label for="KycRemarks">Verification remarks</label><textarea pInputTextarea id="KycRemarks" rows="3" formControlName="KycRemarks" [readonly]="!canEditKyc"></textarea></div>
  <div class="mt-4"><app-document-attachment-requirements ownerType="AssetUser" [ownerId]="assetUser?.Id || 0" [allowUpload]="canEditKyc" [allowRemove]="canEditKyc"></app-document-attachment-requirements></div>
</section>

					<app-audit-details [model]="assetUser"></app-audit-details>
					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
