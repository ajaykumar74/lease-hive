<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'AssetUser List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">AssetUserId <p-sortIcon field="AssetUserId" /> </th> 
<th style="width:200px">User Type <p-sortIcon field="UserType" /> </th> 
<th style="width:200px">Employee Code <p-sortIcon field="EmployeeCode" /> </th> 
<th style="width:200px">Full Name <p-sortIcon field="FullName" /> </th> 
<th style="width:200px">Designation <p-sortIcon field="Designation" /> </th> 
<th style="width:200px">Email <p-sortIcon field="Email" /> </th> 
<th style="width:200px">Mobile Number <p-sortIcon field="MobileNumber" /> </th> 
<th style="width:200px">Record Status <p-sortIcon field="RecordStatus" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.AssetUserId}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.UserType}}</td>
 <td style="width:200px">{{obj.EmployeeCode}}</td>
 <td style="width:200px">{{obj.FullName}}</td>
 <td style="width:200px">{{obj.Designation | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.Email}}</td>
 <td style="width:200px">{{obj.MobileNumber}}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
