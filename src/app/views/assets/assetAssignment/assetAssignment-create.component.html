<div class="container">
    <div class="grid">
        <div class="col-12 md:col-12">
            <div class="card p-fluid">
                <app-message [AlertType]="'message'"></app-message>
                <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
                    [Caption]="Caption" [PageType]="'Details'" [form]="editForm"> </app-toolbar-buttons>
                <app-spinner></app-spinner>

                <form [formGroup]="editForm" (ngSubmit)="Save()">
                    <p-fluid>
                        <div class="flex mt-8">
                            <div class="card flex flex-col gap-4 w-full">
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="AssetId" class="mb-1">Asset</label>
                                        @if (assetId) {
                                        <div class="p-3 border-1 surface-border border-round">
                                            <div class="font-semibold"> <span>{{ asset?.AssetNo || 'Asset #' + assetId }}</span> | <span>Serial: {{ asset.PrimarySerialNo }}</span></div>
                                       </div>
                                        } @else {
                                        <p-dropdown inputId="AssetId" [options]="assetidOptions" optionLabel="Text"
                                            optionValue="Value" formControlName="AssetId" placeholder="Select One"
                                            class="w-full"> </p-dropdown>
                                        }
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
                                            label="AssetId"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="PartyId" class="mb-1">PartyId</label>
                                        <p-dropdown inputId="PartyId" [options]="partyidOptions" optionLabel="Text"
                                            optionValue="Value" formControlName="PartyId" placeholder="Select One"
                                            class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')"
                                            label="PartyId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="PartyLocationId" class="mb-1">PartyLocationId</label>
                                        <p-dropdown inputId="PartyLocationId" [options]="partylocationidOptions"
                                            optionLabel="Text" optionValue="Value" formControlName="PartyLocationId"
                                            placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'"
                                            [control]="editForm.get('PartyLocationId')" label="PartyLocationId">
                                        </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="CustomerDepartmentId" class="mb-1">CustomerDepartmentId</label>
                                        <p-dropdown inputId="CustomerDepartmentId"
                                            [options]="customerdepartmentidOptions" optionLabel="Text"
                                            optionValue="Value" formControlName="CustomerDepartmentId"
                                            placeholder="Select One" class="w-full">
                                        </p-dropdown>
                                        <app-validation-errors [type]="'text'"
                                            [control]="editForm.get('CustomerDepartmentId')"
                                            label="CustomerDepartmentId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="AssetUserId" class="mb-1">AssetUserId</label>
                                        <p-dropdown inputId="AssetUserId" [options]="assetuseridOptions"
                                            optionLabel="Text" optionValue="Value" formControlName="AssetUserId"
                                            placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('AssetUserId')"
                                            label="AssetUserId"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="AssignmentType" class="mb-1">AssignmentType</label>
                                        <p-dropdown inputId="AssignmentType" [options]="assignmenttypeOptions"
                                            optionLabel="Text" optionValue="Value" formControlName="AssignmentType"
                                            placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'"
                                            [control]="editForm.get('AssignmentType')" label="AssignmentType">
                                        </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="AssignedFrom">AssignedFrom </label>
                                        <p-calendar id="AssignedFrom" size="small" dateFormat="dd-MM-yy"
                                            [showIcon]="true" formControlName="AssignedFrom"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('AssignedFrom')"
                                            label="AssignedFrom"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="AssignedTo">AssignedTo </label>
                                        <p-calendar id="AssignedTo" size="small" dateFormat="dd-MM-yy" [showIcon]="true"
                                            formControlName="AssignedTo"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('AssignedTo')"
                                            label="AssignedTo"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label class="pt-8"></label>
                                        <div class="flex items-center gap-2">
                                            <p-checkbox inputId="IsPrimary" binary="true" formControlName="IsPrimary">
                                            </p-checkbox>
                                            <label for="IsPrimary">IsPrimary</label>
                                        </div>
                                        <div class="validation-space"></div>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="AssignmentStatusId">AssignmentStatusId </label>
                                        <p-inputNumber id="AssignmentStatusId" pSize="small"
                                            formControlName="AssignmentStatusId"> </p-inputNumber>
                                        <app-validation-errors [type]="'number'"
                                            [control]="editForm.get('AssignmentStatusId')" label="AssignmentStatusId">
                                        </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="ReferenceType" class="mb-1">ReferenceType</label>
                                        <p-dropdown inputId="ReferenceType" [options]="referencetypeOptions"
                                            optionLabel="Text" optionValue="Value" formControlName="ReferenceType"
                                            placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceType')"
                                            label="ReferenceType"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="ReferenceId">ReferenceId </label>
                                        <input pInputText id="ReferenceId" type="text" pSize="small"
                                            formControlName="ReferenceId" />
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceId')"
                                            label="ReferenceId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="EffectiveFrom">Effective From </label>
                                        <p-calendar id="EffectiveFrom" size="small" dateFormat="dd-MM-yy"
                                            [showIcon]="true" formControlName="EffectiveFrom"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
                                            label="Effective From"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="EffectiveTo">Effective To </label>
                                        <p-calendar id="EffectiveTo" size="small" dateFormat="dd-MM-yy"
                                            [showIcon]="true" formControlName="EffectiveTo"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
                                            label="Effective To"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-wrap">
                                    <div class="flex flex-col w-full">
                                        <label for="Record Status" class="mb-1">RecordStatus</label>
                                        <p-dropdown inputId="RecordStatus" [options]="recordstatusOptions"
                                            optionLabel="Text" optionValue="Value" formControlName="RecordStatus"
                                            placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
                                            label="Record Status"> </app-validation-errors>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </p-fluid>
                </form>
            </div>
        </div>
    </div>
</div>
