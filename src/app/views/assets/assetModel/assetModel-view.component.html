<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="AssetMakeId" [value]="assetModel.AssetMakeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="AssetTypeId" [value]="assetModel.AssetTypeId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ModelCode" [value]="assetModel.ModelCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="ModelName" [value]="assetModel.ModelName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="VariantName" [value]="assetModel.VariantName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="ModelYearFrom" [value]="assetModel.ModelYearFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ModelYearTo" [value]="assetModel.ModelYearTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="assetModel.EffectiveFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="assetModel.EffectiveTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="assetModel.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
