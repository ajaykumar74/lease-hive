<div class="container">
    <div class="grid">
        <div class="col-12 md:col-12">
            <div class="card p-fluid">
                <app-message [AlertType]="'message'"></app-message>
                <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'Details'" [form]="editForm"> </app-toolbar-buttons>
                <app-spinner></app-spinner>

                <form [formGroup]="editForm" (ngSubmit)="Save()">
                    <p-fluid>
                        <div class="flex mt-8">
                            <div class="card flex flex-col gap-4 w-full">
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="Asset Category Id" class="mb-1">AssetCategoryId</label>
                                        <p-dropdown inputId="AssetCategoryId" [options]="assetcategoryidOptions" optionLabel="Text" optionValue="Value" formControlName="AssetCategoryId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('AssetCategoryId')" label="Asset Category Id"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="ComplianceCode">Compliance Code </label>
                                        <input pInputText id="ComplianceCode" type="text" pSize="small" formControlName="ComplianceCode" />
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('ComplianceCode')" label="Compliance Code"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="ComplianceName">Compliance Name </label>
                                        <input pInputText id="ComplianceName" type="text" pSize="small" formControlName="ComplianceName" />
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('ComplianceName')" label="Compliance Name"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label class="pt-8"></label>
                                        <div class="flex items-center gap-2">
                                            <p-checkbox inputId="RequiresExpiry" binary="true" formControlName="RequiresExpiry"> </p-checkbox>
                                            <label for="RequiresExpiry">Requires Expiry</label>
                                        </div>
                                        <div class="validation-space"></div>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label class="pt-8"></label>
                                        <div class="flex items-center gap-2">
                                            <p-checkbox inputId="RequiresDocument" binary="true" formControlName="RequiresDocument"> </p-checkbox>
                                            <label for="RequiresDocument">Requires Document</label>
                                        </div>
                                        <div class="validation-space"></div>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="ReminderDaysBefore">Reminder Days Before </label>
                                        <p-inputNumber id="ReminderDaysBefore" pSize="small" formControlName="ReminderDaysBefore"> </p-inputNumber>
                                        <app-validation-errors [type]="'number'" [control]="editForm.get('ReminderDaysBefore')" label="Reminder Days Before"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="EffectiveFrom">Effective From </label>
                                        <p-calendar id="EffectiveFrom" size="small" dateFormat="dd-MM-yy" [showIcon]="true" formControlName="EffectiveFrom"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')" label="Effective From"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="EffectiveTo">Effective To </label>
                                        <p-calendar id="EffectiveTo" size="small" dateFormat="dd-MM-yy" [showIcon]="true" formControlName="EffectiveTo"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')" label="Effective To"> </app-validation-errors>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </p-fluid>
                </form>
            </div>
        </div>
    </div>
</div>
