<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Category Id" [value]="assetComplianceType.AssetCategoryId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Compliance Code" [value]="assetComplianceType.ComplianceCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Compliance Name" [value]="assetComplianceType.ComplianceName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requires Expiry" [value]="assetComplianceType.RequiresExpiry">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requires Document" [value]="assetComplianceType.RequiresDocument">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reminder Days Before" [value]="assetComplianceType.ReminderDaysBefore">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="assetComplianceType.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="assetComplianceType.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
