<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Supplier Party Id" class="mb-1">SupplierPartyId</label>
        <p-dropdown
            inputId="SupplierPartyId" 
            [options]="supplierpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupplierPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupplierPartyId')"
											label="Supplier Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Supplier Party Location Id" class="mb-1">SupplierPartyLocationId</label>
        <p-dropdown
            inputId="SupplierPartyLocationId" 
            [options]="supplierpartylocationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SupplierPartyLocationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SupplierPartyLocationId')"
											label="Supplier Party Location Id">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="PurchaseOrderReference">Purchase Order Reference 
							</label> 
							<input pInputText id="PurchaseOrderReference" type="text" pSize="small"	formControlName="PurchaseOrderReference"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('PurchaseOrderReference')"
											label="Purchase Order Reference">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="GoodsReceiptReference">Goods Receipt Reference 
							</label> 
							<input pInputText id="GoodsReceiptReference" type="text" pSize="small"	formControlName="GoodsReceiptReference"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('GoodsReceiptReference')"
											label="Goods Receipt Reference">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="SupplierInvoiceReference">Supplier Invoice Reference 
							</label> 
							<input pInputText id="SupplierInvoiceReference" type="text" pSize="small"	formControlName="SupplierInvoiceReference"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('SupplierInvoiceReference')"
											label="Supplier Invoice Reference">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="AcquisitionDate">Acquisition Date 
							</label> 
							<p-calendar id="AcquisitionDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="AcquisitionDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('AcquisitionDate')"
											label="Acquisition Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="BasicAmount">Basic Amount 
							</label> 
							<p-inputNumber id="BasicAmount"  pSize="small"	formControlName="BasicAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('BasicAmount')"
											label="Basic Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="OtherCapitalizableCost">Other Capitalizable Cost 
							</label> 
							<p-inputNumber id="OtherCapitalizableCost"  pSize="small"	formControlName="OtherCapitalizableCost"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('OtherCapitalizableCost')"
											label="Other Capitalizable Cost">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TotalAcquisitionCost">Total Acquisition Cost 
							</label> 
							<p-inputNumber id="TotalAcquisitionCost"  pSize="small"	formControlName="TotalAcquisitionCost"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TotalAcquisitionCost')"
											label="Total Acquisition Cost">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="CapitalizationDate">Capitalization Date 
							</label> 
							<p-calendar id="CapitalizationDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="CapitalizationDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('CapitalizationDate')"
											label="Capitalization Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ProcurementSourceId">Procurement Source Id 
							</label> 
							<p-inputNumber id="ProcurementSourceId"  pSize="small"	formControlName="ProcurementSourceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ProcurementSourceId')"
											label="Procurement Source Id">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
