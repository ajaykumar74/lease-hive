<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'PropertyAsset List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">PropertyType <p-sortIcon field="PropertyType" /> </th> 
<th style="width:200px">SurveyNo <p-sortIcon field="SurveyNo" /> </th> 
<th style="width:200px">BuiltUpArea <p-sortIcon field="BuiltUpArea" /> </th> 
<th style="width:200px">AreaUOMId <p-sortIcon field="AreaUOMId" /> </th> 
<th style="width:200px">FloorNo <p-sortIcon field="FloorNo" /> </th> 
<th style="width:200px">PossessionDate <p-sortIcon field="PossessionDate" /> </th> 
<th style="width:200px">TitleReference <p-sortIcon field="TitleReference" /> </th> 
<th style="width:200px">Record Status <p-sortIcon field="RecordStatus" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.PropertyType}}</td>
 <td style="width:200px">{{obj.SurveyNo}}</td>
 <td style="width:200px">{{obj.AreaUOMId | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.FloorNo}}</td>
 <td style="width:200px">{{obj.PossessionDate | date:'dd-MMM-yyyy' }}</td>
 <td style="width:200px">{{obj.TitleReference}}</td>
 <td style="width:200px">{{obj.RecordStatus}}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
