<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="AssetAttributeDefinitionId" class="mb-1">AssetAttributeDefinitionId</label>
        <p-dropdown
            inputId="AssetAttributeDefinitionId" 
            [options]="assetattributedefinitionidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetAttributeDefinitionId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetAttributeDefinitionId')"
											label="AssetAttributeDefinitionId">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="OptionCode">OptionCode 
							</label> 
							<input pInputText id="OptionCode" type="text" pSize="small"	formControlName="OptionCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('OptionCode')"
											label="OptionCode">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="OptionLabel">OptionLabel 
							</label> 
							<input pInputText id="OptionLabel" type="text" pSize="small"	formControlName="OptionLabel"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('OptionLabel')"
											label="OptionLabel">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="SortOrder">SortOrder 
							</label> 
							<p-inputNumber id="SortOrder"  pSize="small"	formControlName="SortOrder"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('SortOrder')"
											label="SortOrder">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
