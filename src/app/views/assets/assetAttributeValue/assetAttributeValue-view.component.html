<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="AssetId" [value]="assetAttributeValue.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Attribute DefinitionId" [value]="assetAttributeValue.AssetAttributeDefinitionId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="String Value" [value]="assetAttributeValue.StringValue">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Number Value" [value]="assetAttributeValue.NumberValue">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="DateValue" [value]="assetAttributeValue.DateValue">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="BooleanValue" [value]="assetAttributeValue.BooleanValue">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="assetAttributeValue.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="assetAttributeValue.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
