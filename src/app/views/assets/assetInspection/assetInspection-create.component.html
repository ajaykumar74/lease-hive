<div class="container">
    <div class="grid">
        <div class="col-12 md:col-12">
            <div class="card p-fluid">
                <app-message [AlertType]="'message'"></app-message>
                <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'Details'" [form]="editForm"> </app-toolbar-buttons>
                <app-spinner></app-spinner>

                <form [formGroup]="editForm" (ngSubmit)="Save()">
                    <p-fluid>
                        <div class="flex mt-8">
                            <div class="card flex flex-col gap-4 w-full">
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="AssetId" class="mb-1">Asset</label>
                                        @if (assetId) {
                                            <div class="p-3 border-1 surface-border border-round">
                                                <div class="font-semibold"><span>{{ asset?.AssetNo || 'Asset #' + assetId }}</span> | <span>Serial: {{ asset?.PrimarySerialNo }}</span></div>
                                            </div>
                                        } @else {
                                            <p-dropdown inputId="AssetId" [options]="assetidOptions" optionLabel="Text" optionValue="Value" formControlName="AssetId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        }
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')" label="AssetId"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="InspectionTypeId">Inspection TypeId </label>
                                        <input pInputText id="InspectionTypeId" type="text" pSize="small" formControlName="InspectionTypeId" />
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('InspectionTypeId')" label="Inspection TypeId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="InspectionNo">InspectionNo </label>
                                        <input pInputText id="InspectionNo" type="text" pSize="small" formControlName="InspectionNo" />
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('InspectionNo')" label="InspectionNo"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="InspectionDateTime">InspectionDateTime </label>
                                        <p-calendar id="InspectionDateTime" size="small" dateFormat="dd-MM-yy" [showIcon]="true" formControlName="InspectionDateTime"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('InspectionDateTime')" label="InspectionDateTime"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="LocationId" class="mb-1">LocationId</label>
                                        <p-dropdown inputId="LocationId" [options]="locationidOptions" optionLabel="Text" optionValue="Value" formControlName="LocationId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('LocationId')" label="LocationId"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="PartyId" class="mb-1">PartyId</label>
                                        <p-dropdown inputId="PartyId" [options]="partyidOptions" optionLabel="Text" optionValue="Value" formControlName="PartyId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('PartyId')" label="PartyId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="InspectorUserId" class="mb-1">InspectorUserId</label>
                                        <p-dropdown inputId="InspectorUserId" [options]="inspectoruseridOptions" optionLabel="Text" optionValue="Value" formControlName="InspectorUserId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('InspectorUserId')" label="InspectorUserId"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="ConditionGradeId" class="mb-1">ConditionGradeId</label>
                                        <p-dropdown inputId="ConditionGradeId" [options]="conditiongradeidOptions" optionLabel="Text" optionValue="Value" formControlName="ConditionGradeId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('ConditionGradeId')" label="ConditionGradeId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="OverallScore">OverallScore </label>
                                        <p-inputNumber id="OverallScore" pSize="small" formControlName="OverallScore"> </p-inputNumber>
                                        <app-validation-errors [type]="'number'" [control]="editForm.get('OverallScore')" label="OverallScore"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="InspectionStatusId" class="mb-1">InspectionStatusId</label>
                                        <p-dropdown inputId="InspectionStatusId" [options]="inspectionstatusidOptions" optionLabel="Text" optionValue="Value" formControlName="InspectionStatusId" placeholder="Select One" class="w-full"> </p-dropdown>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('InspectionStatusId')" label="InspectionStatusId"> </app-validation-errors>
                                    </div>
                                </div>
                                <div class="flex flex-col md:flex-row gap-4">
                                    <div class="flex flex-col w-full">
                                        <label for="address">Remarks</label>
                                        <textarea
                                            size="small"
                                            pTextarea
                                            placeholder="Type Remarks"
                                            [autoResize]="true"
                                            rows="3"
                                            class="w-full"
                                            cols="30"
                                            formControlName="Remarks"
                                            [ngClass]="{ 'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"
                                        ></textarea>
                                        <app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')" label="Remarks"> </app-validation-errors>
                                    </div>
                                    <div class="flex flex-col w-full">
                                        <label for="CompletedOn">CompletedOn </label>
                                        <p-calendar id="CompletedOn" size="small" dateFormat="dd-MM-yy" [showIcon]="true" formControlName="CompletedOn"></p-calendar>
                                        <app-validation-errors [type]="'date'" [control]="editForm.get('CompletedOn')" label="CompletedOn"> </app-validation-errors>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </p-fluid>
                </form>
            </div>
        </div>
    </div>
</div>
