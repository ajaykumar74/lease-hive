<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="CategoryCode" [value]="assetCategory.CategoryCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="CategoryName" [value]="assetCategory.CategoryName">
								</app-view-field></div></div>
<section class="border-top-1 surface-border pt-4 mt-3" aria-label="Vehicle driver compliance configuration"><h3 class="mt-0">Vehicle driver compliance</h3><div class="flex flex-col md:flex-row gap-4"><app-view-field label="Require designated-driver KYC" [value]="assetCategory.RequiresDriverKyc"></app-view-field><app-view-field label="Required licence class" [value]="assetCategory.RequiredDrivingLicenceClass || 'Not required'"></app-view-field></div><div class="flex flex-col md:flex-row gap-4"><app-view-field label="Identity proof required" [value]="assetCategory.RequiresIdentityProof"></app-view-field><app-view-field label="Driving licence required" [value]="assetCategory.RequiresDrivingLicence"></app-view-field><app-view-field label="Employer authorisation required" [value]="assetCategory.RequiresEmployerAuthorization"></app-view-field></div></section>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full"><app-view-field label="SupportsRegistration" [value]="assetCategory.SupportsRegistration">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="SupportsMeasure" [value]="assetCategory.SupportsMeasure">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="ExtensionTypeCode" [value]="assetCategory.ExtensionTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="EffectiveFrom" [value]="assetCategory.EffectiveFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="EffectiveTo" [value]="assetCategory.EffectiveTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="RecordStatus" [value]="assetCategory.RecordStatus">
								</app-view-field></div></div>

						<app-audit-details [model]="assetCategory"></app-audit-details>
						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
