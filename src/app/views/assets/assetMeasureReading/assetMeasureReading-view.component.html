<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="assetMeasureReading.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Measure Definition Id" [value]="assetMeasureReading.AssetMeasureDefinitionId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reading Value" [value]="assetMeasureReading.ReadingValue">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reading Date Time" [value]="assetMeasureReading.ReadingDateTime">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reading Source Id" [value]="assetMeasureReading.ReadingSourceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Source Reference" [value]="assetMeasureReading.SourceReference">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Is Verified" [value]="assetMeasureReading.IsVerified">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Recorded By" [value]="assetMeasureReading.RecordedBy">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
