<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset CategoryId" [value]="assetMeasureReading.AssetCategoryId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset TypeId" [value]="assetMeasureReading.AssetTypeId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Measure Code" [value]="assetMeasureReading.MeasureCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Measure Name" [value]="assetMeasureReading.MeasureName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Unit Of MeasureId" [value]="assetMeasureReading.UnitOfMeasureId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Is Cumulative" [value]="assetMeasureReading.IsCumulative">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Is Required" [value]="assetMeasureReading.IsRequired">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="assetMeasureReading.EffectiveFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="assetMeasureReading.EffectiveTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="assetMeasureReading.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
