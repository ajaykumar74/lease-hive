<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="userPartyAccess.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Application UserId" [value]="userPartyAccess.ApplicationUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Party Role Type" [value]="userPartyAccess.PartyRoleType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Access Level" [value]="userPartyAccess.AccessLevel">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Party LocationId" [value]="userPartyAccess.PartyLocationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Customer DepartmentId" [value]="userPartyAccess.CustomerDepartmentId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="userPartyAccess.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="userPartyAccess.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
