<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="PartyId" [value]="partyDocument.PartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Document Type" [value]="partyDocument.DocumentType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Document Number" [value]="partyDocument.DocumentNumber">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="File DocumentId" [value]="partyDocument.FileDocumentId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Issued By" [value]="partyDocument.IssuedBy">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Issue Date" [value]="partyDocument.IssueDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Expiry Date" [value]="partyDocument.ExpiryDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Verification Status" [value]="partyDocument.VerificationStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Verified By" [value]="partyDocument.VerifiedBy">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Verified At" [value]="partyDocument.VerifiedAt">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Rejection Reason" [value]="partyDocument.RejectionReason">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="partyDocument.RecordStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="partyDocument.EffectiveFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="partyDocument.EffectiveTo">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
