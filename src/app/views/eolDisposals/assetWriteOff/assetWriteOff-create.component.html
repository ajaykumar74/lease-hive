 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Disposal Case Id" class="mb-1">DisposalCaseId</label>
        <p-dropdown
            inputId="DisposalCaseId" 
            [options]="disposalcaseidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DisposalCaseId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DisposalCaseId')"
											label="Disposal Case Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="WriteOffDate">Write Off Date 
							</label> 
							<p-calendar id="WriteOffDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="WriteOffDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('WriteOffDate')"
											label="Write Off Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Write Off Reason Code" class="mb-1">WriteOffReasonCode</label>
        <p-dropdown
            inputId="WriteOffReasonCode" 
            [options]="writeoffreasoncodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="WriteOffReasonCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('WriteOffReasonCode')"
											label="Write Off Reason Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ReferenceBookValue">Reference Book Value 
							</label> 
							<p-inputNumber id="ReferenceBookValue"  pSize="small"	formControlName="ReferenceBookValue"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceBookValue')"
											label="Reference Book Value">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="RecoveryAmount">Recovery Amount 
							</label> 
							<p-inputNumber id="RecoveryAmount"  pSize="small"	formControlName="RecoveryAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RecoveryAmount')"
											label="Recovery Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Insurance Claim Id" class="mb-1">InsuranceClaimId</label>
        <p-dropdown
            inputId="InsuranceClaimId" 
            [options]="insuranceclaimidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsuranceClaimId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsuranceClaimId')"
											label="Insurance Claim Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Approved By User Id" class="mb-1">ApprovedByUserId</label>
        <p-dropdown
            inputId="ApprovedByUserId" 
            [options]="approvedbyuseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ApprovedByUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ApprovedByUserId')"
											label="Approved By User Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="ApprovedAt">Approved At 
							</label> 
							<p-calendar id="ApprovedAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ApprovedAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ApprovedAt')"
											label="Approved At">
										</app-validation-errors>
						 </div></div>


					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
