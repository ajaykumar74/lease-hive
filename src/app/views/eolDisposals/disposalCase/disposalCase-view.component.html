<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Disposition Decision Id" [value]="disposalCase.AssetDispositionDecisionId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="disposalCase.AssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Organisation Id" [value]="disposalCase.OrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Disposition Method Id" [value]="disposalCase.DispositionMethodId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Opened At" [value]="disposalCase.OpenedAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Target Completion Date" [value]="disposalCase.TargetCompletionDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Assigned To User Id" [value]="disposalCase.AssignedToUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="disposalCase.StatusCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Closed At" [value]="disposalCase.ClosedAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="disposalCase.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
