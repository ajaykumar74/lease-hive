<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Return Id" class="mb-1">AssetReturnId</label>
        <p-dropdown
            inputId="AssetReturnId" 
            [options]="assetreturnidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetReturnId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetReturnId')"
											label="Asset Return Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ItemCode">Item Code 
							</label> 
							<input pInputText id="ItemCode" type="text" pSize="small"	formControlName="ItemCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ItemCode')"
											label="Item Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Item Description</label>
                    <textarea size="small" pTextarea placeholder="Type Item Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="ItemDescription"
										[ngClass]="{'is-invalid': (editForm.get('ItemDescription').touched || editForm.get('ItemDescription').dirty) && !editForm.get('ItemDescription').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('ItemDescription')"
											label="Item Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ExpectedQuantity">Expected Quantity 
							</label> 
							<p-inputNumber id="ExpectedQuantity"  pSize="small"	formControlName="ExpectedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ExpectedQuantity')"
											label="Expected Quantity">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ReturnedQuantity">Returned Quantity 
							</label> 
							<p-inputNumber id="ReturnedQuantity"  pSize="small"	formControlName="ReturnedQuantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReturnedQuantity')"
											label="Returned Quantity">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Condition Code" class="mb-1">ConditionCode</label>
        <p-dropdown
            inputId="ConditionCode" 
            [options]="conditioncodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ConditionCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ConditionCode')"
											label="Condition Code">
										</app-validation-errors></div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="ChargeableFlag" binary="true" formControlName="ChargeableFlag">
											</p-checkbox>
											<label for="ChargeableFlag">Chargeable Flag</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
