<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Return Id" [value]="returnItemChecklist.AssetReturnId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="returnItemChecklist.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Item Code" [value]="returnItemChecklist.ItemCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Item Description" [value]="returnItemChecklist.ItemDescription">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Expected Quantity" [value]="returnItemChecklist.ExpectedQuantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Returned Quantity" [value]="returnItemChecklist.ReturnedQuantity">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Condition Code" [value]="returnItemChecklist.ConditionCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Chargeable Flag" [value]="returnItemChecklist.ChargeableFlag">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
