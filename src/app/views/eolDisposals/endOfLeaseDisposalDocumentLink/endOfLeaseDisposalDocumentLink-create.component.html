 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Reference Type Code" class="mb-1">ReferenceTypeCode</label>
        <p-dropdown
            inputId="ReferenceTypeCode" 
            [options]="referencetypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReferenceTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceTypeCode')"
											label="Reference Type Code">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="ReferenceId">Reference Id 
							</label> 
							<p-inputNumber id="ReferenceId"  pSize="small"	formControlName="ReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceId')"
											label="Reference Id">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Document Id" class="mb-1">DocumentId</label>
        <p-dropdown
            inputId="DocumentId" 
            [options]="documentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentId')"
											label="Document Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Document Role Code" class="mb-1">DocumentRoleCode</label>
        <p-dropdown
            inputId="DocumentRoleCode" 
            [options]="documentrolecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentRoleCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentRoleCode')"
											label="Document Role Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="LinkedAt">Linked At 
							</label> 
							<p-calendar id="LinkedAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="LinkedAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('LinkedAt')"
											label="Linked At">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Linked By User Id" class="mb-1">LinkedByUserId</label>
        <p-dropdown
            inputId="LinkedByUserId" 
            [options]="linkedbyuseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LinkedByUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LinkedByUserId')"
											label="Linked By User Id">
										</app-validation-errors></div></div>


					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
