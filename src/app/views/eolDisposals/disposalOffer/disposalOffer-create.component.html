 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Disposal Case Id" class="mb-1">DisposalCaseId</label>
        <p-dropdown
            inputId="DisposalCaseId" 
            [options]="disposalcaseidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DisposalCaseId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DisposalCaseId')"
											label="Disposal Case Id">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="OfferNo">Offer No 
							</label> 
							<input pInputText id="OfferNo" type="text" pSize="small"	formControlName="OfferNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('OfferNo')"
											label="Offer No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Buyer Party Id" class="mb-1">BuyerPartyId</label>
        <p-dropdown
            inputId="BuyerPartyId" 
            [options]="buyerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="BuyerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('BuyerPartyId')"
											label="Buyer Party Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="OfferDate">Offer Date 
							</label> 
							<p-calendar id="OfferDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="OfferDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('OfferDate')"
											label="Offer Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="OfferAmount">Offer Amount 
							</label> 
							<p-inputNumber id="OfferAmount"  pSize="small"	formControlName="OfferAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('OfferAmount')"
											label="Offer Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ValidUntil">Valid Until 
							</label> 
							<p-calendar id="ValidUntil"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ValidUntil"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ValidUntil')"
											label="Valid Until">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
