 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="End Of Lease Case Id" class="mb-1">EndOfLeaseCaseId</label>
        <p-dropdown
            inputId="EndOfLeaseCaseId" 
            [options]="endofleasecaseidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="EndOfLeaseCaseId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('EndOfLeaseCaseId')"
											label="End Of Lease Case Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Option Code" class="mb-1">OptionCode</label>
        <p-dropdown
            inputId="OptionCode" 
            [options]="optioncodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OptionCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OptionCode')"
											label="Option Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="OfferedDate">Offered Date 
							</label> 
							<p-calendar id="OfferedDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="OfferedDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('OfferedDate')"
											label="Offered Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="OptionExpiryDate">Option Expiry Date 
							</label> 
							<p-calendar id="OptionExpiryDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="OptionExpiryDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('OptionExpiryDate')"
											label="Option Expiry Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ReferenceAmount">Reference Amount 
							</label> 
							<p-inputNumber id="ReferenceAmount"  pSize="small"	formControlName="ReferenceAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceAmount')"
											label="Reference Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="SelectedFlag" binary="true" formControlName="SelectedFlag">
											</p-checkbox>
											<label for="SelectedFlag">Selected Flag</label>
										</div>
										<div class="validation-space"></div></div><div class="flex flex-col w-full">			
							<label for="SelectedAt">Selected At 
							</label> 
							<p-calendar id="SelectedAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="SelectedAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('SelectedAt')"
											label="Selected At">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
