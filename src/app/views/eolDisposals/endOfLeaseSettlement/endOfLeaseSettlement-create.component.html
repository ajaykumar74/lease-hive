 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="End Of Lease Case Id" class="mb-1">EndOfLeaseCaseId</label>
        <p-dropdown
            inputId="EndOfLeaseCaseId" 
            [options]="endofleasecaseidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="EndOfLeaseCaseId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('EndOfLeaseCaseId')"
											label="End Of Lease Case Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Customer Party Id" class="mb-1">CustomerPartyId</label>
        <p-dropdown
            inputId="CustomerPartyId" 
            [options]="customerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerPartyId')"
											label="Customer Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="SettlementDate">Settlement Date 
							</label> 
							<p-calendar id="SettlementDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="SettlementDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('SettlementDate')"
											label="Settlement Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="GrossChargeAmount">Gross Charge Amount 
							</label> 
							<p-inputNumber id="GrossChargeAmount"  pSize="small"	formControlName="GrossChargeAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('GrossChargeAmount')"
											label="Gross Charge Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="GrossCreditAmount">Gross Credit Amount 
							</label> 
							<p-inputNumber id="GrossCreditAmount"  pSize="small"	formControlName="GrossCreditAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('GrossCreditAmount')"
											label="Gross Credit Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="NetSettlementAmount">Net Settlement Amount 
							</label> 
							<p-inputNumber id="NetSettlementAmount"  pSize="small"	formControlName="NetSettlementAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('NetSettlementAmount')"
											label="Net Settlement Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Approved By User Id" class="mb-1">ApprovedByUserId</label>
        <p-dropdown
            inputId="ApprovedByUserId" 
            [options]="approvedbyuseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ApprovedByUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ApprovedByUserId')"
											label="Approved By User Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="ApprovedAt">Approved At 
							</label> 
							<p-calendar id="ApprovedAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ApprovedAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ApprovedAt')"
											label="Approved At">
										</app-validation-errors>
						 </div></div>


					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
