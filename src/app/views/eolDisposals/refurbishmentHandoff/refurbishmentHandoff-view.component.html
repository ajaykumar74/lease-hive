<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="End Of Lease Case Id" [value]="refurbishmentHandoff.EndOfLeaseCaseId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="refurbishmentHandoff.AssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Handoff Reason Code" [value]="refurbishmentHandoff.HandoffReasonCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requested At" [value]="refurbishmentHandoff.RequestedAt">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requested By User Id" [value]="refurbishmentHandoff.RequestedByUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Budget Amount" [value]="refurbishmentHandoff.BudgetAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="refurbishmentHandoff.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Maintenance Work Order Id" [value]="refurbishmentHandoff.MaintenanceWorkOrderId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="refurbishmentHandoff.StatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="refurbishmentHandoff.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
