<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Disposal Case Id" [value]="supplierReturn.DisposalCaseId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="supplierReturn.AssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Supplier Party Id" [value]="supplierReturn.SupplierPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Return Date" [value]="supplierReturn.ReturnDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Return Reference" [value]="supplierReturn.ReturnReference">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Credit Expected Amount" [value]="supplierReturn.CreditExpectedAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="supplierReturn.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="supplierReturn.StatusCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="supplierReturn.Remarks">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="supplierReturn.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
