<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Disposal Case Id" class="mb-1">DisposalCaseId</label>
        <p-dropdown
            inputId="DisposalCaseId" 
            [options]="disposalcaseidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DisposalCaseId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DisposalCaseId')"
											label="Disposal Case Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Asset Valuation Id" class="mb-1">AssetValuationId</label>
        <p-dropdown
            inputId="AssetValuationId" 
            [options]="assetvaluationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetValuationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetValuationId')"
											label="Asset Valuation Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ReferenceDate">Reference Date 
							</label> 
							<p-calendar id="ReferenceDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ReferenceDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ReferenceDate')"
											label="Reference Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="MarketValueAmount">Market Value Amount 
							</label> 
							<p-inputNumber id="MarketValueAmount"  pSize="small"	formControlName="MarketValueAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('MarketValueAmount')"
											label="Market Value Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ReserveAmount">Reserve Amount 
							</label> 
							<p-inputNumber id="ReserveAmount"  pSize="small"	formControlName="ReserveAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReserveAmount')"
											label="Reserve Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TargetAmount">Target Amount 
							</label> 
							<p-inputNumber id="TargetAmount"  pSize="small"	formControlName="TargetAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TargetAmount')"
											label="Target Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
