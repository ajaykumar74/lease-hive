<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Disposal Case Id" [value]="disposalValuationReference.DisposalCaseId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Valuation Id" [value]="disposalValuationReference.AssetValuationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reference Date" [value]="disposalValuationReference.ReferenceDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Market Value Amount" [value]="disposalValuationReference.MarketValueAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reserve Amount" [value]="disposalValuationReference.ReserveAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Target Amount" [value]="disposalValuationReference.TargetAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="disposalValuationReference.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="disposalValuationReference.Remarks">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
