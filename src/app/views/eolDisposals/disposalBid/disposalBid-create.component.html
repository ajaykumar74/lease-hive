 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Disposal Auction Id" class="mb-1">DisposalAuctionId</label>
        <p-dropdown
            inputId="DisposalAuctionId" 
            [options]="disposalauctionidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DisposalAuctionId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DisposalAuctionId')"
											label="Disposal Auction Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Bidder Party Id" class="mb-1">BidderPartyId</label>
        <p-dropdown
            inputId="BidderPartyId" 
            [options]="bidderpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="BidderPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('BidderPartyId')"
											label="Bidder Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="BidAt">Bid At 
							</label> 
							<p-calendar id="BidAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="BidAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('BidAt')"
											label="Bid At">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="BidAmount">Bid Amount 
							</label> 
							<p-inputNumber id="BidAmount"  pSize="small"	formControlName="BidAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('BidAmount')"
											label="Bid Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="QualifiedFlag" binary="true" formControlName="QualifiedFlag">
											</p-checkbox>
											<label for="QualifiedFlag">Qualified Flag</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Bid Status Code" class="mb-1">BidStatusCode</label>
        <p-dropdown
            inputId="BidStatusCode" 
            [options]="bidstatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="BidStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('BidStatusCode')"
											label="Bid Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
