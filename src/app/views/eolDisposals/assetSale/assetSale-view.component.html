<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Disposal Case Id" [value]="assetSale.DisposalCaseId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="assetSale.AssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Buyer Party Id" [value]="assetSale.BuyerPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Disposal Award Id" [value]="assetSale.DisposalAwardId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Sale Date" [value]="assetSale.SaleDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Sale Amount" [value]="assetSale.SaleAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="assetSale.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Finance Handoff Id" [value]="assetSale.FinanceHandoffId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Ownership Transfer Date" [value]="assetSale.OwnershipTransferDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="assetSale.StatusCode">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
