 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Disposal Case Id" class="mb-1">DisposalCaseId</label>
        <p-dropdown
            inputId="DisposalCaseId" 
            [options]="disposalcaseidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DisposalCaseId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DisposalCaseId')"
											label="Disposal Case Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Buyer Party Id" class="mb-1">BuyerPartyId</label>
        <p-dropdown
            inputId="BuyerPartyId" 
            [options]="buyerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="BuyerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('BuyerPartyId')"
											label="Buyer Party Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Disposal Award Id" class="mb-1">DisposalAwardId</label>
        <p-dropdown
            inputId="DisposalAwardId" 
            [options]="disposalawardidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DisposalAwardId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DisposalAwardId')"
											label="Disposal Award Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="SaleDate">Sale Date 
							</label> 
							<p-calendar id="SaleDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="SaleDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('SaleDate')"
											label="Sale Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="SaleAmount">Sale Amount 
							</label> 
							<p-inputNumber id="SaleAmount"  pSize="small"	formControlName="SaleAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('SaleAmount')"
											label="Sale Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Finance Handoff Id" class="mb-1">FinanceHandoffId</label>
        <p-dropdown
            inputId="FinanceHandoffId"

            optionLabel="Text"
	    optionValue="Value"
	    formControlName="FinanceHandoffId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('FinanceHandoffId')"
											label="Finance Handoff Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="OwnershipTransferDate">Ownership Transfer Date 
							</label> 
							<p-calendar id="OwnershipTransferDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="OwnershipTransferDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('OwnershipTransferDate')"
											label="Ownership Transfer Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode"

	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
