<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="End Of Lease Settlement Id" [value]="endOfLeaseSettlementLine.EndOfLeaseSettlementId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="endOfLeaseSettlementLine.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Settlement Charge Type Id" [value]="endOfLeaseSettlementLine.SettlementChargeTypeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Source Type Code" [value]="endOfLeaseSettlementLine.SourceTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Source Id" [value]="endOfLeaseSettlementLine.SourceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="endOfLeaseSettlementLine.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quantity" [value]="endOfLeaseSettlementLine.Quantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Rate Amount" [value]="endOfLeaseSettlementLine.RateAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Line Amount" [value]="endOfLeaseSettlementLine.LineAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="endOfLeaseSettlementLine.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Waived Amount" [value]="endOfLeaseSettlementLine.WaivedAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="endOfLeaseSettlementLine.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
