 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="End Of Lease Settlement Id" class="mb-1">EndOfLeaseSettlementId</label>
        <p-dropdown
            inputId="EndOfLeaseSettlementId" 
            [options]="endofleasesettlementidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="EndOfLeaseSettlementId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('EndOfLeaseSettlementId')"
											label="End Of Lease Settlement Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Settlement Charge Type Id" class="mb-1">SettlementChargeTypeId</label>
        <p-dropdown
            inputId="SettlementChargeTypeId" 
            [options]="settlementchargetypeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SettlementChargeTypeId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SettlementChargeTypeId')"
											label="Settlement Charge Type Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Source Type Code" class="mb-1">SourceTypeCode</label>
        <p-dropdown
            inputId="SourceTypeCode" 
            [options]="sourcetypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="SourceTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('SourceTypeCode')"
											label="Source Type Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="SourceId">Source Id 
							</label> 
							<p-inputNumber id="SourceId"  pSize="small"	formControlName="SourceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('SourceId')"
											label="Source Id">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="Quantity">Quantity 
							</label> 
							<p-inputNumber id="Quantity"  pSize="small"	formControlName="Quantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Quantity')"
											label="Quantity">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="RateAmount">Rate Amount 
							</label> 
							<p-inputNumber id="RateAmount"  pSize="small"	formControlName="RateAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RateAmount')"
											label="Rate Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="LineAmount">Line Amount 
							</label> 
							<p-inputNumber id="LineAmount"  pSize="small"	formControlName="LineAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineAmount')"
											label="Line Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="WaivedAmount">Waived Amount 
							</label> 
							<p-inputNumber id="WaivedAmount"  pSize="small"	formControlName="WaivedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('WaivedAmount')"
											label="Waived Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
