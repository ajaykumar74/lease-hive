<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Disposal Case Id" [value]="disposalAuction.DisposalCaseId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Auction No" [value]="disposalAuction.AuctionNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Auction Provider Party Id" [value]="disposalAuction.AuctionProviderPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Auction Start At" [value]="disposalAuction.AuctionStartAt">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Auction End At" [value]="disposalAuction.AuctionEndAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reserve Amount" [value]="disposalAuction.ReserveAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="disposalAuction.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="disposalAuction.StatusCode">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
