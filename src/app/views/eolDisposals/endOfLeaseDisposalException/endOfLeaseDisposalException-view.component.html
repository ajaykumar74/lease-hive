<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Exception No" [value]="endOfLeaseDisposalException.ExceptionNo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Exception Type Code" [value]="endOfLeaseDisposalException.ExceptionTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reference Type Code" [value]="endOfLeaseDisposalException.ReferenceTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Id" [value]="endOfLeaseDisposalException.ReferenceId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Severity Code" [value]="endOfLeaseDisposalException.SeverityCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reason" [value]="endOfLeaseDisposalException.Reason">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Assigned To User Id" [value]="endOfLeaseDisposalException.AssignedToUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="endOfLeaseDisposalException.StatusCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Resolved At" [value]="endOfLeaseDisposalException.ResolvedAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="endOfLeaseDisposalException.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
