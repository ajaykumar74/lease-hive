					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="RoleId" [value]="rolePermission.RoleId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Permission Id" [value]="rolePermission.PermissionId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Grant Type" [value]="rolePermission.GrantType">

						</div>
