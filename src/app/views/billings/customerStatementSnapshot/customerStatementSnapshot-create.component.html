 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Billing Organisation Id" class="mb-1">BillingOrganisationId</label>
        <p-dropdown
            inputId="BillingOrganisationId" 
            [options]="billingorganisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="BillingOrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('BillingOrganisationId')"
											label="Billing Organisation Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Customer Party Id" class="mb-1">CustomerPartyId</label>
        <p-dropdown
            inputId="CustomerPartyId" 
            [options]="customerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerPartyId')"
											label="Customer Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="StatementDate">Statement Date 
							</label> 
							<p-calendar id="StatementDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="StatementDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('StatementDate')"
											label="Statement Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="OpeningBalance">Opening Balance 
							</label> 
							<p-inputNumber id="OpeningBalance"  pSize="small"	formControlName="OpeningBalance"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('OpeningBalance')"
											label="Opening Balance">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DebitAmount">Debit Amount 
							</label> 
							<p-inputNumber id="DebitAmount"  pSize="small"	formControlName="DebitAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DebitAmount')"
											label="Debit Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="CreditAmount">Credit Amount 
							</label> 
							<p-inputNumber id="CreditAmount"  pSize="small"	formControlName="CreditAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('CreditAmount')"
											label="Credit Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ClosingBalance">Closing Balance 
							</label> 
							<p-inputNumber id="ClosingBalance"  pSize="small"	formControlName="ClosingBalance"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ClosingBalance')"
											label="Closing Balance">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="CurrentAmount">Current Amount 
							</label> 
							<p-inputNumber id="CurrentAmount"  pSize="small"	formControlName="CurrentAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('CurrentAmount')"
											label="Current Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="Days1To30">Days1 To30 
							</label> 
							<p-inputNumber id="Days1To30"  pSize="small"	formControlName="Days1To30"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Days1To30')"
											label="Days1 To30">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="Days31To60">Days31 To60 
							</label> 
							<p-inputNumber id="Days31To60"  pSize="small"	formControlName="Days31To60"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Days31To60')"
											label="Days31 To60">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="Days61To90">Days61 To90 
							</label> 
							<p-inputNumber id="Days61To90"  pSize="small"	formControlName="Days61To90"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Days61To90')"
											label="Days61 To90">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="Days90Plus">Days90 Plus 
							</label> 
							<p-inputNumber id="Days90Plus"  pSize="small"	formControlName="Days90Plus"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Days90Plus')"
											label="Days90 Plus">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Document Id" class="mb-1">DocumentId</label>
        <p-dropdown
            inputId="DocumentId" 
            [options]="documentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentId')"
											label="Document Id">
										</app-validation-errors></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
