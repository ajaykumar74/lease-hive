 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Receipt Status Id" class="mb-1">ReceiptStatusId</label>
        <p-dropdown
            inputId="ReceiptStatusId" 
            [options]="receiptstatusidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReceiptStatusId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReceiptStatusId')"
											label="Receipt Status Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Receiving Organisation Id" class="mb-1">ReceivingOrganisationId</label>
        <p-dropdown
            inputId="ReceivingOrganisationId" 
            [options]="receivingorganisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReceivingOrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReceivingOrganisationId')"
											label="Receiving Organisation Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Customer Party Id" class="mb-1">CustomerPartyId</label>
        <p-dropdown
            inputId="CustomerPartyId" 
            [options]="customerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerPartyId')"
											label="Customer Party Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="ReceiptDate">Receipt Date 
							</label> 
							<p-calendar id="ReceiptDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ReceiptDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ReceiptDate')"
											label="Receipt Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="ReceiptAmount">Receipt Amount 
							</label> 
							<p-inputNumber id="ReceiptAmount"  pSize="small"	formControlName="ReceiptAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReceiptAmount')"
											label="Receipt Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="AllocatedAmount">Allocated Amount 
							</label> 
							<p-inputNumber id="AllocatedAmount"  pSize="small"	formControlName="AllocatedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('AllocatedAmount')"
											label="Allocated Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="UnappliedAmount">Unapplied Amount 
							</label> 
							<p-inputNumber id="UnappliedAmount"  pSize="small"	formControlName="UnappliedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('UnappliedAmount')"
											label="Unapplied Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Payment Method" class="mb-1">PaymentMethod</label>
        <p-dropdown
            inputId="PaymentMethod" 
            [options]="paymentmethodOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PaymentMethod"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PaymentMethod')"
											label="Payment Method">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Organisation Bank Account Id" class="mb-1">OrganisationBankAccountId</label>
        <p-dropdown
            inputId="OrganisationBankAccountId" 
            [options]="organisationbankaccountidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OrganisationBankAccountId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationBankAccountId')"
											label="Organisation Bank Account Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ExternalTransactionRef">External Transaction Ref 
							</label> 
							<input pInputText id="ExternalTransactionRef" type="text" pSize="small"	formControlName="ExternalTransactionRef"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ExternalTransactionRef')"
											label="External Transaction Ref">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="PayerNameSnapshot">Payer Name Snapshot 
							</label> 
							<input pInputText id="PayerNameSnapshot" type="text" pSize="small"	formControlName="PayerNameSnapshot"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('PayerNameSnapshot')"
											label="Payer Name Snapshot">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="VerifiedAtUtc">Verified At Utc 
							</label> 
							<p-calendar id="VerifiedAtUtc"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="VerifiedAtUtc"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('VerifiedAtUtc')"
											label="Verified At Utc">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
