<div class="container">
    <div class="grid"><div class="col-12"><div class="card p-fluid billing-run-create">
        <app-message [AlertType]="'message'"></app-message>
        <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'Details'" [form]="editForm"></app-toolbar-buttons>
        <app-spinner></app-spinner>
        <form [formGroup]="editForm" (ngSubmit)="save()">
            <section class="billing-run-create__intro">
                <div>
                    <span class="section-eyebrow">Automated discovery</span>
                    <h2>Build a billing run from eligible obligations</h2>
                    <p>LeaseHive finds due, unbilled schedule lines and one-off contract charges for the selected organisation. Amounts, currency, status and totals are calculated by the server.</p>
                </div>
                <i class="pi pi-sparkles" aria-hidden="true"></i>
            </section>
            <div class="billing-run-create__fields">
                <div class="field"><label for="BillingOrganisationId">Organisation</label><p-dropdown inputId="BillingOrganisationId" [options]="billingorganisationidOptions" optionLabel="Text" optionValue="Value" formControlName="BillingOrganisationId" placeholder="Select organisation" class="w-full"></p-dropdown><app-validation-errors [type]="'text'" [control]="editForm.get('BillingOrganisationId')" label="Organisation"></app-validation-errors></div>
                <div class="field"><label for="BillingDate">Billing date</label><p-calendar inputId="BillingDate" size="small" dateFormat="dd-M-yy" [showIcon]="true" formControlName="BillingDate"></p-calendar><app-validation-errors [type]="'date'" [control]="editForm.get('BillingDate')" label="Billing date"></app-validation-errors></div>
                <div class="field"><label for="PeriodFrom">Period from</label><p-calendar inputId="PeriodFrom" size="small" dateFormat="dd-M-yy" [showIcon]="true" formControlName="PeriodFrom"></p-calendar><app-validation-errors [type]="'date'" [control]="editForm.get('PeriodFrom')" label="Period from"></app-validation-errors></div>
                <div class="field"><label for="PeriodTo">Period to</label><p-calendar inputId="PeriodTo" size="small" dateFormat="dd-M-yy" [showIcon]="true" formControlName="PeriodTo"></p-calendar><app-validation-errors [type]="'date'" [control]="editForm.get('PeriodTo')" label="Period to"></app-validation-errors></div>
                <div class="field"><label for="RunType">Run type</label><p-dropdown inputId="RunType" [options]="runtypeOptions" optionLabel="Text" optionValue="Value" formControlName="RunType" placeholder="ADHOC" class="w-full"></p-dropdown><app-validation-errors [type]="'text'" [control]="editForm.get('RunType')" label="Run type"></app-validation-errors></div>
            </div>
        </form>
    </div></div></div>
</div>
