<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-wrap" > <app-view-field label="Reference Type" [value]="financeDocumentLink.ReferenceType">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Reference Id" [value]="financeDocumentLink.ReferenceId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Document Id" [value]="financeDocumentLink.DocumentId">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Document Role" [value]="financeDocumentLink.DocumentRole">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Is Primary" [value]="financeDocumentLink.IsPrimary">
								</app-view-field></div>
<div class="flex flex-wrap" > <app-view-field label="Record Status" [value]="financeDocumentLink.RecordStatus">
								</app-view-field></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
