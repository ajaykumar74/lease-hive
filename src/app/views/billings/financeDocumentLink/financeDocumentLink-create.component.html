 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-wrap" >  <label for="Reference Type" class="mb-1">ReferenceType</label>
        <p-dropdown
            inputId="ReferenceType" 
            [options]="referencetypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReferenceType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceType')"
											label="Reference Type">
										</app-validation-errors></div>
<div class="flex flex-wrap" > 							<label for="ReferenceId">Reference Id 
							</label> 
							<p-inputNumber id="ReferenceId"  pSize="small"	formControlName="ReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceId')"
											label="Reference Id">
										</app-validation-errors>
						 </div>
<div class="flex flex-wrap" >  <label for="Document Id" class="mb-1">DocumentId</label>
        <p-dropdown
            inputId="DocumentId" 
            [options]="documentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentId')"
											label="Document Id">
										</app-validation-errors></div>
<div class="flex flex-wrap" >  <label for="Document Role" class="mb-1">DocumentRole</label>
        <p-dropdown
            inputId="DocumentRole" 
            [options]="documentroleOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentRole"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentRole')"
											label="Document Role">
										</app-validation-errors></div>
<div class="flex flex-wrap" > <label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsPrimary" binary="true" formControlName="IsPrimary">
											</p-checkbox>
											<label for="IsPrimary">Is Primary</label>
										</div>
										<div class="validation-space"></div></div>
<div class="flex flex-wrap" >  <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
