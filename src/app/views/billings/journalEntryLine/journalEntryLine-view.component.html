<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Journal Entry Id" [value]="journalEntryLine.JournalEntryId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="journalEntryLine.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="GL Account Code" [value]="journalEntryLine.GLAccountCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Debit Amount" [value]="journalEntryLine.DebitAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Credit Amount" [value]="journalEntryLine.CreditAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="journalEntryLine.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Cost Centre Id" [value]="journalEntryLine.CostCentreId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Profit Centre Id" [value]="journalEntryLine.ProfitCentreId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Organisation Unit Id" [value]="journalEntryLine.OrganisationUnitId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Customer Party Id" [value]="journalEntryLine.CustomerPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="journalEntryLine.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="journalEntryLine.AssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Tax Code" [value]="journalEntryLine.TaxCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Narration" [value]="journalEntryLine.Narration">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
