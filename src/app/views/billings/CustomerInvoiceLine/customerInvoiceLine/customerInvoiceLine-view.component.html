<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Customer Invoice Id" [value]="customerInvoiceLine.CustomerInvoiceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Line No" [value]="customerInvoiceLine.LineNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="customerInvoiceLine.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease Payment Schedule Line Id" [value]="customerInvoiceLine.LeasePaymentScheduleLineId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Charge Id" [value]="customerInvoiceLine.LeaseContractChargeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease Contract Asset Id" [value]="customerInvoiceLine.LeaseContractAssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Charge Type Code" [value]="customerInvoiceLine.ChargeTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="customerInvoiceLine.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Service Period From" [value]="customerInvoiceLine.ServicePeriodFrom">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Service Period To" [value]="customerInvoiceLine.ServicePeriodTo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Quantity" [value]="customerInvoiceLine.Quantity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="UOM Id" [value]="customerInvoiceLine.UOMId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Unit Price" [value]="customerInvoiceLine.UnitPrice">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Discount Amount" [value]="customerInvoiceLine.DiscountAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Taxable Amount" [value]="customerInvoiceLine.TaxableAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Tax Amount" [value]="customerInvoiceLine.TaxAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Line Gross Amount" [value]="customerInvoiceLine.LineGrossAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="customerInvoiceLine.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
