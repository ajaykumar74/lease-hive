<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Customer Invoice Id" class="mb-1">CustomerInvoiceId</label>
        <p-dropdown
            inputId="CustomerInvoiceId" 
            [options]="customerinvoiceidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerInvoiceId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerInvoiceId')"
											label="Customer Invoice Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Lease Contract Id" class="mb-1">LeaseContractId</label>
        <p-dropdown
            inputId="LeaseContractId" 
            [options]="leasecontractidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LeaseContractId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LeaseContractId')"
											label="Lease Contract Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Lease Payment Schedule Line Id" class="mb-1">LeasePaymentScheduleLineId</label>
        <p-dropdown
            inputId="LeasePaymentScheduleLineId" 
            [options]="leasepaymentschedulelineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LeasePaymentScheduleLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LeasePaymentScheduleLineId')"
											label="Lease Payment Schedule Line Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Lease Contract Charge Id" class="mb-1">LeaseContractChargeId</label>
        <p-dropdown
            inputId="LeaseContractChargeId" 
            [options]="leasecontractchargeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LeaseContractChargeId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LeaseContractChargeId')"
											label="Lease Contract Charge Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Lease Contract Asset Id" class="mb-1">LeaseContractAssetId</label>
        <p-dropdown
            inputId="LeaseContractAssetId" 
            [options]="leasecontractassetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LeaseContractAssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LeaseContractAssetId')"
											label="Lease Contract Asset Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Charge Type Code" class="mb-1">ChargeTypeCode</label>
        <p-dropdown
            inputId="ChargeTypeCode" 
            [options]="chargetypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ChargeTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ChargeTypeCode')"
											label="Charge Type Code">
										</app-validation-errors></div><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ServicePeriodFrom">Service Period From 
							</label> 
							<p-calendar id="ServicePeriodFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ServicePeriodFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ServicePeriodFrom')"
											label="Service Period From">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="ServicePeriodTo">Service Period To 
							</label> 
							<p-calendar id="ServicePeriodTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ServicePeriodTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ServicePeriodTo')"
											label="Service Period To">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="Quantity">Quantity 
							</label> 
							<p-inputNumber id="Quantity"  pSize="small"	formControlName="Quantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Quantity')"
											label="Quantity">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="UOM Id" class="mb-1">UOMId</label>
        <p-dropdown
            inputId="UOMId"

            optionLabel="Text"
	    optionValue="Value"
	    formControlName="UOMId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('UOMId')"
											label="UOM Id">
										</app-validation-errors></div></div>

							</label> 
							<p-inputNumber id="UnitPrice"  pSize="small"	formControlName="UnitPrice"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('UnitPrice')"
											label="Unit Price">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DiscountAmount">Discount Amount 
							</label> 
							<p-inputNumber id="DiscountAmount"  pSize="small"	formControlName="DiscountAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DiscountAmount')"
											label="Discount Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TaxableAmount">Taxable Amount 
							</label> 
							<p-inputNumber id="TaxableAmount"  pSize="small"	formControlName="TaxableAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxableAmount')"
											label="Taxable Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="LineGrossAmount">Line Gross Amount 
							</label> 
							<p-inputNumber id="LineGrossAmount"  pSize="small"	formControlName="LineGrossAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineGrossAmount')"
											label="Line Gross Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
