<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Organisation Bank Account Id" [value]="bankStatement.OrganisationBankAccountId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Statement No" [value]="bankStatement.StatementNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Statement Date" [value]="bankStatement.StatementDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="bankStatement.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Opening Balance" [value]="bankStatement.OpeningBalance">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Closing Balance" [value]="bankStatement.ClosingBalance">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Import Source" [value]="bankStatement.ImportSource">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Import Batch Ref" [value]="bankStatement.ImportBatchRef">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reconciliation Status" [value]="bankStatement.ReconciliationStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="bankStatement.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
