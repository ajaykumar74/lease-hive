 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Debit Note Id" class="mb-1">DebitNoteId</label>
        <p-dropdown
            inputId="DebitNoteId" 
            [options]="debitnoteidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DebitNoteId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DebitNoteId')"
											label="Debit Note Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Customer Invoice Line Id" class="mb-1">CustomerInvoiceLineId</label>
        <p-dropdown
            inputId="CustomerInvoiceLineId" 
            [options]="customerinvoicelineidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerInvoiceLineId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerInvoiceLineId')"
											label="Customer Invoice Line Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div><div class="flex flex-col w-full">							<label for="Quantity">Quantity 
							</label> 
							<p-inputNumber id="Quantity"  pSize="small"	formControlName="Quantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Quantity')"
											label="Quantity">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="NetAmount">Net Amount 
							</label> 
							<p-inputNumber id="NetAmount"  pSize="small"	formControlName="NetAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('NetAmount')"
											label="Net Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="GrossAmount">Gross Amount 
							</label> 
							<p-inputNumber id="GrossAmount"  pSize="small"	formControlName="GrossAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('GrossAmount')"
											label="Gross Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
