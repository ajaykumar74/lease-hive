<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Finance Approval Request Id" [value]="financeApprovalAction.FinanceApprovalRequestId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Action By User Id" [value]="financeApprovalAction.ActionByUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Action Code" [value]="financeApprovalAction.ActionCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Action At Utc" [value]="financeApprovalAction.ActionAtUtc">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Comments" [value]="financeApprovalAction.Comments">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Authority Snapshot" [value]="financeApprovalAction.AuthoritySnapshot">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
