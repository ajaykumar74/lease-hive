 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Organisation Id" class="mb-1">OrganisationId</label>
        <p-dropdown
            inputId="OrganisationId" 
            [options]="organisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationId')"
											label="Organisation Id">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="EventType">Event Type 
							</label> 
							<input pInputText id="EventType" type="text" pSize="small"	formControlName="EventType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('EventType')"
											label="Event Type">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ChargeTypeCode">Charge Type Code 
							</label> 
							<input pInputText id="ChargeTypeCode" type="text" pSize="small"	formControlName="ChargeTypeCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ChargeTypeCode')"
											label="Charge Type Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Tax Type Id" class="mb-1">TaxTypeId</label>
        <p-dropdown
            inputId="TaxTypeId" 
            [options]="taxtypeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="TaxTypeId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('TaxTypeId')"
											label="Tax Type Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="DebitAccountCode">Debit Account Code 
							</label> 
							<input pInputText id="DebitAccountCode" type="text" pSize="small"	formControlName="DebitAccountCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('DebitAccountCode')"
											label="Debit Account Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="CreditAccountCode">Credit Account Code 
							</label> 
							<input pInputText id="CreditAccountCode" type="text" pSize="small"	formControlName="CreditAccountCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('CreditAccountCode')"
											label="Credit Account Code">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">Effective From 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="Effective From">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EffectiveTo">Effective To 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="Effective To">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="Priority">Priority 
							</label> 
							<p-inputNumber id="Priority"  pSize="small"	formControlName="Priority"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Priority')"
											label="Priority">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
