<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Exception No" [value]="financeException.ExceptionNo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Exception Type" [value]="financeException.ExceptionType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reference Type" [value]="financeException.ReferenceType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Id" [value]="financeException.ReferenceId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Severity" [value]="financeException.Severity">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="financeException.StatusCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reason Code" [value]="financeException.ReasonCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="financeException.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Assigned To User Id" [value]="financeException.AssignedToUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Resolved At Utc" [value]="financeException.ResolvedAtUtc">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Resolution Note" [value]="financeException.ResolutionNote">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="financeException.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
