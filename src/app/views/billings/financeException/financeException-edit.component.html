<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ExceptionNo">Exception No 
							</label> 
							<input pInputText id="ExceptionNo" type="text" pSize="small"	formControlName="ExceptionNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ExceptionNo')"
											label="Exception No">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Exception Type" class="mb-1">ExceptionType</label>
        <p-dropdown
            inputId="ExceptionType" 
            [options]="exceptiontypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ExceptionType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ExceptionType')"
											label="Exception Type">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ReferenceType">Reference Type 
							</label> 
							<input pInputText id="ReferenceType" type="text" pSize="small"	formControlName="ReferenceType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceType')"
											label="Reference Type">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ReferenceId">Reference Id 
							</label> 
							<p-inputNumber id="ReferenceId"  pSize="small"	formControlName="ReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceId')"
											label="Reference Id">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Severity" class="mb-1">Severity</label>
        <p-dropdown
            inputId="Severity" 
            [options]="severityOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="Severity"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('Severity')"
											label="Severity">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ReasonCode">Reason Code 
							</label> 
							<input pInputText id="ReasonCode" type="text" pSize="small"	formControlName="ReasonCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ReasonCode')"
											label="Reason Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Assigned To User Id" class="mb-1">AssignedToUserId</label>
        <p-dropdown
            inputId="AssignedToUserId" 
            [options]="assignedtouseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssignedToUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssignedToUserId')"
											label="Assigned To User Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="ResolvedAtUtc">Resolved At Utc 
							</label> 
							<p-calendar id="ResolvedAtUtc"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ResolvedAtUtc"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ResolvedAtUtc')"
											label="Resolved At Utc">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Resolution Note</label>
                    <textarea size="small" pTextarea placeholder="Type Resolution Note" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="ResolutionNote"
										[ngClass]="{'is-invalid': (editForm.get('ResolutionNote').touched || editForm.get('ResolutionNote').dirty) && !editForm.get('ResolutionNote').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('ResolutionNote')"
											label="Resolution Note">
										</app-validation-errors>


               </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
