<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Billing Run Id" [value]="billingRunItem.BillingRunId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="billingRunItem.LeaseContractId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Payment Schedule Line Id" [value]="billingRunItem.LeasePaymentScheduleLineId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease Contract Charge Id" [value]="billingRunItem.LeaseContractChargeId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Source Type" [value]="billingRunItem.SourceType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Due Date" [value]="billingRunItem.DueDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Amount" [value]="billingRunItem.Amount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="billingRunItem.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Validation Status" [value]="billingRunItem.ValidationStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Exclusion Reason" [value]="billingRunItem.ExclusionReason">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Customer Invoice Id" [value]="billingRunItem.CustomerInvoiceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="billingRunItem.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
