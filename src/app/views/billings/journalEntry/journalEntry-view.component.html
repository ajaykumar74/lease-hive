<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Organisation Id" [value]="journalEntry.OrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Journal Date" [value]="journalEntry.JournalDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Period Code" [value]="journalEntry.PeriodCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Source Module" [value]="journalEntry.SourceModule">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="journalEntry.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Total Debit" [value]="journalEntry.TotalDebit">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Total Credit" [value]="journalEntry.TotalCredit">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Posting Status" [value]="journalEntry.PostingStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="External Journal Ref" [value]="journalEntry.ExternalJournalRef">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Posted At Utc" [value]="journalEntry.PostedAtUtc">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
