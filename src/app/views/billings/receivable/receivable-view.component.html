<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Billing Organisation Id" [value]="receivable.BillingOrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Customer Party Id" [value]="receivable.CustomerPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Source Document Type" [value]="receivable.SourceDocumentType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Source Document Id" [value]="receivable.SourceDocumentId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="receivable.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Document No" [value]="receivable.DocumentNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Document Date" [value]="receivable.DocumentDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Due Date" [value]="receivable.DueDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="receivable.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Original Amount" [value]="receivable.OriginalAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Allocated Amount" [value]="receivable.AllocatedAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Credit Applied Amount" [value]="receivable.CreditAppliedAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Write Off Amount" [value]="receivable.WriteOffAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Outstanding Amount" [value]="receivable.OutstandingAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Receivable Status" [value]="receivable.ReceivableStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Dispute Hold Flag" [value]="receivable.DisputeHoldFlag">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
