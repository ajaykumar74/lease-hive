 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Organisation Id" class="mb-1">OrganisationId</label>
        <p-dropdown
            inputId="OrganisationId" 
            [options]="organisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationId')"
											label="Organisation Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Event Type" class="mb-1">EventType</label>
        <p-dropdown
            inputId="EventType" 
            [options]="eventtypeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="EventType"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('EventType')"
											label="Event Type">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="SourceType">Source Type 
							</label> 
							<input pInputText id="SourceType" type="text" pSize="small"	formControlName="SourceType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('SourceType')"
											label="Source Type">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="SourceId">Source Id 
							</label> 
							<p-inputNumber id="SourceId"  pSize="small"	formControlName="SourceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('SourceId')"
											label="Source Id">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EventDate">Event Date 
							</label> 
							<p-calendar id="EventDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EventDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EventDate')"
											label="Event Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="EventAmount">Event Amount 
							</label> 
							<p-inputNumber id="EventAmount"  pSize="small"	formControlName="EventAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('EventAmount')"
											label="Event Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Posting Status" class="mb-1">PostingStatus</label>
        <p-dropdown
            inputId="PostingStatus" 
            [options]="postingstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PostingStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PostingStatus')"
											label="Posting Status">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="AccountingRuleCode">Accounting Rule Code 
							</label> 
							<input pInputText id="AccountingRuleCode" type="text" pSize="small"	formControlName="AccountingRuleCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('AccountingRuleCode')"
											label="Accounting Rule Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Journal Entry Id" class="mb-1">JournalEntryId</label>
        <p-dropdown
            inputId="JournalEntryId" 
            [options]="journalentryidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="JournalEntryId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('JournalEntryId')"
											label="Journal Entry Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Error Message</label>
                    <textarea size="small" pTextarea placeholder="Type Error Message" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="ErrorMessage"
										[ngClass]="{'is-invalid': (editForm.get('ErrorMessage').touched || editForm.get('ErrorMessage').dirty) && !editForm.get('ErrorMessage').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('ErrorMessage')"
											label="Error Message">
										</app-validation-errors>


               </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
