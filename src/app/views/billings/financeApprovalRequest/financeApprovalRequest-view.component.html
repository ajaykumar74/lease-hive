<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reference Type" [value]="financeApprovalRequest.ReferenceType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Id" [value]="financeApprovalRequest.ReferenceId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Workflow Instance Id" [value]="financeApprovalRequest.WorkflowInstanceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requested By User Id" [value]="financeApprovalRequest.RequestedByUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requested At Utc" [value]="financeApprovalRequest.RequestedAtUtc">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Approval Status" [value]="financeApprovalRequest.ApprovalStatus">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Amount" [value]="financeApprovalRequest.Amount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="financeApprovalRequest.CurrencyCode">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
