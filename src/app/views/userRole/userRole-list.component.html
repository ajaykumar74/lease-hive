<div class="grid">
    <div class="col-12">
        <div class="card">
            <app-message [AlertType]="'message'"></app-message>
            <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'User Role List'" [PageType]="'List'"></app-toolbar-buttons>
            <app-spinner></app-spinner>
            <div class="col-12 md:col-6">
                <p-inputGroup>
                    <input type="text" class="p-inputtext-sm" pInputText placeholder="Search user roles" [(ngModel)]="objSearch.Name" />
                    <button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button>
                </p-inputGroup>
            </div>
            <p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th pFrozenColumn pSortableColumn="ApplicationUserName" style="width: 240px">User <p-sortIcon field="ApplicationUserName" /></th>
                        <th pSortableColumn="RoleDisplayName" style="width: 260px">Role <p-sortIcon field="RoleDisplayName" /></th>
                        <th pSortableColumn="ScopeType" style="width: 160px">Scope Type <p-sortIcon field="ScopeType" /></th>
                        <th style="width: 280px">Scope</th>
                        <th style="width: 220px">Assigned By</th>
                        <th pSortableColumn="AssignedAt" style="width: 180px">Assigned <p-sortIcon field="AssignedAt" /></th>
                        <th style="width: 130px">Status</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-obj>
                    <tr>
                        <td style="width: 240px" pFrozenColumn><p-button [label]="obj.ApplicationUserName" [link]="true" (click)="onDetailsClick(obj)" /></td>
                        <td style="width: 260px">{{ obj.RoleDisplayName }}</td>
                        <td style="width: 160px">{{ obj.ScopeType }}</td>
                        <td style="width: 280px">{{ obj.ScopeReferenceDisplayName }}</td>
                        <td style="width: 220px">{{ obj.AssignedByUserName }}</td>
                        <td style="width: 180px">{{ obj.AssignedAt | date:'medium' }}</td>
                        <td style="width: 130px">{{ obj.RecordStatus }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
