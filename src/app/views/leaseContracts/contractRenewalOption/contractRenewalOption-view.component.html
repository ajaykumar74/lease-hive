<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="contractRenewalOption.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Option Type Code" [value]="contractRenewalOption.OptionTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Earliest Exercise Date" [value]="contractRenewalOption.EarliestExerciseDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Latest Exercise Date" [value]="contractRenewalOption.LatestExerciseDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Notice Days" [value]="contractRenewalOption.NoticeDays">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Option Price Amount" [value]="contractRenewalOption.OptionPriceAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="contractRenewalOption.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Terms Json" [value]="contractRenewalOption.TermsJson">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
