<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contract Execution Id" [value]="contractExecutionParty.ContractExecutionId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Lease Contract Party Id" [value]="contractExecutionParty.LeaseContractPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Signer Party Id" [value]="contractExecutionParty.SignerPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Signer Name Snapshot" [value]="contractExecutionParty.SignerNameSnapshot">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Signer Email Snapshot" [value]="contractExecutionParty.SignerEmailSnapshot">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Signing Order" [value]="contractExecutionParty.SigningOrder">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Signature Status Code" [value]="contractExecutionParty.SignatureStatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Signed On" [value]="contractExecutionParty.SignedOn">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
