<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Contract Obligation Id" class="mb-1">ContractObligationId</label>
        <p-dropdown
            inputId="ContractObligationId" 
            [options]="contractobligationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ContractObligationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ContractObligationId')"
											label="Contract Obligation Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Event Type Code" class="mb-1">EventTypeCode</label>
        <p-dropdown
            inputId="EventTypeCode" 
            [options]="eventtypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="EventTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('EventTypeCode')"
											label="Event Type Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EventDateTime">Event Date Time 
							</label> 
							<p-calendar id="EventDateTime"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EventDateTime"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EventDateTime')"
											label="Event Date Time">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Document Id" class="mb-1">DocumentId</label>
        <p-dropdown
            inputId="DocumentId" 
            [options]="documentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentId')"
											label="Document Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ReferenceType">Reference Type 
							</label> 
							<input pInputText id="ReferenceType" type="text" pSize="small"	formControlName="ReferenceType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ReferenceType')"
											label="Reference Type">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ReferenceId">Reference Id 
							</label> 
							<p-inputNumber id="ReferenceId"  pSize="small"	formControlName="ReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ReferenceId')"
											label="Reference Id">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Notes</label>
                    <textarea size="small" pTextarea placeholder="Type Notes" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Notes"
										[ngClass]="{'is-invalid': (editForm.get('Notes').touched || editForm.get('Notes').dirty) && !editForm.get('Notes').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Notes')"
											label="Notes">
										</app-validation-errors>


               </div><div class="flex flex-col w-full"> <label for="Performed By" class="mb-1">PerformedBy</label>
        <p-dropdown
            inputId="PerformedBy" 
            [options]="performedbyOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PerformedBy"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PerformedBy')"
											label="Performed By">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
