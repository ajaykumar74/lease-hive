<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contract Amendment Id" [value]="contractAmendmentChange.ContractAmendmentId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Change Section Code" [value]="contractAmendmentChange.ChangeSectionCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reference Type" [value]="contractAmendmentChange.ReferenceType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Id" [value]="contractAmendmentChange.ReferenceId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Field Name" [value]="contractAmendmentChange.FieldName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Old Value" [value]="contractAmendmentChange.OldValue">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="New Value" [value]="contractAmendmentChange.NewValue">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Change Summary" [value]="contractAmendmentChange.ChangeSummary">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
