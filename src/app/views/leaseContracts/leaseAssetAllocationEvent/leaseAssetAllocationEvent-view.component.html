<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Asset Id" [value]="leaseAssetAllocationEvent.LeaseContractAssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Event Code" [value]="leaseAssetAllocationEvent.EventCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Event Date Time" [value]="leaseAssetAllocationEvent.EventDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="From Asset Id" [value]="leaseAssetAllocationEvent.FromAssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="To Asset Id" [value]="leaseAssetAllocationEvent.ToAssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reason Code" [value]="leaseAssetAllocationEvent.ReasonCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Comments" [value]="leaseAssetAllocationEvent.Comments">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Performed By" [value]="leaseAssetAllocationEvent.PerformedBy">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
