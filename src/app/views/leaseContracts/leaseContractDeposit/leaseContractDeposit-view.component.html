<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="leaseContractDeposit.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Deposit Type Code" [value]="leaseContractDeposit.DepositTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Required Amount" [value]="leaseContractDeposit.RequiredAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="leaseContractDeposit.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Due Date" [value]="leaseContractDeposit.DueDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Refundable Flag" [value]="leaseContractDeposit.RefundableFlag">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Interest Bearing Flag" [value]="leaseContractDeposit.InterestBearingFlag">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Finance Reference Id" [value]="leaseContractDeposit.FinanceReferenceId">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
