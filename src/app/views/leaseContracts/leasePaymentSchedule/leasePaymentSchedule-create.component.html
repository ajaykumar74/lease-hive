 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Lease Contract Id" class="mb-1">LeaseContractId</label>
        <p-dropdown
            inputId="LeaseContractId" 
            [options]="leasecontractidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="LeaseContractId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('LeaseContractId')"
											label="Lease Contract Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="ScheduleVersionNo">Schedule Version No 
							</label> 
							<p-inputNumber id="ScheduleVersionNo"  pSize="small"	formControlName="ScheduleVersionNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ScheduleVersionNo')"
											label="Schedule Version No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Schedule Status Code" class="mb-1">ScheduleStatusCode</label>
        <p-dropdown
            inputId="ScheduleStatusCode" 
            [options]="schedulestatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ScheduleStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ScheduleStatusCode')"
											label="Schedule Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Calculation Method Code" class="mb-1">CalculationMethodCode</label>
        <p-dropdown
            inputId="CalculationMethodCode" 
            [options]="calculationmethodcodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CalculationMethodCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CalculationMethodCode')"
											label="Calculation Method Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="StartDate">Start Date 
							</label> 
							<p-calendar id="StartDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="StartDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('StartDate')"
											label="Start Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EndDate">End Date 
							</label> 
							<p-calendar id="EndDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EndDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EndDate')"
											label="End Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="NumberOfPayments">Number Of Payments 
							</label> 
							<p-inputNumber id="NumberOfPayments"  pSize="small"	formControlName="NumberOfPayments"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('NumberOfPayments')"
											label="Number Of Payments">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="TotalRentalAmount">Total Rental Amount 
							</label> 
							<p-inputNumber id="TotalRentalAmount"  pSize="small"	formControlName="TotalRentalAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TotalRentalAmount')"
											label="Total Rental Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="TotalTaxAmount">Total Tax Amount 
							</label> 
							<p-inputNumber id="TotalTaxAmount"  pSize="small"	formControlName="TotalTaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TotalTaxAmount')"
											label="Total Tax Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="GeneratedOn">Generated On 
							</label> 
							<p-calendar id="GeneratedOn"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="GeneratedOn"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('GeneratedOn')"
											label="Generated On">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Generated By" class="mb-1">GeneratedBy</label>
        <p-dropdown
            inputId="GeneratedBy" 
            [options]="generatedbyOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="GeneratedBy"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('GeneratedBy')"
											label="Generated By">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
