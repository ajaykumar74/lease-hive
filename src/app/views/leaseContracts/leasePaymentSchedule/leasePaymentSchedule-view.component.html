<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="leasePaymentSchedule.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Schedule Version No" [value]="leasePaymentSchedule.ScheduleVersionNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Schedule Status Code" [value]="leasePaymentSchedule.ScheduleStatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Calculation Method Code" [value]="leasePaymentSchedule.CalculationMethodCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Start Date" [value]="leasePaymentSchedule.StartDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="End Date" [value]="leasePaymentSchedule.EndDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Number Of Payments" [value]="leasePaymentSchedule.NumberOfPayments">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="leasePaymentSchedule.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Total Rental Amount" [value]="leasePaymentSchedule.TotalRentalAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Total Tax Amount" [value]="leasePaymentSchedule.TotalTaxAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Generated On" [value]="leasePaymentSchedule.GeneratedOn">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Generated By" [value]="leasePaymentSchedule.GeneratedBy">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
