<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="contractTermination.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Termination No" [value]="contractTermination.TerminationNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Termination Type Code" [value]="contractTermination.TerminationTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requested Date" [value]="contractTermination.RequestedDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Proposed Termination Date" [value]="contractTermination.ProposedTerminationDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Actual Termination Date" [value]="contractTermination.ActualTerminationDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reason Code" [value]="contractTermination.ReasonCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reason" [value]="contractTermination.Reason">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Termination Status Code" [value]="contractTermination.TerminationStatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Approval Request Id" [value]="contractTermination.ApprovalRequestId">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
