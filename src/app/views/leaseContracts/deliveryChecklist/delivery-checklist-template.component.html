<div class="container"><div class="card p-fluid"><div class="flex justify-content-between align-items-center mb-3"><div><h3 class="m-0">Delivery checklist templates</h3><small>Tenant templates override inherited parent-category checks. Published deliveries retain a snapshot.</small></div><button type="button" pButton label="Save template" icon="pi pi-save" (click)="save()" [loading]="saving"></button></div><small *ngIf="error" class="text-red-500 block mb-3">{{ error }}</small><form [formGroup]="form"><div class="grid"><div class="col-12 md:col-6"><label>Asset category</label><p-dropdown [options]="categoryOptions" optionLabel="Text" optionValue="Value" formControlName="AssetCategoryId" placeholder="Select category" styleClass="w-full"></p-dropdown></div><div class="col-12 md:col-6"><label>Parent category (inherit from)</label><p-dropdown [options]="categoryOptions" optionLabel="Text" optionValue="Value" formControlName="ParentAssetCategoryId" [showClear]="true" placeholder="Optional parent category" styleClass="w-full"></p-dropdown></div><div class="col-12 md:col-8"><label>Template name</label><input pInputText formControlName="Name" /></div><div class="col-6 md:col-2"><label>Version</label><p-inputNumber formControlName="Version" [min]="1"></p-inputNumber></div><div class="col-6 md:col-2 flex align-items-end gap-2"><p-checkbox inputId="templateActive" binary="true" formControlName="Active"></p-checkbox><label for="templateActive">Active</label></div></div><div formArrayName="Items" class="mt-4"><div class="flex justify-content-between align-items-center"><h4 class="m-0">Checklist items</h4><div><button type="button" pButton label="Use system defaults" icon="pi pi-download" class="p-button-text" (click)="useSystemDefaults()"></button><button type="button" pButton label="Add item" icon="pi pi-plus" class="p-button-text" (click)="addItem()"></button></div></div><div *ngFor="let item of items.controls; let i = index" [formGroupName]="i" class="surface-50 border-round p-3 mt-2"><div class="grid"><div class="col-12 md:col-4"><label>Name</label><input pInputText formControlName="Name" /></div><div class="col-12 md:col-5"><label>Description</label><input pInputText formControlName="Description" /></div><div class="col-6 md:col-2"><label>Sort order</label><p-inputNumber formControlName="SortOrder" [min]="1"></p-inputNumber></div><div class="col-6 md:col-1 flex align-items-end"><button type="button" pButton icon="pi pi-trash" class="p-button-text p-button-danger" (click)="removeItem(i)"></button></div><div class="col-12 flex flex-wrap gap-3"><div><p-checkbox [binary]="true" [inputId]="'mandatory'+i" formControlName="Mandatory"></p-checkbox><label [for]="'mandatory'+i">Mandatory</label></div><div><p-checkbox [binary]="true" [inputId]="'evidence'+i" formControlName="EvidenceRequired"></p-checkbox><label [for]="'evidence'+i">Evidence required</label></div><div><p-checkbox [binary]="true" [inputId]="'na'+i" formControlName="AllowsNotApplicable"></p-checkbox><label [for]="'na'+i">Allow N/A</label></div><div><p-checkbox [binary]="true" [inputId]="'nonwaivable'+i" formControlName="NonWaivable"></p-checkbox><label [for]="'nonwaivable'+i">Non-waivable</label></div><div><p-checkbox [binary]="true" [inputId]="'active'+i" formControlName="Active"></p-checkbox><label [for]="'active'+i">Active</label></div></div></div></div></div></form></div></div>
