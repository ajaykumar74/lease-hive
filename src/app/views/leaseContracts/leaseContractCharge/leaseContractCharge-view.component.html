<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Lease Contract Id" [value]="leaseContractCharge.LeaseContractId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Charge Type Code" [value]="leaseContractCharge.ChargeTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Charge Description" [value]="leaseContractCharge.ChargeDescription">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Charge Amount" [value]="leaseContractCharge.ChargeAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="leaseContractCharge.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Tax Type" [value]="leaseContractCharge.TaxType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Tax Amount" [value]="leaseContractCharge.TaxAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Frequency Code" [value]="leaseContractCharge.FrequencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Due Event Code" [value]="leaseContractCharge.DueEventCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Is Capitalised" [value]="leaseContractCharge.IsCapitalised">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
