<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contract Termination Id" [value]="contractTerminationCharge.ContractTerminationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Charge Type Code" [value]="contractTerminationCharge.ChargeTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Description" [value]="contractTerminationCharge.Description">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Amount" [value]="contractTerminationCharge.Amount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="contractTerminationCharge.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Tax Amount" [value]="contractTerminationCharge.TaxAmount">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
