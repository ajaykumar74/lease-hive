 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Contract Termination Id" class="mb-1">ContractTerminationId</label>
        <p-dropdown
            inputId="ContractTerminationId" 
            [options]="contractterminationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ContractTerminationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ContractTerminationId')"
											label="Contract Termination Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Charge Type Code" class="mb-1">ChargeTypeCode</label>
        <p-dropdown
            inputId="ChargeTypeCode" 
            [options]="chargetypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ChargeTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ChargeTypeCode')"
											label="Charge Type Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="Description">Description 
							</label> 
							<input pInputText id="Description" type="text" pSize="small"	formControlName="Description"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="Amount">Amount 
							</label> 
							<p-inputNumber id="Amount"  pSize="small"	formControlName="Amount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Amount')"
											label="Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="TaxAmount">Tax Amount 
							</label> 
							<p-inputNumber id="TaxAmount"  pSize="small"	formControlName="TaxAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('TaxAmount')"
											label="Tax Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">							<label for="FinanceReferenceId">Finance Reference Id 
							</label> 
							<p-inputNumber id="FinanceReferenceId"  pSize="small"	formControlName="FinanceReferenceId"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('FinanceReferenceId')"
											label="Finance Reference Id">
										</app-validation-errors>
						 </div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
