<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Contract Approval Request Id" [value]="contractApprovalAction.ContractApprovalRequestId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Step No" [value]="contractApprovalAction.StepNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Approver User Id" [value]="contractApprovalAction.ApproverUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Action Code" [value]="contractApprovalAction.ActionCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Action Date Time" [value]="contractApprovalAction.ActionDateTime">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Comments" [value]="contractApprovalAction.Comments">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
