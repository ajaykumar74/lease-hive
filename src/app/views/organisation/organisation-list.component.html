<div class="grid">
	<div class="col-12">
		<div class="card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Organisation List'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="col-12 md:col-6">
				<p-inputGroup>
					<input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword"
						[(ngModel)]="objSearch.Name" />
					<button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button>
				</p-inputGroup>
			</div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3"
				responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						 
						<th pFrozenColumn pSortableColumn="OrganisationId" style="width:200px">Organisation Id <p-sortIcon field="OrganisationId" /> </th>
						<th style="width:200px">Organisation Code <p-sortIcon field="OrganisationCode" /> </th>
						<th style="width:200px">Legal Name <p-sortIcon field="LegalName" /> </th>
						<th style="width:200px">Trade Name <p-sortIcon field="TradeName" /> </th>
						<th style="width:200px">Organisation Type <p-sortIcon field="OrganisationType" /> </th>
						<th style="width:200px">Registration Number <p-sortIcon field="RegistrationNumber" /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{obj.OrganisationId}}" [link]="true"
								(click)="onDetailsClick(obj)" /> </td>
						<td style="width:200px">{{obj.OrganisationCode}}</td>
						<td style="width:200px">{{obj.LegalName}}</td>
						<td style="width:200px">{{obj.TradeName}}</td>
						<td style="width:200px">{{obj.OrganisationType}}</td>
						<td style="width:200px">{{obj.RegistrationNumber}}</td>

					</tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
