<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="SequenceCode" [value]="numberSequence.SequenceCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="EntityType" [value]="numberSequence.EntityType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="OrganisationId" [value]="numberSequence.OrganisationId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Organisation UnitId" [value]="numberSequence.OrganisationUnitId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Prefix Pattern" [value]="numberSequence.PrefixPattern">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Current Number" [value]="numberSequence.CurrentNumber">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Number Length" [value]="numberSequence.NumberLength">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reset Frequency" [value]="numberSequence.ResetFrequency">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Last Reset Date" [value]="numberSequence.LastResetDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Example Number" [value]="numberSequence.ExampleNumber">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="numberSequence.RecordStatus">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="numberSequence.EffectiveFrom">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
