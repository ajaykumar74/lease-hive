<div class="grid list-page generated-list-page">
	<div class="col-12">
		<div class="card list-card generated-list-card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'My Prospects'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner><div class="generated-list-search">
    <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search..." [(ngModel)]="objSearch.Name" (keyup.enter)="search()" aria-label="Search records" />
    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search records" title="Search"></button>
    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div></div>
			<p-table [size]="gridSize" [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
				styleClass="list-table generated-list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:60px">ID <p-sortIcon field="Id" /> </th>
						<th style="width:200px" pSortableColumn="Name">Name <p-sortIcon field="Name" /> </th>
						<th style="width:200px">Email ID </th>
						<th style="width:200px" pSortableColumn="DomainNames">Domain Names <p-sortIcon
								field="DomainNames" /> </th>
						<th style="width:200px">Potential </th>
						<th style="width:200px">City </th>

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr [ngStyle]="rowStyle(obj)">
						<td pFrozenColumn pTooltip="Click here to view details">
							<i class="pi pi-file-edit" style="font-size: small" style="margin-right: -10px;"></i>
							<p-button label="{{obj.Id}}" [link]="true" (click)="onDetailsClick(obj)" />
						</td>
						<td>{{obj.Name}}</td>
						<td>{{obj.EmailIds}}</td>
						<td>{{obj.DomainNames}}</td>
						<td>{{obj.Potentials }}</td>
						<td>{{obj.City}}</td>

					</tr>
				</ng-template>
			</p-table>
			<div class="flex justify-content-center">
				<p-paginator (onPageChange)="onPageChanged($event)" [first]="pgEvent.first" [rows]="pgEvent.rows"
					[totalRecords]="totalNoOfRecords" [rowsPerPageOptions]="[10,20,30,40,50]" />
			</div>
		</div>
	</div>
</div>
