<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Document Id" [value]="uploadSession.DocumentId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Document Version Id" [value]="uploadSession.DocumentVersionId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Expires At UTC" [value]="uploadSession.ExpiresAtUtc">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status" [value]="uploadSession.Status">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Object E Tag" [value]="uploadSession.ObjectETag">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Failure Reason" [value]="uploadSession.FailureReason">
								</app-view-field></div></div>

						<app-audit-details [model]="uploadSession"></app-audit-details>
						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
