<div class="grid list-page generated-list-page">
<div class="col-12">
		<div class="card list-card generated-list-card">
<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'Document Retention Policies'"
					[PageType]="'List'">
				</app-toolbar-buttons>
				<app-spinner></app-spinner>
                <div class="generated-list-search">
                    <div class="generated-list-filter"><label for="documentRetentionPolicy-Code">Code</label><input id="documentRetentionPolicy-Code" type="text" pInputText class="generated-list-input" [(ngModel)]="objSearch.Code" (keyup.enter)="search()" /></div>
                    <div class="generated-list-filter"><label for="documentRetentionPolicy-Name">Name</label><input id="documentRetentionPolicy-Name" type="text" pInputText class="generated-list-input" [(ngModel)]="objSearch.Name" (keyup.enter)="search()" /></div>
                    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search document retention policies" title="Search"></button>
                    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear filters" title="Clear filters"></button>
                    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table generated-list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th>
						 <th style="width:200px">Document Retention Policy Id <p-sortIcon field="DocumentRetentionPolicyId" /> </th>
<th style="width:200px">Code <p-sortIcon field="Code" /> </th>
<th style="width:200px">Name <p-sortIcon field="Name" /> </th>
<th style="width:200px">Retention Days <p-sortIcon field="RetentionDays" /> </th>
<th style="width:200px">Allow User Delete <p-sortIcon field="AllowUserDelete" /> </th>
<th style="width:200px">Is Active <p-sortIcon field="IsActive" /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.DocumentRetentionPolicyId}}</td>
 <td style="width:200px">{{obj.Code}}</td>
 <td style="width:200px">{{obj.Name}}</td>
 <td style="width:200px">{{obj.RetentionDays | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.AllowUserDelete | yesNo }}</td>
 <td style="width:200px">{{obj.IsActive | yesNo }}</td>

					</tr>
				</ng-template>
			</p-table>
			<p-paginator [first]="pgEvent.first" [rows]="pgEvent.rows" [totalRecords]="totalNoOfRecords" [rowsPerPageOptions]="[10, 25, 50]" (onPageChange)="pageChanged($event)"></p-paginator>
		</div>
	</div>
</div>
