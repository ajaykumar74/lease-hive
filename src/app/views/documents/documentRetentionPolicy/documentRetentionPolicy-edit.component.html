<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="Code">Code 
							</label> 
							<input pInputText id="Code" type="text" pSize="small"	formControlName="Code"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('Code')"
											label="Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="Name">Name 
							</label> 
							<input pInputText id="Name" type="text" pSize="small"	formControlName="Name"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('Name')"
											label="Name">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="RetentionDays">Retention Days 
							</label> 
							<p-inputNumber id="RetentionDays"  pSize="small"	formControlName="RetentionDays"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RetentionDays')"
											label="Retention Days">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="AllowUserDelete" binary="true" formControlName="AllowUserDelete">
											</p-checkbox>
											<label for="AllowUserDelete">Allow User Delete</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsActive" binary="true" formControlName="IsActive">
											</p-checkbox>
											<label for="IsActive">Is Active</label>
										</div>
										<div class="validation-space"></div></div></div>

					<app-audit-details [model]="documentRetentionPolicy"></app-audit-details>
					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
