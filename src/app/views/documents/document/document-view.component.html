<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Document Type Id" [value]="document.DocumentTypeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Title" [value]="document.Title">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Issued On" [value]="document.IssuedOn">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Expires On" [value]="document.ExpiresOn">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="External Reference Number" [value]="document.ExternalReferenceNumber">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status" [value]="document.Status">
								</app-view-field></div></div>

						<app-audit-details [model]="document"></app-audit-details>
						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
