<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form>
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full">
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Owner Type" [value]="documentRequirement.OwnerType">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Code" [value]="documentRequirement.Code">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Display Name" [value]="documentRequirement.DisplayName">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Description" [value]="documentRequirement.Description">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Document Type" [value]="documentRequirement.DocumentTypeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Document Retention Policy" [value]="documentRequirement.DocumentRetentionPolicyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Required Mode" [value]="documentRequirement.RequiredMode">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Validation" [value]="documentRequirement.ValidationMode || 'None'">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">
<app-view-field label="Customer Portal Access" [value]="documentRequirement.CustomerPortalAccess">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Condition Code" [value]="documentRequirement.ConditionCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Minimum Count" [value]="documentRequirement.MinCount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Maximum Count" [value]="documentRequirement.MaxCount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Allowed Content Types JSON" [value]="documentRequirement.AllowedContentTypesJson">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Allowed Extensions JSON" [value]="documentRequirement.AllowedExtensionsJson">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Maximum File Size Bytes" [value]="documentRequirement.MaxFileSizeBytes">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requires Issue Date" [value]="documentRequirement.RequiresIssueDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requires Expiry Date" [value]="documentRequirement.RequiresExpiryDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Expiry Warning Days" [value]="documentRequirement.ExpiryWarningDays">
								</app-view-field></div></div>

						<app-audit-details [model]="documentRequirement"></app-audit-details>
						</div>
					</div>
 				</p-fluid>


					</form>
			</div>
		</div>
	</div>
</div>
