 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="OwnerType">Owner Type 
							</label> 
							<input pInputText id="OwnerType" type="text" pSize="small"	formControlName="OwnerType"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('OwnerType')"
											label="Owner Type">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="Code">Code 
							</label> 
							<input pInputText id="Code" type="text" pSize="small"	formControlName="Code"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('Code')"
											label="Code">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="DisplayName">Display Name 
							</label> 
							<input pInputText id="DisplayName" type="text" pSize="small"	formControlName="DisplayName"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('DisplayName')"
											label="Display Name">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="DocumentTypeId" class="mb-1">Document type</label>
        <p-dropdown
            inputId="DocumentTypeId" 
            [options]="documenttypeidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentTypeId"
		[filter]="true"
		filterBy="Text"
		[showClear]="true"
            placeholder="Select document type"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentTypeId')"
											label="Document Type">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="DocumentRetentionPolicyId" class="mb-1">Document retention policy</label>
        <p-dropdown
            inputId="DocumentRetentionPolicyId" 
            [options]="documentretentionpolicyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DocumentRetentionPolicyId"
		[filter]="true"
		filterBy="Text"
            placeholder="Select retention policy"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DocumentRetentionPolicyId')"
											label="Document Retention Policy">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="RequiredMode" class="mb-1">Required mode</label>
        <p-dropdown
            inputId="RequiredMode" 
            [options]="requiredmodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RequiredMode"
            placeholder="Select requirement mode"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RequiredMode')"
											label="Required Mode">
										</app-validation-errors></div><div class="flex flex-col w-full">					
<label for="CustomerPortalAccess" class="mb-1">Customer portal access</label>
<p-dropdown inputId="CustomerPortalAccess" [options]="customerPortalAccessOptions" optionLabel="Text" optionValue="Value" formControlName="CustomerPortalAccess" class="w-full"></p-dropdown>
							<label for="ConditionCode">Condition Code 
							</label> 
							<input pInputText id="ConditionCode" type="text" pSize="small"	formControlName="ConditionCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ConditionCode')"
											label="Condition Code">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="MinCount">Minimum Count 
							</label> 
							<p-inputNumber id="MinCount"  pSize="small"	formControlName="MinCount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('MinCount')"
											label="Minimum Count">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="MaxCount">Maximum Count 
							</label> 
							<p-inputNumber id="MaxCount"  pSize="small"	formControlName="MaxCount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('MaxCount')"
											label="Maximum Count">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Allowed Content Types JSON</label>
                    <textarea size="small" pTextarea placeholder="Type Allowed Content Types JSON" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="AllowedContentTypesJson"
										[ngClass]="{'is-invalid': (editForm.get('AllowedContentTypesJson').touched || editForm.get('AllowedContentTypesJson').dirty) && !editForm.get('AllowedContentTypesJson').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('AllowedContentTypesJson')"
											label="Allowed Content Types JSON">
										</app-validation-errors>


               </div><div class="flex flex-col w-full">                 <label for="address">Allowed Extensions JSON</label>
                    <textarea size="small" pTextarea placeholder="Type Allowed Extensions JSON" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="AllowedExtensionsJson"
										[ngClass]="{'is-invalid': (editForm.get('AllowedExtensionsJson').touched || editForm.get('AllowedExtensionsJson').dirty) && !editForm.get('AllowedExtensionsJson').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('AllowedExtensionsJson')"
											label="Allowed Extensions JSON">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="MaxFileSizeBytes">Maximum File Size Bytes 
							</label> 
							<p-inputNumber id="MaxFileSizeBytes"  pSize="small"	formControlName="MaxFileSizeBytes"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('MaxFileSizeBytes')"
											label="Maximum File Size Bytes">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="RequiresIssueDate" binary="true" formControlName="RequiresIssueDate">
											</p-checkbox>
											<label for="RequiresIssueDate">Requires Issue Date</label>
										</div>
										<div class="validation-space"></div></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="RequiresExpiryDate" binary="true" formControlName="RequiresExpiryDate">
											</p-checkbox>
											<label for="RequiresExpiryDate">Requires Expiry Date</label>
										</div>
										<div class="validation-space"></div></div><div class="flex flex-col w-full">							<label for="ExpiryWarningDays">Expiry Warning Days 
							</label> 
							<p-inputNumber id="ExpiryWarningDays"  pSize="small"	formControlName="ExpiryWarningDays"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ExpiryWarningDays')"
											label="Expiry Warning Days">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"><label class="pt-8"></label>
										<div class="flex items-center gap-2">
											<p-checkbox inputId="IsActive" binary="true" formControlName="IsActive">
											</p-checkbox>
											<label for="IsActive">Is Active</label>
										</div>
										<div class="validation-space"></div></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
