<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Code" [value]="documentType.Code">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Name" [value]="documentType.Name">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Description" [value]="documentType.Description">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Sensitivity Level" [value]="documentType.SensitivityLevel">
								</app-view-field></div></div>

						<app-audit-details [model]="documentType"></app-audit-details>
						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
