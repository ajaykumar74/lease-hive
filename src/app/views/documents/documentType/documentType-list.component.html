<div class="grid"> 
	<div class="col-12">
		<div class="card"> 
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'DocumentType List'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="col-12 md:col-6">
                    <p-inputGroup>                     
                        <input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword" [(ngModel)]="objSearch.Name" />
						<button type="button" pButton label="Search"  class="btn-sm" (click)="search()" ></button>
                    </p-inputGroup>
                </div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						 <th style="width:200px">Document Type Id <p-sortIcon field="DocumentTypeId" /> </th> 
<th style="width:200px">Code <p-sortIcon field="Code" /> </th> 
<th style="width:200px">Name <p-sortIcon field="Name" /> </th> 
<th style="width:200px">Sensitivity Level <p-sortIcon field="SensitivityLevel" /> </th> 
<th style="width:200px">Is Active <p-sortIcon field="IsActive" /> </th> 

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn ><p-button label="{{obj.Id}}" [link]="true"  (click)="onDetailsClick(obj)" /> </td>
                         <td style="width:200px">{{obj.DocumentTypeId}}</td>
 <td style="width:200px">{{obj.Code}}</td>
 <td style="width:200px">{{obj.Name}}</td>
 <td style="width:200px">{{obj.SensitivityLevel | number:'1.0':'en-US' }}</td>
 <td style="width:200px">{{obj.IsActive | yesNo }}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
