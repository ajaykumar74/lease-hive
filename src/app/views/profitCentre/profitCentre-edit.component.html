<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ProfitCentreCode">ProfitCentreCode 
							</label> 
							<input pInputText id="ProfitCentreCode" type="text" pSize="small"	formControlName="ProfitCentreCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ProfitCentreCode')"
											label="ProfitCentreCode">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">					
							<label for="ProfitCentreName">ProfitCentreName 
							</label> 
							<input pInputText id="ProfitCentreName" type="text" pSize="small"	formControlName="ProfitCentreName"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ProfitCentreName')"
											label="ProfitCentreName">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="ParentProfitCentreId" class="mb-1">ParentProfitCentreId</label>
        <p-dropdown
            inputId="ParentProfitCentreId" 
            [options]="parentprofitcentreidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ParentProfitCentreId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ParentProfitCentreId')"
											label="ParentProfitCentreId">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="OrganisationUnitId" class="mb-1">OrganisationUnitId</label>
        <p-dropdown
            inputId="OrganisationUnitId" 
            [options]="organisationunitidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OrganisationUnitId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationUnitId')"
											label="OrganisationUnitId">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="ExternalLedgerCode" class="mb-1">ExternalLedgerCode</label>
        <p-dropdown
            inputId="ExternalLedgerCode" 
            [options]="externalledgercodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ExternalLedgerCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ExternalLedgerCode')"
											label="ExternalLedgerCode">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="RecordStatus" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="RecordStatus">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="EffectiveFrom">EffectiveFrom 
							</label> 
							<p-calendar id="EffectiveFrom"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveFrom"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')"
											label="EffectiveFrom">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EffectiveTo">EffectiveTo 
							</label> 
							<p-calendar id="EffectiveTo"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveTo"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveTo')"
											label="EffectiveTo">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
