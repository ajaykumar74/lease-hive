<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
				<app-spinner></app-spinner>
				<form>
					<div class="grid grid-cols-12 gap-2">
						<label class="flex items-center col-span-12 mb-2 md:col-span-2 md:mb-0 font-medium">
							Name:
						</label>
						<div class="col-span-12 md:col-span-10 flex items-center">
							{{ portalUser?.FirstName || '-' }}
						</div>
					</div>
					<div class="grid grid-cols-12 gap-2">
						<label class="flex items-center col-span-12 mb-2 md:col-span-2 md:mb-0 font-medium">
							EmailId
						</label>
						<div class="col-span-12 md:col-span-10 flex items-center">
							{{ portalUser?.EmailId || '-' }}
						</div>
					</div>
					<div class="grid grid-cols-12 gap-2">
						<label class="flex items-center col-span-12 mb-2 md:col-span-2 md:mb-0 font-medium">
							Mobile Number
						</label>
						<div class="col-span-12 md:col-span-10 flex items-center">
							{{portalUser?.Mobile}}
						</div>
					</div>
					<div class="grid grid-cols-12 gap-2">
						<label class="flex items-center col-span-12 mb-2 md:col-span-2 md:mb-0 font-medium">
							Access Role
						</label>
						<div class="col-span-12 md:col-span-10 flex items-center">
							{{portalUser?.Role}}
						</div>
					</div>
					<div class="grid grid-cols-12 gap-2">
						<label class="flex items-center col-span-12 mb-2 md:col-span-2 md:mb-0 font-medium">
							Department
						</label>
						<div class="col-span-12 md:col-span-10 flex items-center">
							{{portalUser?.Department}}
						</div>
					</div>
					<app-audit-details [model]="portalUser"></app-audit-details>
				</form>
			</div>
		</div>
	</div>
</div>
