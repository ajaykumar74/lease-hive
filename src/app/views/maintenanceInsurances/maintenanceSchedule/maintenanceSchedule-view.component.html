<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Maintenance Plan Id" [value]="maintenanceSchedule.AssetMaintenancePlanId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="maintenanceSchedule.AssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Maintenance Plan Id" [value]="maintenanceSchedule.MaintenancePlanId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Schedule No" [value]="maintenanceSchedule.ScheduleNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Due Date" [value]="maintenanceSchedule.DueDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Due Measure Value" [value]="maintenanceSchedule.DueMeasureValue">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Current Measure Value" [value]="maintenanceSchedule.CurrentMeasureValue">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Due Status Code" [value]="maintenanceSchedule.DueStatusCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Planned Organisation Unit Id" [value]="maintenanceSchedule.PlannedOrganisationUnitId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Preferred Service Provider Party Id" [value]="maintenanceSchedule.PreferredServiceProviderPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Generated From Code" [value]="maintenanceSchedule.GeneratedFromCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="maintenanceSchedule.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
