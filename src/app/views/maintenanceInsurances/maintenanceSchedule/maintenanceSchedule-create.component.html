 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Maintenance Plan Id" class="mb-1">AssetMaintenancePlanId</label>
        <p-dropdown
            inputId="AssetMaintenancePlanId" 
            [options]="assetmaintenanceplanidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetMaintenancePlanId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetMaintenancePlanId')"
											label="Asset Maintenance Plan Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Maintenance Plan Id" class="mb-1">MaintenancePlanId</label>
        <p-dropdown
            inputId="MaintenancePlanId" 
            [options]="maintenanceplanidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MaintenancePlanId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MaintenancePlanId')"
											label="Maintenance Plan Id">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="ScheduleNo">Schedule No 
							</label> 
							<input pInputText id="ScheduleNo" type="text" pSize="small"	formControlName="ScheduleNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ScheduleNo')"
											label="Schedule No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="DueDate">Due Date 
							</label> 
							<p-calendar id="DueDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="DueDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('DueDate')"
											label="Due Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DueMeasureValue">Due Measure Value 
							</label> 
							<p-inputNumber id="DueMeasureValue"  pSize="small"	formControlName="DueMeasureValue"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DueMeasureValue')"
											label="Due Measure Value">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="CurrentMeasureValue">Current Measure Value 
							</label> 
							<p-inputNumber id="CurrentMeasureValue"  pSize="small"	formControlName="CurrentMeasureValue"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('CurrentMeasureValue')"
											label="Current Measure Value">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Due Status Code" class="mb-1">DueStatusCode</label>
        <p-dropdown
            inputId="DueStatusCode" 
            [options]="duestatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DueStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DueStatusCode')"
											label="Due Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Planned Organisation Unit Id" class="mb-1">PlannedOrganisationUnitId</label>
        <p-dropdown
            inputId="PlannedOrganisationUnitId" 
            [options]="plannedorganisationunitidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PlannedOrganisationUnitId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PlannedOrganisationUnitId')"
											label="Planned Organisation Unit Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Preferred Service Provider Party Id" class="mb-1">PreferredServiceProviderPartyId</label>
        <p-dropdown
            inputId="PreferredServiceProviderPartyId" 
            [options]="preferredserviceproviderpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="PreferredServiceProviderPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('PreferredServiceProviderPartyId')"
											label="Preferred Service Provider Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Generated From Code" class="mb-1">GeneratedFromCode</label>
        <p-dropdown
            inputId="GeneratedFromCode" 
            [options]="generatedfromcodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="GeneratedFromCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('GeneratedFromCode')"
											label="Generated From Code">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
