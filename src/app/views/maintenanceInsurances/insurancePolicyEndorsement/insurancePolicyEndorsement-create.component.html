 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Insurance Policy Id" class="mb-1">InsurancePolicyId</label>
        <p-dropdown
            inputId="InsurancePolicyId" 
            [options]="insurancepolicyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsurancePolicyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsurancePolicyId')"
											label="Insurance Policy Id">
										</app-validation-errors></div><div class="flex flex-col w-full">					
							<label for="EndorsementNo">Endorsement No 
							</label> 
							<input pInputText id="EndorsementNo" type="text" pSize="small"	formControlName="EndorsementNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('EndorsementNo')"
											label="Endorsement No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Endorsement Type Code" class="mb-1">EndorsementTypeCode</label>
        <p-dropdown
            inputId="EndorsementTypeCode" 
            [options]="endorsementtypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="EndorsementTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('EndorsementTypeCode')"
											label="Endorsement Type Code">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="EffectiveDate">Effective Date 
							</label> 
							<p-calendar id="EffectiveDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EffectiveDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveDate')"
											label="Effective Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="PremiumDeltaAmount">Premium Delta Amount 
							</label> 
							<p-inputNumber id="PremiumDeltaAmount"  pSize="small"	formControlName="PremiumDeltaAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('PremiumDeltaAmount')"
											label="Premium Delta Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Description</label>
                    <textarea size="small" pTextarea placeholder="Type Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Description"
										[ngClass]="{'is-invalid': (editForm.get('Description').touched || editForm.get('Description').dirty) && !editForm.get('Description').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Description')"
											label="Description">
										</app-validation-errors>


               </div><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
