<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Insurance Policy Id" [value]="insurancePolicyEndorsement.InsurancePolicyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Endorsement No" [value]="insurancePolicyEndorsement.EndorsementNo">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Endorsement Type Code" [value]="insurancePolicyEndorsement.EndorsementTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective Date" [value]="insurancePolicyEndorsement.EffectiveDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Premium Delta Amount" [value]="insurancePolicyEndorsement.PremiumDeltaAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="insurancePolicyEndorsement.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Description" [value]="insurancePolicyEndorsement.Description">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="insurancePolicyEndorsement.StatusCode">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
