<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Insurance Claim Id" [value]="insuranceRecovery.InsuranceClaimId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Recovery Type Code" [value]="insuranceRecovery.RecoveryTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Recovery Party Id" [value]="insuranceRecovery.RecoveryPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Expected Amount" [value]="insuranceRecovery.ExpectedAmount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Recovered Amount" [value]="insuranceRecovery.RecoveredAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="insuranceRecovery.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Recovery Date" [value]="insuranceRecovery.RecoveryDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Finance Reference Id" [value]="insuranceRecovery.FinanceReferenceId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="insuranceRecovery.StatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="insuranceRecovery.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
