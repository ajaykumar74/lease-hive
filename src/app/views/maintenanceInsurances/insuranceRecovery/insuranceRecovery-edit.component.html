<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Insurance Claim Id" class="mb-1">InsuranceClaimId</label>
        <p-dropdown
            inputId="InsuranceClaimId" 
            [options]="insuranceclaimidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsuranceClaimId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsuranceClaimId')"
											label="Insurance Claim Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Recovery Type Code" class="mb-1">RecoveryTypeCode</label>
        <p-dropdown
            inputId="RecoveryTypeCode" 
            [options]="recoverytypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecoveryTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecoveryTypeCode')"
											label="Recovery Type Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Recovery Party Id" class="mb-1">RecoveryPartyId</label>
        <p-dropdown
            inputId="RecoveryPartyId" 
            [options]="recoverypartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecoveryPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecoveryPartyId')"
											label="Recovery Party Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="ExpectedAmount">Expected Amount 
							</label> 
							<p-inputNumber id="ExpectedAmount"  pSize="small"	formControlName="ExpectedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ExpectedAmount')"
											label="Expected Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="RecoveredAmount">Recovered Amount 
							</label> 
							<p-inputNumber id="RecoveredAmount"  pSize="small"	formControlName="RecoveredAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RecoveredAmount')"
											label="Recovered Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="RecoveryDate">Recovery Date 
							</label> 
							<p-calendar id="RecoveryDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RecoveryDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RecoveryDate')"
											label="Recovery Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Finance Reference Id" class="mb-1">FinanceReferenceId</label>
        <p-dropdown
            inputId="FinanceReferenceId" 
            [options]="financereferenceidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="FinanceReferenceId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('FinanceReferenceId')"
											label="Finance Reference Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
