<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="maintenanceRequest.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Maintenance Schedule Id" [value]="maintenanceRequest.MaintenanceScheduleId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Maintenance Type Id" [value]="maintenanceRequest.MaintenanceTypeId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Request Source Code" [value]="maintenanceRequest.RequestSourceCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requested At" [value]="maintenanceRequest.RequestedAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Requested By Party Id" [value]="maintenanceRequest.RequestedByPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Requested By User Id" [value]="maintenanceRequest.RequestedByUserId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Location Id" [value]="maintenanceRequest.LocationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Priority Code" [value]="maintenanceRequest.PriorityCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Problem Description" [value]="maintenanceRequest.ProblemDescription">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="maintenanceRequest.StatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="maintenanceRequest.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
