<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ServiceAgreementNo">Service Agreement No 
							</label> 
							<input pInputText id="ServiceAgreementNo" type="text" pSize="small"	formControlName="ServiceAgreementNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ServiceAgreementNo')"
											label="Service Agreement No">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Organisation Id" class="mb-1">OrganisationId</label>
        <p-dropdown
            inputId="OrganisationId" 
            [options]="organisationidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="OrganisationId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('OrganisationId')"
											label="Organisation Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Service Provider Party Id" class="mb-1">ServiceProviderPartyId</label>
        <p-dropdown
            inputId="ServiceProviderPartyId" 
            [options]="serviceproviderpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ServiceProviderPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ServiceProviderPartyId')"
											label="Service Provider Party Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Agreement Type Code" class="mb-1">AgreementTypeCode</label>
        <p-dropdown
            inputId="AgreementTypeCode" 
            [options]="agreementtypecodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AgreementTypeCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AgreementTypeCode')"
											label="Agreement Type Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="StartDate">Start Date 
							</label> 
							<p-calendar id="StartDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="StartDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('StartDate')"
											label="Start Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EndDate">End Date 
							</label> 
							<p-calendar id="EndDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EndDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EndDate')"
											label="End Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="AgreementValue">Agreement Value 
							</label> 
							<p-inputNumber id="AgreementValue"  pSize="small"	formControlName="AgreementValue"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('AgreementValue')"
											label="Agreement Value">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ResponseTimeHours">Response Time Hours 
							</label> 
							<p-inputNumber id="ResponseTimeHours"  pSize="small"	formControlName="ResponseTimeHours"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ResponseTimeHours')"
											label="Response Time Hours">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ResolutionTimeHours">Resolution Time Hours 
							</label> 
							<p-inputNumber id="ResolutionTimeHours"  pSize="small"	formControlName="ResolutionTimeHours"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ResolutionTimeHours')"
											label="Resolution Time Hours">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
