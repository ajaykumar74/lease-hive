<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Service Agreement No" [value]="serviceAgreement.ServiceAgreementNo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Organisation Id" [value]="serviceAgreement.OrganisationId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Service Provider Party Id" [value]="serviceAgreement.ServiceProviderPartyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Agreement Type Code" [value]="serviceAgreement.AgreementTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Start Date" [value]="serviceAgreement.StartDate">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="End Date" [value]="serviceAgreement.EndDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="serviceAgreement.CurrencyCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Agreement Value" [value]="serviceAgreement.AgreementValue">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Response Time Hours" [value]="serviceAgreement.ResponseTimeHours">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Resolution Time Hours" [value]="serviceAgreement.ResolutionTimeHours">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="serviceAgreement.StatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="serviceAgreement.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
