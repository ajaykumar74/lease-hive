<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Handoff Type Code" [value]="maintenanceInsuranceHandoff.HandoffTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Reference Type Code" [value]="maintenanceInsuranceHandoff.ReferenceTypeCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reference Id" [value]="maintenanceInsuranceHandoff.ReferenceId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Target System" [value]="maintenanceInsuranceHandoff.TargetSystem">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Status Code" [value]="maintenanceInsuranceHandoff.StatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Attempt Count" [value]="maintenanceInsuranceHandoff.AttemptCount">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Last Attempt At" [value]="maintenanceInsuranceHandoff.LastAttemptAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="External Reference" [value]="maintenanceInsuranceHandoff.ExternalReference">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Reason" [value]="maintenanceInsuranceHandoff.Reason">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="maintenanceInsuranceHandoff.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
