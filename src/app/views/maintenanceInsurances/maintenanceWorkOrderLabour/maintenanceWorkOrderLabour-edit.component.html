<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Maintenance Work Order Id" class="mb-1">MaintenanceWorkOrderId</label>
        <p-dropdown
            inputId="MaintenanceWorkOrderId" 
            [options]="maintenanceworkorderidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MaintenanceWorkOrderId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MaintenanceWorkOrderId')"
											label="Maintenance Work Order Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="LabourCode">Labour Code 
							</label> 
							<input pInputText id="LabourCode" type="text" pSize="small"	formControlName="LabourCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('LabourCode')"
											label="Labour Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Technician Party Id" class="mb-1">TechnicianPartyId</label>
        <p-dropdown
            inputId="TechnicianPartyId" 
            [options]="technicianpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="TechnicianPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('TechnicianPartyId')"
											label="Technician Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Technician User Id" class="mb-1">TechnicianUserId</label>
        <p-dropdown
            inputId="TechnicianUserId" 
            [options]="technicianuseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="TechnicianUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('TechnicianUserId')"
											label="Technician User Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="Hours">Hours 
							</label> 
							<p-inputNumber id="Hours"  pSize="small"	formControlName="Hours"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Hours')"
											label="Hours">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="RateAmount">Rate Amount 
							</label> 
							<p-inputNumber id="RateAmount"  pSize="small"	formControlName="RateAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('RateAmount')"
											label="Rate Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="LineAmount">Line Amount 
							</label> 
							<p-inputNumber id="LineAmount"  pSize="small"	formControlName="LineAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineAmount')"
											label="Line Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
