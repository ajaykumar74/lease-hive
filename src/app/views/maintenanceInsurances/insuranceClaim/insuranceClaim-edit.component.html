<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		       <form [formGroup]="editForm" (ngSubmit)="Save()">
 				<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ClaimNo">Claim No 
							</label> 
							<input pInputText id="ClaimNo" type="text" pSize="small"	formControlName="ClaimNo"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ClaimNo')"
											label="Claim No">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Insurance Incident Id" class="mb-1">InsuranceIncidentId</label>
        <p-dropdown
            inputId="InsuranceIncidentId" 
            [options]="insuranceincidentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsuranceIncidentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsuranceIncidentId')"
											label="Insurance Incident Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Insurance Policy Id" class="mb-1">InsurancePolicyId</label>
        <p-dropdown
            inputId="InsurancePolicyId" 
            [options]="insurancepolicyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsurancePolicyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsurancePolicyId')"
											label="Insurance Policy Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Insurance Policy Asset Id" class="mb-1">InsurancePolicyAssetId</label>
        <p-dropdown
            inputId="InsurancePolicyAssetId" 
            [options]="insurancepolicyassetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsurancePolicyAssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsurancePolicyAssetId')"
											label="Insurance Policy Asset Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="InsurerClaimReference">Insurer Claim Reference 
							</label> 
							<input pInputText id="InsurerClaimReference" type="text" pSize="small"	formControlName="InsurerClaimReference"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('InsurerClaimReference')"
											label="Insurer Claim Reference">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Insurance Claim Status Id" class="mb-1">InsuranceClaimStatusId</label>
        <p-dropdown
            inputId="InsuranceClaimStatusId" 
            [options]="insuranceclaimstatusidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsuranceClaimStatusId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsuranceClaimStatusId')"
											label="Insurance Claim Status Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="ClaimLodgedDate">Claim Lodged Date 
							</label> 
							<p-calendar id="ClaimLodgedDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ClaimLodgedDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ClaimLodgedDate')"
											label="Claim Lodged Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="ClaimedAmount">Claimed Amount 
							</label> 
							<p-inputNumber id="ClaimedAmount"  pSize="small"	formControlName="ClaimedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ClaimedAmount')"
											label="Claimed Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ApprovedAmount">Approved Amount 
							</label> 
							<p-inputNumber id="ApprovedAmount"  pSize="small"	formControlName="ApprovedAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ApprovedAmount')"
											label="Approved Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="DeductibleAmount">Deductible Amount 
							</label> 
							<p-inputNumber id="DeductibleAmount"  pSize="small"	formControlName="DeductibleAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('DeductibleAmount')"
											label="Deductible Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Assigned To User Id" class="mb-1">AssignedToUserId</label>
        <p-dropdown
            inputId="AssignedToUserId" 
            [options]="assignedtouseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssignedToUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssignedToUserId')"
											label="Assigned To User Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Rejection Reason</label>
                    <textarea size="small" pTextarea placeholder="Type Rejection Reason" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="RejectionReason"
										[ngClass]="{'is-invalid': (editForm.get('RejectionReason').touched || editForm.get('RejectionReason').dirty) && !editForm.get('RejectionReason').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('RejectionReason')"
											label="Rejection Reason">
										</app-validation-errors>


               </div><div class="flex flex-col w-full">			
							<label for="ClosedDate">Closed Date 
							</label> 
							<p-calendar id="ClosedDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="ClosedDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('ClosedDate')"
											label="Closed Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-wrap" > <div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 	
                     </form>			 

			</div>
		</div>
	</div>
</div>
