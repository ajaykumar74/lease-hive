 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Maintenance Work Order Id" class="mb-1">MaintenanceWorkOrderId</label>
        <p-dropdown
            inputId="MaintenanceWorkOrderId" 
            [options]="maintenanceworkorderidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MaintenanceWorkOrderId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MaintenanceWorkOrderId')"
											label="Maintenance Work Order Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="LineNo">Line No 
							</label> 
							<p-inputNumber id="LineNo"  pSize="small"	formControlName="LineNo"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineNo')"
											label="Line No">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">					
							<label for="ServiceCode">Service Code 
							</label> 
							<input pInputText id="ServiceCode" type="text" pSize="small"	formControlName="ServiceCode"  />
							<app-validation-errors [type]="'text'" [control]="editForm.get('ServiceCode')"
											label="Service Code">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">                 <label for="address">Service Description</label>
                    <textarea size="small" pTextarea placeholder="Type Service Description" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="ServiceDescription"
										[ngClass]="{'is-invalid': (editForm.get('ServiceDescription').touched || editForm.get('ServiceDescription').dirty) && !editForm.get('ServiceDescription').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('ServiceDescription')"
											label="Service Description">
										</app-validation-errors>


               </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Service Provider Party Id" class="mb-1">ServiceProviderPartyId</label>
        <p-dropdown
            inputId="ServiceProviderPartyId" 
            [options]="serviceproviderpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ServiceProviderPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ServiceProviderPartyId')"
											label="Service Provider Party Id">
										</app-validation-errors></div><div class="flex flex-col w-full">							<label for="Quantity">Quantity 
							</label> 
							<p-inputNumber id="Quantity"  pSize="small"	formControlName="Quantity"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('Quantity')"
											label="Quantity">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="UnitAmount">Unit Amount 
							</label> 
							<p-inputNumber id="UnitAmount"  pSize="small"	formControlName="UnitAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('UnitAmount')"
											label="Unit Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="LineAmount">Line Amount 
							</label> 
							<p-inputNumber id="LineAmount"  pSize="small"	formControlName="LineAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('LineAmount')"
											label="Line Amount">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
