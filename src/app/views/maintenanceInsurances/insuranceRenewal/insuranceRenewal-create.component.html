 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Insurance Policy Id" class="mb-1">InsurancePolicyId</label>
        <p-dropdown
            inputId="InsurancePolicyId" 
            [options]="insurancepolicyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsurancePolicyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsurancePolicyId')"
											label="Insurance Policy Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="RenewalDueDate">Renewal Due Date 
							</label> 
							<p-calendar id="RenewalDueDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="RenewalDueDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('RenewalDueDate')"
											label="Renewal Due Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Renewal Status Code" class="mb-1">RenewalStatusCode</label>
        <p-dropdown
            inputId="RenewalStatusCode" 
            [options]="renewalstatuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RenewalStatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RenewalStatusCode')"
											label="Renewal Status Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Proposed Insurer Party Id" class="mb-1">ProposedInsurerPartyId</label>
        <p-dropdown
            inputId="ProposedInsurerPartyId" 
            [options]="proposedinsurerpartyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ProposedInsurerPartyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ProposedInsurerPartyId')"
											label="Proposed Insurer Party Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="ProposedPremiumAmount">Proposed Premium Amount 
							</label> 
							<p-inputNumber id="ProposedPremiumAmount"  pSize="small"	formControlName="ProposedPremiumAmount"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('ProposedPremiumAmount')"
											label="Proposed Premium Amount">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Currency Code" class="mb-1">CurrencyCode</label>
        <p-dropdown
            inputId="CurrencyCode" 
            [options]="currencycodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CurrencyCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CurrencyCode')"
											label="Currency Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="New Insurance Policy Id" class="mb-1">NewInsurancePolicyId</label>
        <p-dropdown
            inputId="NewInsurancePolicyId" 
            [options]="newinsurancepolicyidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="NewInsurancePolicyId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('NewInsurancePolicyId')"
											label="New Insurance Policy Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Assigned To User Id" class="mb-1">AssignedToUserId</label>
        <p-dropdown
            inputId="AssignedToUserId" 
            [options]="assignedtouseridOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssignedToUserId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssignedToUserId')"
											label="Assigned To User Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
