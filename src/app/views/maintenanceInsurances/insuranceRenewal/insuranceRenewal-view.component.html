<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Insurance Policy Id" [value]="insuranceRenewal.InsurancePolicyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Renewal Due Date" [value]="insuranceRenewal.RenewalDueDate">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Renewal Status Code" [value]="insuranceRenewal.RenewalStatusCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Proposed Insurer Party Id" [value]="insuranceRenewal.ProposedInsurerPartyId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Proposed Premium Amount" [value]="insuranceRenewal.ProposedPremiumAmount">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Currency Code" [value]="insuranceRenewal.CurrencyCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="New Insurance Policy Id" [value]="insuranceRenewal.NewInsurancePolicyId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Assigned To User Id" [value]="insuranceRenewal.AssignedToUserId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="insuranceRenewal.Remarks">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="insuranceRenewal.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
