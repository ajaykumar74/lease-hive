 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Maintenance Plan Id" class="mb-1">MaintenancePlanId</label>
        <p-dropdown
            inputId="MaintenancePlanId" 
            [options]="maintenanceplanidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MaintenancePlanId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MaintenancePlanId')"
											label="Maintenance Plan Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="StartDate">Start Date 
							</label> 
							<p-calendar id="StartDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="StartDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('StartDate')"
											label="Start Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">			
							<label for="EndDate">End Date 
							</label> 
							<p-calendar id="EndDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="EndDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('EndDate')"
											label="End Date">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="BaselineDate">Baseline Date 
							</label> 
							<p-calendar id="BaselineDate"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="BaselineDate"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('BaselineDate')"
											label="Baseline Date">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="BaselineMeasureValue">Baseline Measure Value 
							</label> 
							<p-inputNumber id="BaselineMeasureValue"  pSize="small"	formControlName="BaselineMeasureValue"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('BaselineMeasureValue')"
											label="Baseline Measure Value">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">							<label for="OverrideIntervalDays">Override Interval Days 
							</label> 
							<p-inputNumber id="OverrideIntervalDays"  pSize="small"	formControlName="OverrideIntervalDays"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('OverrideIntervalDays')"
											label="Override Interval Days">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full">							<label for="OverrideMeasureValue">Override Measure Value 
							</label> 
							<p-inputNumber id="OverrideMeasureValue"  pSize="small"	formControlName="OverrideMeasureValue"  >
</p-inputNumber>
<app-validation-errors [type]="'number'" [control]="editForm.get('OverrideMeasureValue')"
											label="Override Measure Value">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Status Code" class="mb-1">StatusCode</label>
        <p-dropdown
            inputId="StatusCode" 
            [options]="statuscodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="StatusCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('StatusCode')"
											label="Status Code">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
