<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Coverage Type Code" [value]="insuranceCoverageType.CoverageTypeCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Coverage Type Name" [value]="insuranceCoverageType.CoverageTypeName">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Description" [value]="insuranceCoverageType.Description">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Effective From" [value]="insuranceCoverageType.EffectiveFrom">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Effective To" [value]="insuranceCoverageType.EffectiveTo">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="insuranceCoverageType.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
