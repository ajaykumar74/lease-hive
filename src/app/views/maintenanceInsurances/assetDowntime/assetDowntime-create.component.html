 <div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption"
					[PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				
		      <form [formGroup]="editForm" (ngSubmit)="Save()">
  			<p-fluid>
		      		<div class="flex mt-8">
					<div class="card flex flex-col gap-4 w-full"> 
 					<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Asset Id" class="mb-1">AssetId</label>
        <p-dropdown
            inputId="AssetId" 
            [options]="assetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="AssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('AssetId')"
											label="Asset Id">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Maintenance Work Order Id" class="mb-1">MaintenanceWorkOrderId</label>
        <p-dropdown
            inputId="MaintenanceWorkOrderId" 
            [options]="maintenanceworkorderidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="MaintenanceWorkOrderId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('MaintenanceWorkOrderId')"
											label="Maintenance Work Order Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Insurance Incident Id" class="mb-1">InsuranceIncidentId</label>
        <p-dropdown
            inputId="InsuranceIncidentId" 
            [options]="insuranceincidentidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="InsuranceIncidentId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('InsuranceIncidentId')"
											label="Insurance Incident Id">
										</app-validation-errors></div><div class="flex flex-col w-full">			
							<label for="DowntimeStartAt">Downtime Start At 
							</label> 
							<p-calendar id="DowntimeStartAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="DowntimeStartAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('DowntimeStartAt')"
											label="Downtime Start At">
										</app-validation-errors>
						 </div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">			
							<label for="DowntimeEndAt">Downtime End At 
							</label> 
							<p-calendar id="DowntimeEndAt"  size="small" dateFormat="dd-MM-yy" [showIcon]="true"
	formControlName="DowntimeEndAt"  ></p-calendar>
	<app-validation-errors [type]="'date'" [control]="editForm.get('DowntimeEndAt')"
											label="Downtime End At">
										</app-validation-errors>
						 </div><div class="flex flex-col w-full"> <label for="Downtime Reason Code" class="mb-1">DowntimeReasonCode</label>
        <p-dropdown
            inputId="DowntimeReasonCode" 
            [options]="downtimereasoncodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="DowntimeReasonCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('DowntimeReasonCode')"
											label="Downtime Reason Code">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"> <label for="Customer Impact Code" class="mb-1">CustomerImpactCode</label>
        <p-dropdown
            inputId="CustomerImpactCode" 
            [options]="customerimpactcodeOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="CustomerImpactCode"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('CustomerImpactCode')"
											label="Customer Impact Code">
										</app-validation-errors></div><div class="flex flex-col w-full"> <label for="Replacement Asset Id" class="mb-1">ReplacementAssetId</label>
        <p-dropdown
            inputId="ReplacementAssetId" 
            [options]="replacementassetidOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="ReplacementAssetId"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('ReplacementAssetId')"
											label="Replacement Asset Id">
										</app-validation-errors></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full">                 <label for="address">Remarks</label>
                    <textarea size="small" pTextarea placeholder="Type Remarks" [autoResize]="true" rows="3" class="w-full"
										cols="30" formControlName="Remarks"
										[ngClass]="{'is-invalid': (editForm.get('Remarks').touched || editForm.get('Remarks').dirty) && !editForm.get('Remarks').valid }"></textarea>
<app-validation-errors [type]="'text'" [control]="editForm.get('Remarks')"
											label="Remarks">
										</app-validation-errors>


               </div><div class="flex flex-col w-full"> <label for="Record Status" class="mb-1">RecordStatus</label>
        <p-dropdown
            inputId="RecordStatus" 
            [options]="recordstatusOptions"
            optionLabel="Text"
	    optionValue="Value"
	    formControlName="RecordStatus"
            placeholder="Select One"
            class="w-full">
        </p-dropdown>
      <app-validation-errors [type]="'text'" [control]="editForm.get('RecordStatus')"
											label="Record Status">
										</app-validation-errors></div></div>

					</div>
				</div>
 			</p-fluid> 				 
                     </form>				 

			</div>
		</div>
	</div>
</div>
