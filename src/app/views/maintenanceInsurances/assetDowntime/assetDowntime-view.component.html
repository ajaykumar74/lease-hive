<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Asset Id" [value]="assetDowntime.AssetId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Maintenance Work Order Id" [value]="assetDowntime.MaintenanceWorkOrderId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Insurance Incident Id" [value]="assetDowntime.InsuranceIncidentId">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Downtime Start At" [value]="assetDowntime.DowntimeStartAt">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Downtime End At" [value]="assetDowntime.DowntimeEndAt">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Downtime Reason Code" [value]="assetDowntime.DowntimeReasonCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Customer Impact Code" [value]="assetDowntime.CustomerImpactCode">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Replacement Asset Id" [value]="assetDowntime.ReplacementAssetId">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4"><div class="flex flex-col w-full"><app-view-field label="Remarks" [value]="assetDowntime.Remarks">
								</app-view-field></div><div class="flex flex-col w-full"><app-view-field label="Record Status" [value]="assetDowntime.RecordStatus">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
