<div class="grid"><div class="col-12"><div class="card"><app-message [AlertType]="'message'"></app-message><app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" Caption="Tenant Subscriptions" PageType="List"></app-toolbar-buttons><app-spinner></app-spinner><div class="col-12 md:col-6 p-0 mb-3"><p-inputGroup><input pInputText class="p-inputtext-sm" placeholder="Search status" [(ngModel)]="objSearch.Name"><button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button></p-inputGroup></div><p-table [value]="lstMain" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll"><ng-template pTemplate="header"><tr><th style="width:6rem">Id</th><th>Tenant</th><th>Subscription Plan</th><th>Status</th><th style="width:10rem">Start Date</th><th style="width:10rem">End Date</th></tr></ng-template><ng-template pTemplate="body" let-obj><tr><td><p-button [label]="obj.Id" [link]="true" (click)="onDetailsClick(obj)"></p-button></td><td>{{ obj.TenantName || obj.TenantId }}</td><td>{{ obj.SubscriptionPlanName || obj.SubscriptionPlanId }}</td><td>{{ obj.SubscriptionStatus }}</td><td>{{ obj.StartDate | date:'dd-MMM-yyyy' }}</td><td>{{ obj.EndDate | date:'dd-MMM-yyyy' }}</td></tr></ng-template></p-table></div></div></div>
