<div class="container"><div class="grid"><div class="col-12"><div class="card p-fluid"><app-message [AlertType]="'message'"></app-message><app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'Details'" [form]="editForm"></app-toolbar-buttons><app-spinner></app-spinner><form [formGroup]="editForm" (ngSubmit)="save()"><div class="grid mt-4">
  <div class="col-12 md:col-6"><label for="TenantId">Tenant</label><p-dropdown inputId="TenantId" [options]="tenantIdOptions" optionLabel="Text" optionValue="Value" formControlName="TenantId" placeholder="Select tenant"></p-dropdown></div>
  <div class="col-12 md:col-6"><label for="SubscriptionPlanId">Subscription plan</label><p-dropdown inputId="SubscriptionPlanId" [options]="subscriptionPlanIdOptions" optionLabel="Text" optionValue="Value" formControlName="SubscriptionPlanId" placeholder="Select plan"></p-dropdown></div>
  <div class="col-12 md:col-6"><label for="SubscriptionStatus">Subscription status</label><p-dropdown inputId="SubscriptionStatus" [options]="subscriptionStatusOptions" optionLabel="Text" optionValue="Value" formControlName="SubscriptionStatus" placeholder="Select status"></p-dropdown></div>
  <div class="col-12 md:col-6"><label for="StartDate">Start date</label><p-calendar inputId="StartDate" dateFormat="dd-M-yy" [showIcon]="true" formControlName="StartDate"></p-calendar></div>
  <div class="col-12 md:col-6"><label for="EndDate">End date</label><p-calendar inputId="EndDate" dateFormat="dd-M-yy" [showIcon]="true" formControlName="EndDate"></p-calendar></div>
</div></form></div></div></div></div>
