<div class="grid"><div class="col-12"><div class="card"><app-message [AlertType]="'message'"></app-message><app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" Caption="Tenant Security Policies" PageType="List"></app-toolbar-buttons><app-spinner></app-spinner><p-table [value]="lstMain" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll"><ng-template pTemplate="header"><tr><th style="width:6rem">Id</th><th>Tenant</th><th style="width:10rem">MFA Required</th><th>Session Timeout</th><th>Status</th></tr></ng-template><ng-template pTemplate="body" let-obj><tr><td><p-button [label]="obj.Id" [link]="true" (click)="onDetailsClick(obj)"></p-button></td><td>{{ obj.TenantName || obj.TenantId }}</td><td>{{ obj.MFAEnabled | yesNo }}</td><td>{{ obj.SessionTimeoutMinutes }} minutes</td><td>{{ obj.RecordStatus }}</td></tr></ng-template></p-table></div></div></div>
