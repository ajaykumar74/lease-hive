<div class="container">
  <div class="grid">
    <div class="col-12 md:col-12">
      <div class="card p-fluid">
        <app-message [AlertType]="'message'"></app-message>
        <app-toolbar-buttons
          (onItemClicked)="onOptionItemClicked($event)"
          [permission]="permission"
          [Caption]="Caption"
          [PageType]="'Details'"
          [form]="editForm">
        </app-toolbar-buttons>
        <app-spinner></app-spinner>

        <form [formGroup]="editForm" (ngSubmit)="save()">
          <p-fluid>
            <div class="flex mt-8">
              <div class="card flex flex-col gap-4 w-full">
                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="TenantId">Tenant</label>
                    <p-dropdown
                      inputId="TenantId"
                      [options]="tenantIdOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="TenantId"
                      placeholder="Select tenant"
                      (onChange)="loadRecordStatuses()">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('TenantId')"
                      label="Tenant">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="MFAEnabled">Multi-factor authentication</label>
                    <div class="flex align-items-center h-3rem">
                      <p-checkbox inputId="MFAEnabled" binary="true" formControlName="MFAEnabled"></p-checkbox>
                      <label class="ml-2 mb-0" for="MFAEnabled">Require MFA</label>
                    </div>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="SessionTimeoutMinutes">Session timeout (minutes)</label>
                    <p-inputNumber
                      inputId="SessionTimeoutMinutes"
                      formControlName="SessionTimeoutMinutes">
                    </p-inputNumber>
                    <app-validation-errors
                      [type]="'number'"
                      [control]="editForm.get('SessionTimeoutMinutes')"
                      label="Session timeout">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="RecordStatus">Record status</label>
                    <p-dropdown
                      inputId="RecordStatus"
                      [options]="recordStatusOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="RecordStatus"
                      placeholder="Select status">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('RecordStatus')"
                      label="Record status">
                    </app-validation-errors>
                  </div>
                </div>
              </div>
            </div>
          </p-fluid>
        </form>
      </div>
    </div>
  </div>
</div>
