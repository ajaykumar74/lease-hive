<div class="container"><div class="grid"><div class="col-12"><div class="card p-fluid">
  <app-message [AlertType]="'message'"></app-message>
  <app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="Caption" [PageType]="'Details'" [form]="editForm"></app-toolbar-buttons>
  <app-spinner></app-spinner>
  <form [formGroup]="editForm" (ngSubmit)="save()"><div class="grid mt-4">
    <div class="col-12 md:col-6"><label for="TenantId">Tenant</label><p-dropdown inputId="TenantId" [options]="tenantIdOptions" optionLabel="Text" optionValue="Value" formControlName="TenantId" placeholder="Select tenant"></p-dropdown><app-validation-errors [type]="'text'" [control]="editForm.get('TenantId')" label="Tenant"></app-validation-errors></div>
    <div class="col-12 md:col-6"><label for="FeatureId">Feature definition</label><p-dropdown inputId="FeatureId" [options]="featureIdOptions" optionLabel="Text" optionValue="Value" formControlName="FeatureId" placeholder="Select feature definition"></p-dropdown><app-validation-errors [type]="'text'" [control]="editForm.get('FeatureId')" label="Feature definition"></app-validation-errors></div>
    <div class="col-12 md:col-6 flex align-items-end"><p-checkbox inputId="IsEnabled" binary="true" formControlName="IsEnabled"></p-checkbox><label class="ml-2" for="IsEnabled">Feature enabled</label></div>
    <div class="col-12 md:col-6"><label for="EffectiveFrom">Effective from</label><p-calendar inputId="EffectiveFrom" dateFormat="dd-M-yy" [showIcon]="true" formControlName="EffectiveFrom"></p-calendar><app-validation-errors [type]="'date'" [control]="editForm.get('EffectiveFrom')" label="Effective from"></app-validation-errors></div>
    <div class="col-12 md:col-6"><label for="EffectiveTo">Effective to</label><p-calendar inputId="EffectiveTo" dateFormat="dd-M-yy" [showIcon]="true" formControlName="EffectiveTo"></p-calendar></div>
  </div></form>
</div></div></div></div>
