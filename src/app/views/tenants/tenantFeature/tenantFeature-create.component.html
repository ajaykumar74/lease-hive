<div class="container">
  <div class="grid">
    <div class="col-12 md:col-12">
      <div class="card p-fluid">
        <app-message [AlertType]="'message'"></app-message>
        <app-toolbar-buttons
          (onItemClicked)="onOptionItemClicked($event)"
          [permission]="permission"
          [Caption]="Caption"
          [PageType]="'Details'"
          [form]="editForm">
        </app-toolbar-buttons>
        <app-spinner></app-spinner>

        <form [formGroup]="editForm" (ngSubmit)="save()">
          <p-fluid>
            <div class="flex mt-8">
              <div class="card flex flex-col gap-4 w-full">
                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="TenantId">Tenant</label>
                    <p-dropdown
                      inputId="TenantId"
                      [options]="tenantIdOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="TenantId"
                      placeholder="Select tenant">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('TenantId')"
                      label="Tenant">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="FeatureId">Feature definition</label>
                    <p-dropdown
                      inputId="FeatureId"
                      [options]="featureIdOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="FeatureId"
                      placeholder="Select feature definition">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('FeatureId')"
                      label="Feature definition">
                    </app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="IsEnabled">Status</label>
                    <div class="flex align-items-center h-3rem">
                      <p-checkbox inputId="IsEnabled" binary="true" formControlName="IsEnabled"></p-checkbox>
                      <label class="ml-2 mb-0" for="IsEnabled">Feature enabled</label>
                    </div>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="EffectiveFrom">Effective from</label>
                    <p-calendar
                      inputId="EffectiveFrom"
                      dateFormat="dd-M-yy"
                      [showIcon]="true"
                      formControlName="EffectiveFrom">
                    </p-calendar>
                    <app-validation-errors
                      [type]="'date'"
                      [control]="editForm.get('EffectiveFrom')"
                      label="Effective from">
                    </app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="EffectiveTo">Effective to</label>
                    <p-calendar
                      inputId="EffectiveTo"
                      dateFormat="dd-M-yy"
                      [showIcon]="true"
                      formControlName="EffectiveTo">
                    </p-calendar>
                  </div>
                  <div class="w-full"></div>
                </div>
              </div>
            </div>
          </p-fluid>
        </form>
      </div>
    </div>
  </div>
</div>
