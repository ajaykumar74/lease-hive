<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'View'"></app-toolbar-buttons>
					<app-spinner></app-spinner>
					<form> 
				<p-fluid>
		      			<div class="flex mt-8">
						<div class="card flex flex-col gap-4 w-full"> 
 						<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
<app-view-field label="Tenant Notification" [value]="tenantNotificationRecipientRule.TenantNotificationId">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Recipient Type" [value]="tenantNotificationRecipientRule.RecipientType">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
<app-view-field label="Source Type" [value]="tenantNotificationRecipientRule.SourceType">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Context Key" [value]="tenantNotificationRecipientRule.ContextKey">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
<app-view-field label="Department" [value]="tenantNotificationRecipientRule.DepartmentId">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Role Code" [value]="tenantNotificationRecipientRule.RoleCode">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
<app-view-field label="Contact" [value]="tenantNotificationRecipientRule.ContactId">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Fixed Email" [value]="tenantNotificationRecipientRule.FixedEmail">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
<app-view-field label="Sort Order" [value]="tenantNotificationRecipientRule.SortOrder">
								</app-view-field></div><div class="flex flex-col w-full">
<app-view-field label="Is Required" [value]="tenantNotificationRecipientRule.IsRequired">
								</app-view-field></div></div>
<div class="flex flex-col md:flex-row gap-4">
<div class="flex flex-col w-full">
<app-view-field label="Active" [value]="tenantNotificationRecipientRule.IsActive">
								</app-view-field></div></div>

						</div>
					</div>
 				</p-fluid> 	


					</form>
			</div>
		</div>
	</div>
</div>
