<div class="container">
  <div class="grid">
    <div class="col-12 md:col-12">
      <div class="card p-fluid">
        <app-message [AlertType]="'message'"></app-message>
        <app-toolbar-buttons
          (onItemClicked)="onOptionItemClicked($event)"
          [permission]="permission"
          [Caption]="Caption"
          [PageType]="'Details'"
          [form]="editForm">
        </app-toolbar-buttons>
        <app-spinner></app-spinner>

        <form [formGroup]="editForm" (ngSubmit)="save()">
          <p-fluid>
            <div class="flex mt-8">
              <div class="card flex flex-col gap-4 w-full">
                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="TenantId">Tenant</label>
                    <p-dropdown
                      inputId="TenantId"
                      [options]="tenantIdOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="TenantId"
                      placeholder="Select tenant"
                      (onChange)="loadStatuses()">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('TenantId')"
                      label="Tenant">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="Email">Email</label>
                    <input pInputText id="Email" formControlName="Email" type="email" />
                    <app-validation-errors
                      [type]="'email'"
                      [control]="editForm.get('Email')"
                      label="Email">
                    </app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="InvitedUserName">Invited user name</label>
                    <input pInputText id="InvitedUserName" formControlName="InvitedUserName" type="text" />
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('InvitedUserName')"
                      label="Invited user name">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="InvitationStatus">Invitation status</label>
                    <p-dropdown
                      inputId="InvitationStatus"
                      [options]="invitationStatusOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="InvitationStatus"
                      placeholder="Select status">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('InvitationStatus')"
                      label="Invitation status">
                    </app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="ExpiresAt">Expires at</label>
                    <p-calendar
                      inputId="ExpiresAt"
                      [showTime]="true"
                      [showIcon]="true"
                      formControlName="ExpiresAt">
                    </p-calendar>
                    <app-validation-errors
                      [type]="'date'"
                      [control]="editForm.get('ExpiresAt')"
                      label="Expires at">
                    </app-validation-errors>
                  </div>
                  <div class="w-full"></div>
                </div>
              </div>
            </div>
          </p-fluid>
        </form>
      </div>
    </div>
  </div>
</div>
