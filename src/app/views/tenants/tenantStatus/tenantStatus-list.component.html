<div class="grid list-page generated-list-page">
	<div class="col-12">
		<div class="card list-card generated-list-card">
            <app-message [AlertType]="'message'"></app-message> 
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" [Caption]="'Tenant Statuses'"
					[PageType]="'List'">
				</app-toolbar-buttons> 
				<app-spinner></app-spinner>
				<div class="generated-list-search">
                        <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search tenant statuses..." [(ngModel)]="objSearch.Name" (keyup.enter)="search()" aria-label="Search tenant statuses" />
						<button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search tenant statuses" title="Search"></button>
						<button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
                        <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div>
                </div>
			<p-table [value]="lstMain" [loading]="isLoading" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table generated-list-table" responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="Id" style="width:200px">Id <p-sortIcon field="Id" /> </th> 
						<th pSortableColumn="TenantId" style="width:240px">Tenant <p-sortIcon field="TenantId" /></th>
						<th pSortableColumn="Status" style="width:200px">Status <p-sortIcon field="Status" /></th>
						<th pSortableColumn="Description" style="width:200px">Description <p-sortIcon field="Description" /></th>

					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{ obj.Id }}" [link]="true" (click)="onDetailsClick(obj)" /></td>
                        <td style="width:240px">{{ getTenantLabel(obj.TenantId) }}</td>
                        <td style="width:200px"><app-status-pill [value]="obj.Status"></app-status-pill></td>
                        <td style="width:200px">{{ obj.Description }}</td>
 
					</tr>
				</ng-template>
			</p-table>
		</div>
	</div> 
</div>
