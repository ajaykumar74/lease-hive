<div class="grid">
	<div class="col-12">
		<div class="card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'Tenant List'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="col-12 md:col-6">
				<p-inputGroup>
					<input type="text" class="p-inputtext-sm" pInputText placeholder="Keyword"
						[(ngModel)]="objSearch.Name" />
					<button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button>
				</p-inputGroup>
			</div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="mt-3"
				responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="TenantId" style="width:200px">TenantId <p-sortIcon field="Id" /> </th> 
						<th style="width:200px">Tenant Code <p-sortIcon field="TenantCode" /> </th>
						<th style="width:200px">Tenant Name <p-sortIcon field="TenantName" /> </th>
						<th style="width:200px">Legal Name <p-sortIcon field="LegalName" /> </th>
						<th style="width:200px">Base Country <p-sortIcon field="BaseCountry" /> </th>
						<th style="width:200px">Currency <p-sortIcon field="DefaultCurrency" /> </th>
						<th style="width:200px">Status <p-sortIcon field="Status" /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{obj.TenantId}}" [link]="true"
								(click)="onDetailsClick(obj)" /> </td>					 
						<td style="width:200px">{{obj.TenantCode}}</td>
						<td style="width:200px">{{obj.TenantName}}</td>
						<td style="width:200px">{{obj.LegalName}}</td>
						<td style="width:200px">{{obj.BaseCountry}}</td>
						<td style="width:200px">{{obj.DefaultCurrency}}</td>
						<td style="width:200px">{{obj.Status}}</td>

					</tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
