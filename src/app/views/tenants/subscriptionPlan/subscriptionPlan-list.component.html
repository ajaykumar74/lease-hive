<div class="grid list-page generated-list-page">
	<div class="col-12">
		<div class="card list-card generated-list-card">
			<app-message [AlertType]="'message'"></app-message>
			<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
				[Caption]="'SubscriptionPlan List'" [PageType]="'List'">
			</app-toolbar-buttons>
			<app-spinner></app-spinner>
			<div class="generated-list-search">
    <input type="search" class="p-inputtext-sm generated-list-input" pInputText placeholder="Search..." [(ngModel)]="objSearch.Name" (keyup.enter)="search()" aria-label="Search records" />
    <button type="button" pButton icon="pi pi-search" class="generated-list-action" (click)="search()" aria-label="Search records" title="Search"></button>
    <button type="button" pButton icon="pi pi-times" class="generated-list-action generated-list-clear" (click)="clearSearch()" aria-label="Clear search" title="Clear search"></button>
    <div class="record-count-inline generated-list-count" aria-live="polite"><i class="pi pi-list"></i><strong>{{ totalNoOfRecords }}</strong><span>records</span></div>
</div>
			<p-table [value]="lstMain" scrollDirection="both" [scrollable]="true" scrollHeight="400px" styleClass="list-table generated-list-table"
				responsiveLayout="scroll">
				<ng-template pTemplate="header">
					<tr>
						<th pFrozenColumn pSortableColumn="SubscriptionPlanId" style="width:200px">Subscription Plan ID <p-sortIcon field="SubscriptionPlanId" /> </th>
  						<th style="width:200px">Plan Code <p-sortIcon field="PlanCode" /> </th>
						<th style="width:200px">Plan Name <p-sortIcon field="PlanName" /> </th>
						<th style="width:200px">Max Users <p-sortIcon field="MaxUsers" /> </th>
						<th style="width:200px">Max Assets <p-sortIcon field="MaxAssets" /> </th>
						<th style="width:200px">Storage GB <p-sortIcon field="StorageGB" /> </th>


					</tr>
				</ng-template>
				<ng-template pTemplate="body" let-obj>
					<tr>
						<td style="width:200px" pFrozenColumn><p-button label="{{obj.SubscriptionPlanId}}" [link]="true"
								(click)="onDetailsClick(obj)" /> </td>
						<td style="width:200px">{{obj.PlanCode}}</td>
						<td style="width:200px">{{obj.PlanName}}</td>
						<td style="width:200px">{{obj.MaxUsers | number:'1.0':'en-US' }}</td>
						<td style="width:200px">{{obj.MaxAssets | number:'1.0':'en-US' }}</td>
						<td style="width:200px">{{obj.StorageGB | number:'1.0':'en-US' }}</td>

					</tr>
				</ng-template>
			</p-table>
		</div>
	</div>
</div>
