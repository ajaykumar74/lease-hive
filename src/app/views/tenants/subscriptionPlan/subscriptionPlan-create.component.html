<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons>
				<app-spinner></app-spinner>

				<form [formGroup]="editForm" (ngSubmit)="Save()">
					<p-fluid>
						<div class="flex mt-8">
							<div class="card flex flex-col gap-4 w-full">
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">

										<label for="PlanCode">Plan Code
										</label>
										<input pInputText id="PlanCode" type="text" pSize="small"
											formControlName="PlanCode" />
										<app-validation-errors [type]="'text'" [control]="editForm.get('PlanCode')"
											label="Plan Code">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="PlanName">Plan Name
										</label>
										<input pInputText id="PlanName" type="text" pSize="small"
											formControlName="PlanName" />
										<app-validation-errors [type]="'text'" [control]="editForm.get('PlanName')"
											label="Plan Name">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="MaxUsers">Max Users
										</label>
										<p-inputNumber id="MaxUsers" pSize="small" formControlName="MaxUsers">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('MaxUsers')"
											label="Max Users">
										</app-validation-errors>

									</div>
									<div class="flex flex-col w-full">
										<label for="MaxAssets">Max Assets
										</label>
										<p-inputNumber id="MaxAssets" pSize="small" formControlName="MaxAssets">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('MaxAssets')"
											label="Max Assets">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="StorageGB">Storage GB
										</label>
										<p-inputNumber id="StorageGB" pSize="small" formControlName="StorageGB">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('StorageGB')"
											label="Storage GB">
										</app-validation-errors>
									</div>
								</div>

							</div>
						</div>
					</p-fluid>
				</form>

			</div>
		</div>
	</div>
</div>
