<div class="container">
	<div class="grid">
		<div class="col-12 md:col-12">
			<div class="card p-fluid">
				<app-message [AlertType]="'message'"></app-message>
				<app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission"
					[Caption]="Caption" [PageType]="'Details'" [form]="editForm">
				</app-toolbar-buttons>
				<app-spinner></app-spinner>

				<form [formGroup]="editForm" (ngSubmit)="Save()">
					<p-fluid>
						<div class="flex mt-8">
							<div class="card flex flex-col gap-4 w-full">
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">

										<label for="PlanCode">Plan Code
										</label>
										<input pInputText id="PlanCode" type="text" pSize="small"
											formControlName="PlanCode" />
										<app-validation-errors [type]="'text'" [control]="editForm.get('PlanCode')"
											label="Plan Code">
										</app-validation-errors>
									</div>
									<div class="flex flex-col w-full">
										<label for="PlanName">Plan Name
										</label>
										<input pInputText id="PlanName" type="text" pSize="small"
											formControlName="PlanName" />
										<app-validation-errors [type]="'text'" [control]="editForm.get('PlanName')"
											label="Plan Name">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="MaxUsers">Max Users
										</label>
										<p-inputNumber id="MaxUsers" pSize="small" formControlName="MaxUsers">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('MaxUsers')"
											label="Max Users">
										</app-validation-errors>

									</div>
									<div class="flex flex-col w-full">
										<label for="MaxAssets">Max Assets
										</label>
										<p-inputNumber id="MaxAssets" pSize="small" formControlName="MaxAssets">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('MaxAssets')"
											label="Max Assets">
										</app-validation-errors>
									</div>
								</div>
								<div class="flex flex-col md:flex-row gap-4">
									<div class="flex flex-col w-full">
										<label for="StorageGB">Storage GB
										</label>
										<p-inputNumber id="StorageGB" pSize="small" formControlName="StorageGB">
										</p-inputNumber>
										<app-validation-errors [type]="'number'" [control]="editForm.get('StorageGB')"
											label="Storage GB">
										</app-validation-errors>
									</div>
								</div>

								<section class="mt-4" aria-labelledby="plan-features-heading">
									<div class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-2 mb-3">
										<div>
											<h3 id="plan-features-heading" class="m-0">Included Features</h3>
											<p class="m-0 mt-1 text-sm text-color-secondary">Select the system FeatureCodes included with this subscription plan.</p>
										</div>
									</div>
									<p-table [value]="featureCodeOptions" [scrollable]="true" scrollHeight="320px" styleClass="p-datatable-sm">
										<ng-template pTemplate="header">
											<tr>
											<th>Name</th>
												<th>Description</th>
												<th style="width: 16rem">
													<div class="flex align-items-center gap-1">
														<span>Included</span>
														<button type="button" pButton label="Select all" class="p-button-text p-button-sm" (click)="selectAllFeatures()"></button>
														<span aria-hidden="true">|</span>
														<button type="button" pButton label="Clear" class="p-button-text p-button-sm" (click)="clearFeatures()"></button>
													</div>
												</th>
											</tr>
										</ng-template>
										<ng-template pTemplate="body" let-feature>
											<tr>
												<td><code>{{ feature.Value }}</code></td>
												<td>{{ feature.Text || feature.Value }}</td>
												<td>
													<p-checkbox [binary]="true" [ngModel]="isFeatureSelected(feature)"
														[ngModelOptions]="{ standalone: true }"
														(onChange)="onFeatureSelectionChanged(feature, $event.checked)">
													</p-checkbox>
												</td>
											</tr>
										</ng-template>
									</p-table>
								</section>

							</div>
						</div>
					</p-fluid>
				</form>

			</div>
		</div>
	</div>
</div>
