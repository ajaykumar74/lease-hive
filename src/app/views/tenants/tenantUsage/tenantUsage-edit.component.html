<div class="container">
  <div class="grid">
    <div class="col-12 md:col-12">
      <div class="card p-fluid">
        <app-message [AlertType]="'message'"></app-message>
        <app-toolbar-buttons
          (onItemClicked)="onOptionItemClicked($event)"
          [permission]="permission"
          [Caption]="Caption"
          [PageType]="'Details'"
          [form]="editForm">
        </app-toolbar-buttons>
        <app-spinner></app-spinner>

        <form [formGroup]="editForm" (ngSubmit)="save()">
          <p-fluid>
            <div class="flex mt-8">
              <div class="card flex flex-col gap-4 w-full">
                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="TenantId">Tenant</label>
                    <p-dropdown
                      inputId="TenantId"
                      [options]="tenantIdOptions"
                      optionLabel="Text"
                      optionValue="Value"
                      formControlName="TenantId"
                      placeholder="Select tenant">
                    </p-dropdown>
                    <app-validation-errors
                      [type]="'text'"
                      [control]="editForm.get('TenantId')"
                      label="Tenant">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="LastCalculatedAt">Calculated at</label>
                    <p-calendar
                      inputId="LastCalculatedAt"
                      [showTime]="true"
                      [showIcon]="true"
                      formControlName="LastCalculatedAt">
                    </p-calendar>
                    <app-validation-errors
                      [type]="'date'"
                      [control]="editForm.get('LastCalculatedAt')"
                      label="Calculated at">
                    </app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="ActiveUsers">Active users</label>
                    <p-inputNumber inputId="ActiveUsers" formControlName="ActiveUsers"></p-inputNumber>
                    <app-validation-errors
                      [type]="'number'"
                      [control]="editForm.get('ActiveUsers')"
                      label="Active users">
                    </app-validation-errors>
                  </div>

                  <div class="flex flex-col w-full">
                    <label for="ActiveAssets">Active assets</label>
                    <p-inputNumber inputId="ActiveAssets" formControlName="ActiveAssets"></p-inputNumber>
                    <app-validation-errors
                      [type]="'number'"
                      [control]="editForm.get('ActiveAssets')"
                      label="Active assets">
                    </app-validation-errors>
                  </div>
                </div>

                <div class="flex flex-col md:flex-row gap-4">
                  <div class="flex flex-col w-full">
                    <label for="AiRequestsThisMonth">AI requests this month</label>
                    <p-inputNumber
                      inputId="AiRequestsThisMonth"
                      formControlName="AiRequestsThisMonth">
                    </p-inputNumber>
                    <app-validation-errors
                      [type]="'number'"
                      [control]="editForm.get('AiRequestsThisMonth')"
                      label="AI requests this month">
                    </app-validation-errors>
                  </div>
                  <div class="w-full"></div>
                </div>
              </div>
            </div>
          </p-fluid>
        </form>
      </div>
    </div>
  </div>
</div>
