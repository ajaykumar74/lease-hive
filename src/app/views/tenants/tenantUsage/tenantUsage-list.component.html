<div class="grid"><div class="col-12"><div class="card"><app-message [AlertType]="'message'"></app-message><app-toolbar-buttons (onItemClicked)="onOptionItemClicked($event)" [permission]="permission" Caption="Tenant Usage" PageType="List"></app-toolbar-buttons><app-spinner></app-spinner><div class="col-12 md:col-6 p-0 mb-3"><p-inputGroup><input pInputText class="p-inputtext-sm" placeholder="Search tenant" [(ngModel)]="objSearch.Name"><button type="button" pButton label="Search" class="btn-sm" (click)="search()"></button></p-inputGroup></div><p-table [value]="lstMain" [scrollable]="true" scrollHeight="400px" styleClass="list-table" responsiveLayout="scroll"><ng-template pTemplate="header"><tr><th style="width:6rem">Id</th><th>Tenant</th><th>Active Users</th><th>Active Assets</th><th>AI Requests</th><th>Calculated At</th></tr></ng-template><ng-template pTemplate="body" let-obj><tr><td><p-button [label]="obj.Id" [link]="true" (click)="onDetailsClick(obj)"></p-button></td><td>{{ obj.TenantName || obj.TenantId }}</td><td>{{ obj.ActiveUsers | number:'1.0':'en-US' }}</td><td>{{ obj.ActiveAssets | number:'1.0':'en-US' }}</td><td>{{ obj.AiRequestsThisMonth | number:'1.0':'en-US' }}</td><td>{{ obj.LastCalculatedAt | date:'dd-MMM-yyyy HH:mm' }}</td></tr></ng-template></p-table></div></div></div>
